m bảo mật.","e":"Mỗi dòng log có correlation ID để theo dõi một giao dịch qua 5 dịch vụ khác nhau."},{"n":"Distributed tracing","d":"Theo dõi một yêu cầu đi qua nhiều dịch vụ, ghi lại thời gian ở từng bước (span).","k":"Phát hiện dịch vụ nào gây chậm trong chuỗi gọi; OpenTelemetry là chuẩn mở phổ biến.","c":"Lấy mẫu trace quá thấp có thể bỏ sót đúng những yêu cầu lỗi cần phân tích.","e":"Trace cho thấy 80% thời gian xử lý hồ sơ vay nằm ở lời gọi API chấm điểm tín dụng bên ngoài."},{"n":"Cảnh báo","d":"Thông báo tự động khi hệ thống vượt ngưỡng hoặc có dấu hiệu bất thường.","k":"Cảnh báo tốt có ý nghĩa hành động, gửi đúng người, có hướng dẫn xử lý (runbook).","c":"Quá nhiều cảnh báo vô nghĩa làm đội vận hành bỏ qua cả cảnh báo quan trọng (alert fatigue).","e":"Chỉ cảnh báo khi tỷ lệ lỗi thanh toán vượt 1% trong 5 phút, thay vì cảnh báo mọi lỗi đơn lẻ."},{"n":"SLI và SLO","d":"SLI là chỉ số đo độ tin cậy từ góc nhìn người dùng; SLO là mục tiêu đặt cho SLI đó.","k":"Error budget là phần không đạt cho phép; khi cạn, ưu tiên độ ổn định hơn tính năng mới.","c":"SLO đặt quá cao làm tê liệt thay đổi; quá thấp thì người dùng không hài lòng.","e":"SLI: tỷ lệ yêu cầu đăng nhập thành công dưới 1 giây; SLO: 99,5% mỗi tháng."},{"n":"Site Reliability Engineering (SRE)","d":"Cách tiếp cận vận hành do Google khởi xướng, áp dụng kỹ thuật phần mềm vào vận hành hệ thống.","k":"Giới hạn công việc thủ công lặp lại (toil), tự động hóa, phân tích sau sự cố không đổ lỗi (blameless postmortem).","c":"Đổi tên đội vận hành thành SRE mà không thay đổi cách làm không mang lại lợi ích.","e":"Sau mỗi sự cố lớn, nhóm viết postmortem gồm dòng thời gian, nguyên nhân và hành động phòng ngừa có người chịu trách nhiệm."}]},{"id":"bcp","title":"Liên tục kinh doanh và khôi phục thảm họa","summary":"Khả năng duy trì hoặc khôi phục dịch vụ trọng yếu khi có sự cố lớn.","points":["RTO là thời gian khôi phục tối đa; RPO là lượng dữ liệu tối đa có thể mất.","Sao lưu chỉ có giá trị khi đã diễn tập khôi phục thành công.","Trung tâm dữ liệu dự phòng cần được diễn tập chuyển đổi định kỳ."],"children":["Phân tích tác động kinh doanh (BIA)","RTO và RPO","Sao lưu và khôi phục","Trung tâm dự phòng (DR)","Diễn tập"],"sub":[{"n":"Phân tích tác động kinh doanh (BIA)","d":"Phân tích tác động kinh doanh: xác định quy trình trọng yếu, tác động khi gián đoạn và thời gian chịu đựng tối đa.","k":"Là đầu vào để đặt RTO, RPO và ưu tiên khôi phục; do nghiệp vụ dẫn dắt, CNTT hỗ trợ.","c":"Mọi đơn vị đều tự đánh giá quy trình của mình là trọng yếu nhất; cần tiêu chí thống nhất.","e":"BIA xác định thanh toán liên ngân hàng có thời gian chịu đựng tối đa 2 giờ, báo cáo nội bộ là 3 ngày."},{"n":"RTO và RPO","d":"RTO là thời gian tối đa để khôi phục dịch vụ; RPO là lượng dữ liệu tối đa có thể mất tính theo thời gian.","k":"RTO và RPO càng thấp chi phí giải pháp càng cao; phải phù hợp với kết quả BIA.","c":"Đặt RTO mà chưa từng diễn tập thì con số chỉ là mong muốn.","e":"Hệ thống ngân hàng điện tử: RTO 1 giờ, RPO 5 phút, dùng nhân bản dữ liệu gần thời gian thực."},{"n":"Sao lưu và khôi phục","d":"Sao chép dữ liệu định kỳ để khôi phục khi mất mát, hỏng hóc hoặc bị mã hóa.","k":"Quy tắc 3-2-1: ba bản sao, hai loại phương tiện, một bản ở nơi khác; thêm bản bất biến hoặc ngoại tuyến để chống mã độc tống tiền.","c":"Sao lưu chưa từng thử khôi phục thì không biết có dùng được hay không.","e":"Mỗi quý khôi phục thử CSDL nhân sự từ bản sao lưu lên môi trường tách biệt và đo thời gian khôi phục."},{"n":"Trung tâm dự phòng (DR)","d":"Địa điểm dự phòng có hạ tầng để tiếp tục vận hành khi trung tâm chính gặp sự cố.","k":"Các mức: hot site (sẵn sàng ngay), warm site (cần chuẩn bị), cold site (chỉ có mặt bằng); khoảng cách địa lý đủ xa.","c":"Cấu hình trung tâm dự phòng lệch dần so với trung tâm chính nếu không đồng bộ thay đổi.","e":"Trung tâm DR cách trung tâm chính hơn 30 km, dữ liệu nhân bản liên tục, chuyển đổi trong 2 giờ."},{"n":"Diễn tập","d":"Thử nghiệm kế hoạch liên tục kinh doanh và khôi phục thảm họa theo kịch bản.","k":"Từ diễn tập trên giấy (tabletop), diễn tập từng phần đến chuyển đổi thật toàn bộ; ghi nhận và khắc phục vấn đề.","c":"Diễn tập theo kịch bản biết trước và luôn thành công không phát hiện được điểm yếu thật.","e":"Diễn tập chuyển toàn bộ hệ thống thanh toán sang trung tâm DR và vận hành thật trong một ngày cuối tuần."}]},{"id":"asset","title":"Quản lý tài sản và người dùng cuối","summary":"Theo dõi phần cứng, phần mềm, giấy phép và hỗ trợ thiết bị người dùng.","points":["CMDB lưu các mục cấu hình và quan hệ giữa chúng.","Quản lý giấy phép phần mềm tránh rủi ro pháp lý và chi phí phát sinh.","Quản lý thiết bị tập trung (MDM, UEM) chuẩn hóa cấu hình và bảo mật."],"children":["CMDB","Quản lý giấy phép","Vòng đời thiết bị","MDM và UEM","Hỗ trợ người dùng cuối"],"sub":[{"n":"CMDB","d":"Cơ sở dữ liệu quản lý cấu hình, lưu các mục cấu hình (CI) như máy chủ, ứng dụng, dịch vụ và quan hệ phụ thuộc giữa chúng.","k":"Giá trị chính nằm ở quan hệ: phân tích ảnh hưởng khi thay đổi, tìm nguyên nhân khi có sự cố.","c":"CMDB nhập tay một lần rồi không cập nhật nhanh chóng sai lệch; nên tự động phát hiện (discovery).","e":"Trước khi bảo trì máy chủ, tra CMDB thấy 4 ứng dụng phụ thuộc và thông báo cho đơn vị liên quan."},{"n":"Quản lý giấy phép","d":"Theo dõi quyền sử dụng phần mềm để tuân thủ hợp đồng bản quyền và tối ưu chi phí.","k":"So khớp số giấy phép đã mua với số cài đặt và sử dụng thực tế; hiểu mô hình tính phí của từng hãng.","c":"Ảo hóa và cloud có thể làm thay đổi cách tính giấy phép, gây phát sinh chi phí lớn khi hãng kiểm tra.","e":"Thu hồi 200 giấy phép phần mềm thiết kế không dùng trong 90 ngày để cấp cho người khác."},{"n":"Vòng đời thiết bị","d":"Quản lý thiết bị từ mua sắm, cấp phát, vận hành, bảo trì đến thu hồi và thanh lý.","k":"Thanh lý phải xóa dữ liệu an toàn có biên bản; theo dõi thời hạn bảo hành và hết hỗ trợ.","c":"Thiết bị thanh lý chưa xóa dữ liệu là nguồn lộ thông tin khách hàng.","e":"Máy tính thu hồi được xóa dữ liệu theo chuẩn, lập biên bản và ghi nhận trạng thái trên hệ thống quản lý tài sản."},{"n":"MDM và UEM","d":"Quản lý thiết bị di động (MDM) và quản lý điểm cuối hợp nhất (UEM) cho phép cấu hình, cập nhật và bảo vệ thiết bị tập trung.","k":"Thực thi chính sách mật khẩu, mã hóa, cập nhật; tách dữ liệu công việc; xóa từ xa khi mất thiết bị.","c":"Thiết bị cá nhân (BYOD) cần cân bằng giữa bảo mật và quyền riêng tư của nhân viên.","e":"Điện thoại nhân viên cài ứng dụng công việc trong vùng quản lý riêng; mất máy thì chỉ xóa dữ liệu công việc."},{"n":"Hỗ trợ người dùng cuối","d":"Hỗ trợ người dùng sử dụng thiết bị, phần mềm và dịch vụ CNTT hằng ngày.","k":"Kết hợp tự phục vụ, hỗ trợ từ xa và hỗ trợ tại chỗ; đo mức hài lòng của người dùng sau mỗi yêu cầu.","c":"Chỉ đo số phiếu đóng mà không đo trải nghiệm thực của người dùng.","e":"Hướng dẫn tự xử lý lỗi máy in phổ biến trên cổng tự phục vụ, giảm phiếu hỗ trợ tại chỗ."}]}],"concepts":[{"term":"Thỏa thuận mức dịch vụ (SLA)","def":"Thỏa thuận về chất lượng dịch vụ giữa bên cung cấp và khách hàng, với chỉ số đo được.","ex":"Hệ thống sẵn sàng 99,9% trong giờ giao dịch.","mis":"SLA càng cao càng tốt. Mỗi ‘số 9’ thêm vào làm chi phí tăng rất mạnh."},{"term":"Sự cố và vấn đề (Incident, Problem)","def":"Sự cố là gián đoạn dịch vụ cần khôi phục; vấn đề là nguyên nhân gốc của một hoặc nhiều sự cố.","ex":"Khởi động lại dịch vụ để khôi phục (incident), sau đó phân tích lỗi rò rỉ bộ nhớ (problem).","mis":"Khôi phục xong là đóng việc. Không xử lý problem thì sự cố sẽ lặp lại."},{"term":"Quản lý thay đổi (Change enablement)","def":"Thực hành đánh giá và cho phép thay đổi nhằm tối đa khả năng thành công và giảm rủi ro.","ex":"Hội đồng thay đổi (CAB) xem xét thay đổi cấu hình hệ thống lõi trước khi triển khai cuối tuần.","mis":"Mọi thay đổi đều cần hội đồng phê duyệt. Thay đổi chuẩn có rủi ro thấp có thể được phê duyệt trước."},{"term":"Mô hình trách nhiệm chia sẻ (Shared responsibility)","def":"Phân định trách nhiệm bảo mật và vận hành giữa nhà cung cấp cloud và khách hàng.","ex":"Với IaaS, khách hàng tự vá hệ điều hành máy ảo.","mis":"Lên cloud là nhà cung cấp lo toàn bộ bảo mật. Khách hàng vẫn chịu trách nhiệm về dữ liệu, danh tính và cấu hình."},{"term":"RTO và RPO","def":"RTO là thời gian tối đa để khôi phục dịch vụ; RPO là khoảng thời gian dữ liệu tối đa có thể bị mất.","ex":"Hệ thống thanh toán có RTO 2 giờ và RPO 15 phút.","mis":"Có sao lưu hằng ngày là đạt mọi RPO. Sao lưu hằng ngày chỉ tương ứng RPO tới 24 giờ."},{"term":"Ảo hóa (Virtualization)","def":"Tạo nhiều máy ảo độc lập chạy trên cùng phần cứng vật lý thông qua hypervisor.","ex":"Một máy chủ vật lý chạy 20 máy ảo cho các ứng dụng khác nhau.","mis":"Container và máy ảo là một. Container chia sẻ nhân hệ điều hành nên nhẹ hơn nhưng mức cô lập thấp hơn."},{"term":"CMDB (Configuration Management Database)","def":"Cơ sở dữ liệu quản lý cấu hình, lưu các mục cấu hình và quan hệ phụ thuộc giữa chúng.","ex":"Biết máy chủ nào phục vụ ứng dụng nào trước khi bảo trì.","mis":"CMDB chỉ là kho kiểm kê tài sản. Giá trị nằm ở quan hệ phụ thuộc giữa các mục."},{"term":"SLO và error budget","def":"SLO là mục tiêu độ tin cậy nội bộ; error budget là phần không đạt được phép trong một chu kỳ.","ex":"SLO 99,9% mỗi tháng cho phép khoảng 43 phút gián đoạn.","mis":"Mục tiêu nên là 100%. Mục tiêu 100% làm tê liệt mọi thay đổi và không thực tế."},{"term":"Kiến trúc hiện trạng và mục tiêu (Baseline, Target architecture)","def":"Mô tả kiến trúc hiện tại, kiến trúc mong muốn và lộ trình chuyển đổi giữa hai trạng thái.","ex":"Chuyển từ nhiều hệ thống báo cáo rời rạc sang một nền tảng dữ liệu tập trung.","mis":"Chỉ cần vẽ kiến trúc mục tiêu. Thiếu phân tích khoảng cách thì không có lộ trình khả thi."},{"term":"Quản trị và quản lý (Governance, Management)","def":"Quản trị đặt định hướng, phê duyệt và giám sát; quản lý lập kế hoạch và thực thi theo định hướng đó.","ex":"Hội đồng quản trị phê duyệt khẩu vị rủi ro CNTT; khối CNTT triển khai biện pháp kiểm soát.","mis":"Hai khái niệm dùng thay nhau được. COBIT tách rõ hai vai trò này."}],"path":{"foundation":{"goal":"Vận hành và hỗ trợ hệ thống cơ bản.","topics":["Phần cứng và hệ điều hành","Mạng căn bản","Hỗ trợ người dùng","Khái niệm ITSM"],"signal":"Xử lý được sự cố phổ biến theo quy trình và ghi nhận đúng trên service desk."},"intermediate":{"goal":"Quản trị hạ tầng và dịch vụ.","topics":["Quản trị máy chủ Linux và Windows","Ảo hóa và cloud","Mạng doanh nghiệp","Giám sát hệ thống"],"signal":"Vận hành ổn định một nhóm dịch vụ và xử lý được sự cố mức 2."},"advanced":{"goal":"Thiết kế và tối ưu dịch vụ CNTT.","topics":["Kiến trúc cloud","Tự động hóa vận hành và IaC","SRE và SLO","BCP và DR"],"signal":"Thiết kế hạ tầng đạt RTO, RPO mục tiêu và giảm được sự cố lặp lại."},"expert":{"goal":"Định hướng chiến lược CNTT.","topics":["Kiến trúc doanh nghiệp theo TOGAF","Quản trị CNTT theo COBIT","Quản lý danh mục đầu tư và nhà cung cấp","Tuân thủ quy định ngành"],"signal":"Xây lộ trình CNTT nhiều năm gắn với chiến lược kinh doanh và được phê duyệt."}},"standards":[{"name":"ITIL 4","note":"Khung thực hành quản lý dịch vụ CNTT.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 20000-1:2018","note":"Hệ thống quản lý dịch vụ.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"TOGAF Standard, 10th Edition (2022)","note":"Khung kiến trúc doanh nghiệp của The Open Group.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"COBIT 2019","note":"Khung quản trị và quản lý CNTT doanh nghiệp của ISACA.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO 22301:2019","note":"Hệ thống quản lý liên tục kinh doanh.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ArchiMate 3.2","note":"Ngôn ngữ mô hình hóa kiến trúc doanh nghiệp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Thông tư 09/2020/TT-NHNN","note":"Quy định an toàn hệ thống thông tin trong hoạt động ngân hàng. Còn hiệu lực; tháng 3/2026 VNBA đã lấy ý kiến hội viên về dự thảo sửa đổi, bổ sung.","checked":"Đối chiếu nguồn ngày 25/09/2026"}],"tools":[{"group":"ITSM","items":["ServiceNow","Jira Service Management"]},{"group":"Ảo hóa và cloud","items":["VMware vSphere","Microsoft Azure","AWS","Google Cloud"]},{"group":"Tự động hóa","items":["Ansible","Terraform","PowerShell"]},{"group":"Giám sát","items":["Prometheus","Grafana","Zabbix","Elastic Stack"]},{"group":"Kiến trúc","items":["Archi","Sparx Enterprise Architect"]}],"certs":[{"name":"ITIL 4 Foundation","note":"Nền tảng quản lý dịch vụ CNTT.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"CompTIA A+ / Network+","note":"Hỗ trợ kỹ thuật và mạng căn bản.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Cisco CCNA","note":"Mạng doanh nghiệp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Microsoft Certified: Azure Administrator Associate","note":"Quản trị Azure.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"AWS Certified Solutions Architect – Associate","note":"Thiết kế giải pháp trên AWS.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"TOGAF Enterprise Architecture Foundation / Practitioner","note":"Kiến trúc doanh nghiệp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISACA COBIT 2019 Foundation","note":"Quản trị CNTT.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Chuyên viên hỗ trợ kỹ thuật","skills":"Xử lý sự cố, giao tiếp với người dùng"},{"role":"Quản trị hệ thống","skills":"Linux, Windows, ảo hóa, sao lưu"},{"role":"Kỹ sư mạng","skills":"Định tuyến, tường lửa, giám sát mạng"},{"role":"Kỹ sư cloud","skills":"Kiến trúc cloud, IaC, tối ưu chi phí"},{"role":"Kỹ sư SRE","skills":"SLO, tự động hóa, xử lý sự cố"},{"role":"Kiến trúc sư doanh nghiệp","skills":"TOGAF, lộ trình chuyển đổi, quản trị kiến trúc"}],"glossary":[["Availability","Tính sẵn sàng","Tỷ lệ thời gian dịch vụ hoạt động được."],["Incident","Sự cố","Gián đoạn hoặc suy giảm chất lượng dịch vụ."],["Problem","Vấn đề","Nguyên nhân gốc của một hoặc nhiều sự cố."],["Change","Thay đổi","Thêm, sửa hoặc gỡ bỏ thành phần ảnh hưởng dịch vụ."],["Service catalog","Danh mục dịch vụ","Danh sách dịch vụ được cung cấp cho người dùng."],["Hypervisor","Trình ảo hóa","Phần mềm tạo và quản lý máy ảo."],["Failover","Chuyển đổi dự phòng","Tự động hoặc thủ công chuyển sang hệ thống dự phòng."],["Backup","Sao lưu","Bản sao dữ liệu để khôi phục khi cần."],["Configuration item","Mục cấu hình","Thành phần cần quản lý để cung cấp dịch vụ."],["Capacity","Năng lực hạ tầng","Khả năng đáp ứng khối lượng công việc."]],"quiz":[{"q":"RPO 15 phút có nghĩa là gì?","o":["Khôi phục dịch vụ trong 15 phút","Mất tối đa 15 phút dữ liệu","Sao lưu mất 15 phút","Diễn tập mỗi 15 phút"],"a":1,"e":"RPO đo lượng dữ liệu có thể mất tính theo thời gian; thời gian khôi phục là RTO."},{"q":"Trong ITIL, mục tiêu chính của quản lý sự cố là gì?","o":["Tìm nguyên nhân gốc","Khôi phục dịch vụ bình thường nhanh nhất có thể","Phê duyệt thay đổi","Lập SLA"],"a":1,"e":"Tìm nguyên nhân gốc là mục tiêu của quản lý vấn đề."},{"q":"Với mô hình IaaS, ai chịu trách nhiệm vá hệ điều hành của máy ảo?","o":["Nhà cung cấp cloud","Khách hàng","Cơ quan quản lý","Không bên nào"],"a":1,"e":"Trong IaaS, nhà cung cấp lo hạ tầng vật lý và ảo hóa; hệ điều hành trở lên thuộc trách nhiệm khách hàng."},{"q":"SLO 99,9% trong tháng 30 ngày cho phép khoảng bao nhiêu thời gian gián đoạn?","o":["4,3 phút","43 phút","7,2 giờ","1 ngày"],"a":1,"e":"30 ngày × 1.440 phút × 0,1% ≈ 43,2 phút."},{"q":"TOGAF ADM là gì?","o":["Công cụ giám sát hệ thống","Phương pháp lặp để phát triển kiến trúc doanh nghiệp","Chuẩn bảo mật","Mô hình định giá cloud"],"a":1,"e":"ADM (Architecture Development Method) là phương pháp cốt lõi của TOGAF."}],"links":[{"to":"se","why":"Phần mềm do kỹ nghệ phần mềm xây dựng được IT tiếp nhận và vận hành."},{"to":"sec","why":"Hạ tầng và cloud cần kiểm soát an ninh xuyên suốt."},{"to":"data","why":"Nền tảng dữ liệu chạy trên hạ tầng và cloud do IT vận hành."}]},{"id":"ai","code":"IV.5","title":"AI","vi":"Trí tuệ nhân tạo","summary":"Trí tuệ nhân tạo (Artificial Intelligence) là lĩnh vực xây dựng hệ thống có khả năng thực hiện các nhiệm vụ vốn đòi hỏi trí tuệ con người như nhận thức, suy luận, học hỏi, hiểu ngôn ngữ và ra quyết định.","diff":["Khác phân tích dữ liệu: phân tích dữ liệu tìm hiểu biết để con người ra quyết định; AI xây mô hình tự đưa ra dự đoán hoặc hành động.","Học máy (Machine Learning) là tập con của AI; học sâu (Deep Learning) là tập con của học máy, dùng mạng nơ-ron nhiều tầng.","Khác tự động hóa theo luật (RPA, rule engine): hệ theo luật làm đúng những gì được lập trình; hệ học máy tự suy ra quy luật từ dữ liệu nên cần kiểm soát sai lệch và khả năng giải thích."],"topics":[{"id":"math","title":"Nền tảng toán cho AI","summary":"Kiến thức toán giúp hiểu và gỡ lỗi mô hình thay vì chỉ gọi thư viện.","points":["Đại số tuyến tính: vector và ma trận là ngôn ngữ của dữ liệu và mô hình.","Xác suất thống kê: mô hình hóa bất định và đánh giá kết quả.","Giải tích và tối ưu hóa: nền tảng của huấn luyện bằng gradient."],"children":["Đại số tuyến tính","Xác suất","Thống kê","Giải tích","Tối ưu hóa"],"sub":[{"n":"Đại số tuyến tính","d":"Nhánh toán về vector, ma trận và các phép biến đổi tuyến tính.","k":"Dữ liệu được biểu diễn thành ma trận; phép nhân ma trận là phép tính chủ đạo trong mạng nơ-ron; giá trị riêng và SVD dùng cho giảm chiều.","c":"Nhầm lẫn chiều của ma trận là lỗi phổ biến nhất khi cài đặt mô hình.","e":"Mỗi khách hàng là một vector đặc trưng; toàn bộ tập khách hàng là một ma trận n hàng × d cột."},{"n":"Xác suất","d":"Toán học về sự bất định: biến ngẫu nhiên, phân phối, xác suất có điều kiện, định lý Bayes.","k":"Nhiều mô hình học máy dự đoán xác suất thay vì nhãn cứng; định lý Bayes là nền của nhiều bộ lọc và bộ phân loại.","c":"Bỏ qua xác suất tiền nghiệm (tỷ lệ nền) dẫn đến diễn giải sai kết quả dự đoán.","e":"Mô hình báo 90% khả năng gian lận, nhưng nếu tỷ lệ gian lận nền chỉ 0,1% thì cần thêm bước xác minh."},{"n":"Thống kê","d":"Phương pháp thu thập, mô tả và suy luận từ dữ liệu mẫu.","k":"Ước lượng, khoảng tin cậy, kiểm định giả thuyết giúp đánh giá mô hình có thực sự tốt hơn hay chỉ do ngẫu nhiên.","c":"Mẫu không đại diện cho tổng thể làm mô hình sai khi triển khai thực tế.","e":"Kiểm định xem mô hình mới có tỷ lệ phát hiện cao hơn mô hình cũ một cách có ý nghĩa thống kê."},{"n":"Giải tích","d":"Nghiên cứu đạo hàm và tích phân; trong AI chủ yếu dùng đạo hàm riêng và quy tắc chuỗi.","k":"Gradient chỉ hướng tăng nhanh nhất của hàm; quy tắc chuỗi là nền tảng của lan truyền ngược.","c":"Hàm không khả vi hoặc gradient quá nhỏ, quá lớn làm huấn luyện thất bại.","e":"Tính đạo hàm của hàm mất mát theo từng trọng số để biết cần điều chỉnh trọng số theo hướng nào."},{"n":"Tối ưu hóa","d":"Tìm giá trị tham số làm cực tiểu hoặc cực đại một hàm mục tiêu.","k":"Huấn luyện mô hình là bài toán tối ưu; các thuật toán: SGD, Momentum, Adam; tốc độ học là siêu tham số quan trọng nhất.","c":"Tốc độ học quá lớn làm mô hình phân kỳ, quá nhỏ làm huấn luyện rất chậm.","e":"Giảm dần tốc độ học theo lịch trình giúp mô hình hội tụ ổn định hơn ở giai đoạn cuối."}]},{"id":"ml","title":"Học máy (Machine Learning)","summary":"Thuật toán học quy luật từ dữ liệu để dự đoán hoặc phân nhóm.","points":["Ba kiểu học chính: có giám sát, không giám sát và tự giám sát hoặc bán giám sát.","Chất lượng dữ liệu và đặc trưng thường quan trọng hơn việc chọn thuật toán.","Phải đánh giá trên dữ liệu chưa thấy để tránh quá khớp."],"children":["Hồi quy","Phân loại","Phân cụm","Cây quyết định và ensemble","Đánh giá mô hình","Feature engineering"],"sub":[{"n":"Hồi quy","d":"Bài toán dự đoán giá trị số liên tục từ các đặc trưng đầu vào.","k":"Hồi quy tuyến tính là mô hình cơ sở; đánh giá bằng MAE, RMSE, R².","c":"Ngoại suy ngoài phạm vi dữ liệu huấn luyện cho kết quả không đáng tin.","e":"Dự báo lượng tiền mặt cần tiếp quỹ cho từng ATM theo ngày trong tuần và dịp lễ."},{"n":"Phân loại","d":"Bài toán dự đoán nhãn rời rạc, như có hoặc không, hoặc một trong nhiều lớp.","k":"Các mô hình: hồi quy logistic, cây quyết định, rừng ngẫu nhiên, gradient boosting, mạng nơ-ron; đánh giá bằng precision, recall, F1, AUC.","c":"Dữ liệu mất cân bằng lớp cần kỹ thuật riêng và chỉ số phù hợp, không dùng accuracy.","e":"Phân loại email đến trung tâm chăm sóc khách hàng thành khiếu nại, hỏi đáp, yêu cầu dịch vụ."},{"n":"Phân cụm","d":"Học không giám sát: nhóm các điểm dữ liệu tương tự nhau mà không có nhãn.","k":"Thuật toán phổ biến: k-means, DBSCAN, phân cụm phân cấp; cần chuẩn hóa đặc trưng trước.","c":"Số cụm và ý nghĩa của cụm cần chuyên gia nghiệp vụ diễn giải, thuật toán không tự đặt tên.","e":"Phân khúc khách hàng theo hành vi giao dịch để thiết kế ưu đãi phù hợp từng nhóm."},{"n":"Cây quyết định và ensemble","d":"Cây quyết định chia dữ liệu theo các câu hỏi; ensemble kết hợp nhiều mô hình như rừng ngẫu nhiên, gradient boosting.","k":"Gradient boosting (XGBoost, LightGBM) thường cho kết quả tốt nhất với dữ liệu dạng bảng.","c":"Cây sâu dễ quá khớp; ensemble chính xác hơn nhưng khó giải thích hơn một cây đơn.","e":"Mô hình LightGBM dự đoán khả năng khách hàng rời bỏ dựa trên 50 đặc trưng giao dịch."},{"n":"Đánh giá mô hình","d":"Đo lường chất lượng mô hình trên dữ liệu chưa thấy để chọn mô hình và ước lượng hiệu quả thực tế.","k":"Kiểm định chéo (cross-validation) cho ước lượng ổn định; chọn chỉ số gắn với chi phí nghiệp vụ của từng loại lỗi.","c":"Rò rỉ dữ liệu (data leakage) làm kết quả đánh giá đẹp giả tạo.","e":"Đặc trưng ‘đã bị thu hồi nợ’ được tạo sau thời điểm dự đoán gây rò rỉ, làm AUC cao bất thường."},{"n":"Feature engineering","d":"Tạo, chọn và biến đổi đặc trưng đầu vào để mô hình học hiệu quả hơn.","k":"Đặc trưng tổng hợp theo thời gian, tỷ lệ, mã hóa biến phân loại; hiểu nghiệp vụ là lợi thế lớn nhất.","c":"Đặc trưng tính khác nhau giữa lúc huấn luyện và lúc chạy thật (training-serving skew) làm mô hình sai.","e":"Tạo đặc trưng ‘số giao dịch trong 24 giờ qua so với trung bình 30 ngày’ cho mô hình phát hiện gian lận."}]},{"id":"dl","title":"Học sâu (Deep Learning)","summary":"Mạng nơ-ron nhiều tầng học biểu diễn phức tạp từ dữ liệu lớn.","points":["Lan truyền ngược và hạ gradient là cơ chế huấn luyện.","CNN phù hợp dữ liệu ảnh; Transformer thống trị ngôn ngữ và ngày càng nhiều miền khác.","Cần nhiều dữ liệu và năng lực tính toán, thường dùng GPU."],"children":["Mạng nơ-ron","Lan truyền ngược","CNN","RNN và LSTM","Transformer","Regularization"],"sub":[{"n":"Mạng nơ-ron","d":"Mô hình gồm các lớp nơ-ron nhân tạo, mỗi nơ-ron tính tổng có trọng số rồi qua hàm kích hoạt phi tuyến.","k":"Hàm kích hoạt phổ biến: ReLU, sigmoid, tanh, GELU; nhiều lớp cho phép học biểu diễn phức tạp.","c":"Mạng lớn không phải lúc nào cũng tốt hơn; với dữ liệu bảng nhỏ, mô hình cây thường thắng.","e":"Mạng nơ-ron nhiều lớp phân loại chữ ký viết tay đạt độ chính xác cao hơn phương pháp truyền thống."},{"n":"Lan truyền ngược","d":"Thuật toán tính gradient của hàm mất mát theo mọi trọng số bằng quy tắc chuỗi, đi ngược từ đầu ra về đầu vào.","k":"Kết hợp với hạ gradient để cập nhật trọng số; các thư viện tự động tính đạo hàm.","c":"Gradient biến mất hoặc bùng nổ ở mạng sâu; giải pháp: khởi tạo tốt, chuẩn hóa, kết nối tắt (residual).","e":"Mỗi batch dữ liệu: lan truyền xuôi tính dự đoán, tính mất mát, lan truyền ngược tính gradient, cập nhật trọng số."},{"n":"CNN","d":"Mạng nơ-ron tích chập dùng bộ lọc trượt trên dữ liệu dạng lưới để học đặc trưng cục bộ.","k":"Chia sẻ trọng số giúp giảm số tham số; các lớp đầu học cạnh, góc, lớp sau học hình dạng phức tạp.","c":"CNN học từ dữ liệu huấn luyện; ảnh thực tế khác biệt (ánh sáng, góc chụp) làm giảm độ chính xác.","e":"CNN nhận dạng loại giấy tờ tùy thân từ ảnh chụp trước khi trích xuất thông tin."},{"n":"RNN và LSTM","d":"Mạng nơ-ron hồi quy xử lý dữ liệu tuần tự; LSTM bổ sung cổng nhớ để giữ thông tin dài hạn.","k":"Từng là lựa chọn chính cho văn bản và chuỗi thời gian trước khi Transformer phổ biến.","c":"Xử lý tuần tự nên khó song song hóa và chậm khi huấn luyện chuỗi dài.","e":"LSTM dự báo lưu lượng giao dịch theo giờ dựa trên chuỗi lịch sử nhiều tuần."},{"n":"Transformer","d":"Kiến trúc dựa trên cơ chế self-attention, xử lý toàn bộ chuỗi song song; là nền tảng của mô hình ngôn ngữ lớn.","k":"Gồm encoder và decoder hoặc chỉ một phần; mã hóa vị trí bổ sung thông tin thứ tự.","c":"Chi phí attention tăng theo bình phương độ dài chuỗi, giới hạn cửa sổ ngữ cảnh.","e":"Mô hình Transformer phân loại ý định trong tin nhắn khách hàng gửi tới chatbot."},{"n":"Regularization","d":"Các kỹ thuật chống quá khớp, giúp mô hình tổng quát tốt hơn trên dữ liệu mới.","k":"Kỹ thuật: L1, L2, dropout, dừng sớm (early stopping), tăng cường dữ liệu (data augmentation).","c":"Regularization quá mạnh làm mô hình chưa khớp (underfitting).","e":"Dùng early stopping dừng huấn luyện khi mất mát trên tập kiểm định bắt đầu tăng."}]},{"id":"nlp","title":"Xử lý ngôn ngữ tự nhiên (NLP)","summary":"Giúp máy hiểu, xử lý và sinh ngôn ngữ con người.","points":["Tiếng Việt có đặc thù về tách từ và dấu thanh, ảnh hưởng đến bước tiền xử lý.","Embedding biểu diễn từ và câu thành vector mang ngữ nghĩa.","Nhiều tác vụ NLP truyền thống nay được giải bằng mô hình ngôn ngữ lớn."],"children":["Tách từ và token hóa","Embedding","Phân loại văn bản","Nhận dạng thực thể","Dịch máy","Tóm tắt văn bản"],"sub":[{"n":"Tách từ và token hóa","d":"Chia văn bản thành đơn vị xử lý: từ, từ con (subword) hoặc token.","k":"Tiếng Việt có từ ghép nhiều âm tiết như ‘ngân hàng’, nên cần tách từ; LLM dùng tokenizer subword như BPE.","c":"Văn bản tiếng Việt thường tốn nhiều token hơn tiếng Anh với cùng nội dung, ảnh hưởng chi phí và giới hạn ngữ cảnh.","e":"Câu ‘mở tài khoản thanh toán’ được tách thành ‘mở / tài_khoản / thanh_toán’ trước khi phân loại."},{"n":"Embedding","d":"Biểu diễn từ, câu hoặc tài liệu thành vector số sao cho nội dung gần nghĩa có vector gần nhau.","k":"Là nền của tìm kiếm ngữ nghĩa, phân cụm văn bản và RAG; đo độ tương đồng bằng cosine.","c":"Mô hình embedding huấn luyện chủ yếu trên tiếng Anh có thể kém với thuật ngữ nghiệp vụ tiếng Việt.","e":"Tìm các câu hỏi thường gặp gần nghĩa nhất với câu hỏi của khách hàng qua độ tương đồng embedding."},{"n":"Phân loại văn bản","d":"Gán nhãn cho đoạn văn bản theo chủ đề, cảm xúc, ý định hoặc mức ưu tiên.","k":"Có thể dùng mô hình học máy truyền thống, mô hình tinh chỉnh, hoặc LLM với ví dụ trong prompt.","c":"Nhãn không nhất quán giữa người gán nhãn làm trần chất lượng mô hình thấp.","e":"Phân loại phản hồi khách hàng thành tích cực, tiêu cực, trung tính để theo dõi mức hài lòng."},{"n":"Nhận dạng thực thể","d":"Nhận dạng thực thể có tên (NER): xác định và phân loại thực thể như tên người, tổ chức, địa điểm, số tiền, ngày tháng.","k":"Dùng để trích xuất thông tin có cấu trúc từ văn bản tự do như hợp đồng, email, chứng từ.","c":"Thực thể đặc thù ngành như mã sản phẩm, số hợp đồng cần dữ liệu gán nhãn riêng.","e":"Trích xuất tên bên vay, số tiền, kỳ hạn và lãi suất từ hợp đồng tín dụng dạng văn bản."},{"n":"Dịch máy","d":"Tự động chuyển văn bản từ ngôn ngữ này sang ngôn ngữ khác.","k":"Dịch máy nơ-ron và LLM cho chất lượng cao với ngôn ngữ phổ biến; thuật ngữ chuyên ngành cần bảng thuật ngữ.","c":"Văn bản pháp lý và hợp đồng dịch máy luôn cần người có chuyên môn rà soát.","e":"Dịch tài liệu kỹ thuật tiếng Anh sang tiếng Việt kèm bảng thuật ngữ chuẩn để giữ nhất quán."},{"n":"Tóm tắt văn bản","d":"Rút gọn văn bản dài thành bản ngắn giữ ý chính; trích xuất (chọn câu có sẵn) hoặc trừu tượng (viết lại).","k":"LLM làm tốt tóm tắt trừu tượng nhưng có thể thêm thông tin không có trong văn bản gốc.","c":"Cần kiểm tra tóm tắt với nguồn, đặc biệt các con số và tên riêng.","e":"Tóm tắt biên bản cuộc họp dài thành danh sách quyết định và việc cần làm có người phụ trách."}]},{"id":"cv","title":"Thị giác máy tính (Computer Vision)","summary":"Giúp máy hiểu nội dung ảnh và video.","points":["Các tác vụ chính: phân loại, phát hiện đối tượng và phân đoạn ảnh.","OCR trích xuất văn bản từ ảnh, rất phổ biến trong số hóa chứng từ.","Nhận diện khuôn mặt cần kiểm tra chống giả mạo (liveness)."],"children":["Phân loại ảnh","Phát hiện đối tượng","Phân đoạn ảnh","OCR","Nhận diện khuôn mặt","Liveness detection"],"sub":[{"n":"Phân loại ảnh","d":"Gán một nhãn cho toàn bộ bức ảnh.","k":"Học chuyển giao (transfer learning) từ mô hình huấn luyện sẵn giúp đạt kết quả tốt với ít dữ liệu.","c":"Mô hình có thể học ‘lối tắt’ như nền ảnh thay vì đối tượng chính.","e":"Phân loại ảnh chứng từ khách hàng tải lên: căn cước, hộ chiếu, sao kê, hóa đơn."},{"n":"Phát hiện đối tượng","d":"Xác định vị trí (khung bao) và loại của nhiều đối tượng trong ảnh.","k":"Các họ mô hình phổ biến: YOLO, Faster R-CNN, DETR; đánh giá bằng mAP.","c":"Đối tượng nhỏ, bị che khuất hoặc chồng lấn làm giảm độ chính xác đáng kể.","e":"Phát hiện vùng chữ ký, con dấu và ảnh chân dung trên hồ sơ quét để kiểm tra tính đầy đủ."},{"n":"Phân đoạn ảnh","d":"Gán nhãn cho từng điểm ảnh để tách chính xác vùng của từng đối tượng.","k":"Phân đoạn ngữ nghĩa gán loại cho điểm ảnh; phân đoạn thể hiện tách từng đối tượng riêng biệt.","c":"Dữ liệu gán nhãn mức điểm ảnh rất tốn công sức.","e":"Tách vùng giấy tờ khỏi nền bàn trước khi làm phẳng và nhận dạng ký tự."},{"n":"OCR","d":"Nhận dạng ký tự quang học: chuyển văn bản trong ảnh thành văn bản số.","k":"OCR hiện đại kết hợp phát hiện vùng chữ và mô hình nhận dạng; trích xuất theo trường cần thêm bước hiểu bố cục.","c":"Dấu tiếng Việt, ảnh mờ, chữ viết tay làm tăng tỷ lệ lỗi; cần bước xác nhận của người với trường quan trọng.","e":"Tự động điền họ tên, số giấy tờ, ngày sinh từ ảnh căn cước vào biểu mẫu mở tài khoản trực tuyến."},{"n":"Nhận diện khuôn mặt","d":"Xác định hoặc xác thực danh tính người dựa trên đặc điểm khuôn mặt.","k":"So khớp 1:1 (xác thực) khác tìm kiếm 1:N (nhận dạng); đánh giá bằng tỷ lệ chấp nhận sai và từ chối sai.","c":"Dữ liệu sinh trắc học là dữ liệu cá nhân nhạy cảm, cần căn cứ pháp lý và bảo vệ nghiêm ngặt.","e":"So khớp khuôn mặt khách hàng với ảnh trên giấy tờ tùy thân khi mở tài khoản trực tuyến."},{"n":"Liveness detection","d":"Kiểm tra khuôn mặt trước camera là người thật đang hiện diện, không phải ảnh, video hay mặt nạ.","k":"Chủ động yêu cầu người dùng thực hiện hành động; thụ động phân tích tín hiệu ảnh mà không cần thao tác.","c":"Công nghệ giả mạo như deepfake phát triển nhanh; cần cập nhật và kiểm thử liên tục.","e":"Ứng dụng ngân hàng kiểm tra liveness trước khi so khớp khuôn mặt cho giao dịch giá trị lớn."}]},{"id":"genai","title":"AI tạo sinh và mô hình ngôn ngữ lớn","summary":"Mô hình sinh văn bản, hình ảnh, mã và nội dung mới theo chỉ dẫn.","points":["LLM dự đoán token tiếp theo dựa trên ngữ cảnh, không bảo đảm truy xuất đúng sự thật.","RAG bổ sung tri thức từ nguồn tài liệu để giảm bịa đặt (hallucination).","Prompt, công cụ và tác tử (agent) mở rộng khả năng nhưng cũng mở rộng bề mặt rủi ro."],"children":["Kiến trúc LLM","Prompt engineering","RAG","Fine-tuning","AI agent","Đánh giá LLM"],"sub":[{"n":"Kiến trúc LLM","d":"Cấu trúc của mô hình ngôn ngữ lớn: Transformer chỉ có decoder, hàng tỷ tham số, huấn luyện dự đoán token tiếp theo.","k":"Quy trình phổ biến: tiền huấn luyện trên dữ liệu lớn, tinh chỉnh theo chỉ dẫn, căn chỉnh bằng phản hồi của con người.","c":"Kiến thức của mô hình dừng ở thời điểm dữ liệu huấn luyện; cửa sổ ngữ cảnh giới hạn lượng thông tin mỗi lần.","e":"Chọn mô hình theo cân bằng chất lượng, độ trễ và chi phí cho từng tác vụ: tóm tắt, phân loại, sinh mã."},{"n":"Prompt engineering","d":"Thiết kế chỉ dẫn đầu vào để mô hình cho kết quả đúng, nhất quán và đúng định dạng.","k":"Kỹ thuật: vai trò rõ, bối cảnh đủ, ví dụ mẫu, định dạng đầu ra, yêu cầu suy luận từng bước, tiêu chí tự kiểm tra.","c":"Prompt tốt không thay thế được kiểm chứng đầu ra, và không phải là biện pháp bảo mật.","e":"Prompt phân loại khiếu nại gồm định nghĩa từng nhãn, 3 ví dụ mẫu và yêu cầu trả JSON cố định."},{"n":"RAG","d":"Truy xuất tài liệu liên quan từ kho tri thức rồi đưa vào ngữ cảnh để mô hình trả lời dựa trên nguồn.","k":"Chất lượng phụ thuộc vào phân đoạn tài liệu, embedding, truy xuất lai (từ khóa và ngữ nghĩa) và sắp xếp lại kết quả.","c":"Phải kiểm soát phân quyền: người dùng chỉ được truy xuất tài liệu mình có quyền xem.","e":"Trợ lý tra cứu quy trình nội bộ trả lời kèm trích dẫn tên văn bản và điều khoản nguồn."},{"n":"Fine-tuning","d":"Huấn luyện thêm mô hình có sẵn trên dữ liệu riêng để điều chỉnh hành vi, phong cách hoặc tác vụ.","k":"Các kỹ thuật tiết kiệm như LoRA chỉ huấn luyện một phần nhỏ tham số.","c":"Tinh chỉnh không phải cách tốt để nạp kiến thức thay đổi thường xuyên; RAG phù hợp hơn cho việc đó.","e":"Tinh chỉnh mô hình nhỏ để phân loại giao dịch theo danh mục chi tiêu với độ trễ thấp."},{"n":"AI agent","d":"Hệ thống trong đó LLM tự lập kế hoạch, gọi công cụ, quan sát kết quả và lặp lại đến khi hoàn thành mục tiêu.","k":"Thành phần: mô hình, công cụ (API, tìm kiếm, mã), bộ nhớ, vòng lặp điều khiển; có thể nhiều tác tử phối hợp.","c":"Tác tử có quyền hành động mở rộng rủi ro: cần giới hạn quyền, xác nhận của con người với hành động quan trọng và ghi log đầy đủ.","e":"Tác tử hỗ trợ BA đọc biên bản họp, tra backlog và soạn nháp user story, nhưng không tự tạo work item khi chưa được duyệt."},{"n":"Đánh giá LLM","d":"Đo lường chất lượng, an toàn và độ tin cậy của đầu ra LLM.","k":"Kết hợp bộ câu hỏi chuẩn có đáp án, chấm tự động theo tiêu chí, đánh giá của con người và giám sát khi vận hành.","c":"Đánh giá vài ví dụ thủ công rồi triển khai là không đủ; mỗi lần đổi mô hình hay prompt cần chạy lại bộ đánh giá.","e":"Bộ 200 câu hỏi quy trình có đáp án chuẩn chạy tự động mỗi lần cập nhật trợ lý tra cứu nội bộ."}]},{"id":"rl","title":"Học tăng cường (Reinforcement Learning)","summary":"Tác tử học chính sách hành động qua thử – sai để tối đa phần thưởng.","points":["Cần cân bằng giữa khám phá (exploration) và khai thác (exploitation).","Thành công nổi bật trong trò chơi và điều khiển robot.","RLHF dùng phản hồi của con người để tinh chỉnh LLM."],"children":["Quá trình quyết định Markov (MDP)","Q-learning","Policy gradient","Khám phá và khai thác","RLHF"],"sub":[{"n":"Quá trình quyết định Markov (MDP)","d":"Khung toán học mô tả bài toán ra quyết định tuần tự: trạng thái, hành động, xác suất chuyển, phần thưởng.","k":"Tính chất Markov: tương lai chỉ phụ thuộc trạng thái hiện tại; mục tiêu là tìm chính sách tối đa phần thưởng tích lũy.","c":"Thiết kế phần thưởng sai khiến tác tử tối ưu hành vi không mong muốn.","e":"Mô hình hóa bài toán điều chỉnh hạn mức tín dụng theo thời gian thành MDP với trạng thái hành vi khách hàng."},{"n":"Q-learning","d":"Thuật toán học giá trị của cặp trạng thái và hành động, cập nhật dần từ trải nghiệm.","k":"Không cần mô hình môi trường; Deep Q-Network dùng mạng nơ-ron xấp xỉ hàm giá trị cho không gian lớn.","c":"Không gian trạng thái lớn làm bảng Q không khả thi; huấn luyện có thể không ổn định.","e":"Tác tử học chơi trò chơi đơn giản bằng cách thử và ghi nhận phần thưởng từng nước đi."},{"n":"Policy gradient","d":"Nhóm thuật toán tối ưu trực tiếp chính sách theo gradient của phần thưởng kỳ vọng.","k":"Phù hợp không gian hành động liên tục; PPO là thuật toán phổ biến, cũng dùng trong RLHF.","c":"Phương sai cao và cần nhiều mẫu; siêu tham số nhạy.","e":"Điều khiển tay robot với hành động là góc khớp liên tục."},{"n":"Khám phá và khai thác","d":"Thế cân bằng giữa thử hành động mới để học thêm và chọn hành động tốt nhất đã biết.","k":"Chiến lược epsilon-greedy, UCB, Thompson sampling; bài toán multi-armed bandit là dạng đơn giản.","c":"Khám phá trong môi trường thật có chi phí; cần giới hạn rủi ro khi thử nghiệm.","e":"Thử nghiệm luân phiên nhiều mẫu thông điệp ưu đãi, dần ưu tiên mẫu có tỷ lệ phản hồi cao."},{"n":"RLHF","d":"Học tăng cường từ phản hồi của con người: dùng đánh giá của người để huấn luyện mô hình phần thưởng rồi tinh chỉnh LLM.","k":"Giúp mô hình trả lời hữu ích và an toàn hơn; các phương pháp thay thế như DPO tối ưu trực tiếp từ dữ liệu ưu tiên.","c":"Mô hình có thể học chiều lòng người đánh giá thay vì trả lời đúng.","e":"Người đánh giá so sánh hai câu trả lời, chọn câu tốt hơn; dữ liệu này dùng để căn chỉnh mô hình."}]},{"id":"mlops","title":"MLOps","summary":"Thực hành đưa mô hình học máy vào vận hành ổn định và giám sát liên tục.","points":["Mô hình suy giảm khi dữ liệu thực tế thay đổi (drift).","Cần phiên bản hóa cả dữ liệu, mã nguồn và mô hình.","Pipeline tự động hóa huấn luyện, kiểm định, triển khai và hoàn tác."],"children":["Quản lý thí nghiệm","Model registry","Triển khai mô hình","Giám sát drift","Feature store","Huấn luyện lại"],"sub":[{"n":"Quản lý thí nghiệm","d":"Ghi nhận tham số, dữ liệu, mã và kết quả của mỗi lần huấn luyện để so sánh và tái hiện.","k":"Công cụ như MLflow lưu siêu tham số, chỉ số và artifact của từng lần chạy.","c":"Không ghi nhận phiên bản dữ liệu thì không tái hiện được mô hình dù có đủ mã.","e":"So sánh 40 lần chạy thử với các bộ siêu tham số khác nhau và chọn lần tốt nhất để đăng ký."},{"n":"Model registry","d":"Kho quản lý phiên bản mô hình, trạng thái vòng đời và thông tin đi kèm.","k":"Mỗi phiên bản có nguồn gốc dữ liệu, chỉ số đánh giá, người phê duyệt; trạng thái như thử nghiệm, production, lưu trữ.","c":"Mô hình đưa lên production không qua registry thì mất khả năng truy vết khi kiểm toán.","e":"Mô hình chấm điểm phiên bản 3.2 được phê duyệt bởi bộ phận quản trị rủi ro mô hình trước khi chuyển sang production."},{"n":"Triển khai mô hình","d":"Đưa mô hình vào phục vụ dự đoán: trực tuyến qua API, theo lô, hoặc trên thiết bị.","k":"Chiến lược an toàn: shadow (chạy song song không ảnh hưởng), canary, A/B; luôn có phương án hoàn tác.","c":"Hiệu năng và độ trễ khi phục vụ thật cần được kiểm thử như mọi dịch vụ phần mềm khác.","e":"Mô hình mới chạy shadow 2 tuần, so sánh kết quả với mô hình cũ trước khi chuyển lưu lượng thật."},{"n":"Giám sát drift","d":"Theo dõi sự thay đổi phân phối dữ liệu đầu vào (data drift) và quan hệ giữa đầu vào với nhãn (concept drift).","k":"Chỉ số như PSI, kiểm định KS; theo dõi hiệu quả thực khi có nhãn trở lại.","c":"Nhãn thực thường đến chậm (ví dụ nợ xấu sau nhiều tháng), nên cần theo dõi drift đầu vào làm tín hiệu sớm.","e":"Cảnh báo khi chỉ số PSI của đặc trưng thu nhập vượt 0,25 so với dữ liệu huấn luyện."},{"n":"Feature store","d":"Kho quản lý tập trung đặc trưng dùng cho huấn luyện và phục vụ, bảo đảm tính nhất quán.","k":"Tránh lệch giữa lúc huấn luyện và lúc chạy thật; tái sử dụng đặc trưng giữa nhiều mô hình.","c":"Chi phí xây dựng và vận hành chỉ đáng khi tổ chức có nhiều mô hình dùng chung đặc trưng.","e":"Đặc trưng ‘tổng chi tiêu 30 ngày’ được tính một lần và dùng chung cho mô hình rời bỏ và mô hình gợi ý sản phẩm."},{"n":"Huấn luyện lại","d":"Cập nhật mô hình bằng dữ liệu mới theo lịch hoặc khi phát hiện suy giảm.","k":"Pipeline tự động huấn luyện, đánh giá, so sánh với mô hình hiện tại; chỉ thay khi tốt hơn và được phê duyệt.","c":"Huấn luyện lại tự động không kiểm soát có thể đưa dữ liệu lỗi hoặc thiên lệch vào production.","e":"Mô hình dự báo tiếp quỹ ATM được huấn luyện lại hằng tháng và kiểm tra trước các dịp lễ lớn."}]},{"id":"governance","title":"Quản trị AI và AI có trách nhiệm","summary":"Nguyên tắc, chuẩn và pháp luật bảo đảm AI an toàn, công bằng, minh bạch và có trách nhiệm giải trình.","points":["Tiếp cận theo mức rủi ro: hệ thống rủi ro cao chịu yêu cầu chặt chẽ hơn.","Cần kiểm soát thiên lệch, khả năng giải thích và sự giám sát của con người.","Luật Trí tuệ nhân tạo số 134/2025/QH15 có hiệu lực từ 01/3/2026, phân loại hệ thống AI theo ba mức rủi ro; hệ thống AI tài chính đang vận hành có 18 tháng chuyển tiếp để tuân thủ."],"children":["Nguyên tắc AI có trách nhiệm","Phân loại rủi ro","Thiên lệch và công bằng","Khả năng giải thích (XAI)","Giám sát của con người","Khung pháp lý"],"sub":[{"n":"Nguyên tắc AI có trách nhiệm","d":"Bộ nguyên tắc định hướng phát triển và sử dụng AI: lấy con người làm trung tâm, công bằng, minh bạch, an toàn, trách nhiệm giải trình, bảo vệ quyền riêng tư.","k":"Nguyên tắc cần được chuyển thành chính sách, quy trình và kiểm soát cụ thể mới có tác dụng.","c":"Nguyên tắc chỉ nằm trên giấy mà không gắn với quy trình phê duyệt use case là hình thức.","e":"Mỗi use case AI mới phải qua bảng đánh giá tác động dựa trên bộ nguyên tắc trước khi phát triển."},{"n":"Phân loại rủi ro","d":"Phân nhóm hệ thống AI theo mức rủi ro để áp dụng yêu cầu tương xứng.","k":"Luật Trí tuệ nhân tạo của Việt Nam chia ba mức: cao, trung bình, thấp; EU AI Act có thêm nhóm bị cấm.","c":"Mức rủi ro phụ thuộc vào mục đích và bối cảnh sử dụng, không chỉ phụ thuộc công nghệ.","e":"Mô hình hỗ trợ quyết định cấp tín dụng cho cá nhân được xếp mức rủi ro cao, cần đánh giá và giám sát chặt chẽ."},{"n":"Thiên lệch và công bằng","d":"Đánh giá và giảm thiểu kết quả bất lợi có hệ thống cho các nhóm người.","k":"Nhiều định nghĩa công bằng (cân bằng tỷ lệ, cân bằng cơ hội) có thể mâu thuẫn nhau; cần chọn theo bối cảnh.","c":"Loại bỏ thuộc tính nhạy cảm không đủ vì biến đại diện vẫn mang thông tin.","e":"So sánh tỷ lệ phê duyệt của mô hình giữa các vùng miền và nhóm tuổi trước khi triển khai."},{"n":"Khả năng giải thích (XAI)","d":"Các phương pháp giúp con người hiểu vì sao mô hình đưa ra dự đoán.","k":"Giải thích toàn cục (đặc trưng nào quan trọng) và cục bộ (vì sao ca này); phương pháp phổ biến: SHAP, LIME.","c":"Giải thích hậu kiểm là xấp xỉ, có thể không phản ánh chính xác cơ chế mô hình.","e":"Cung cấp 3 lý do chính khi mô hình đánh giá hồ sơ ở mức rủi ro cao để chuyên viên thẩm định xem xét."},{"n":"Giám sát của con người","d":"Cơ chế bảo đảm con người có thể hiểu, can thiệp, ghi đè hoặc dừng hệ thống AI.","k":"Các mức: con người quyết định với AI hỗ trợ, con người giám sát và can thiệp khi cần, hoặc chỉ giám sát tổng thể.","c":"Thiên kiến tự động hóa: con người có xu hướng chấp nhận đề xuất của máy mà không kiểm tra.","e":"Chuyên viên bắt buộc xem xét và ghi lý do khi đồng ý hoặc bác bỏ đề xuất từ chối hồ sơ của mô hình."},{"n":"Khung pháp lý","d":"Tập hợp luật, quy định và tiêu chuẩn điều chỉnh AI.","k":"Tại Việt Nam: Luật Trí tuệ nhân tạo 134/2025/QH15 (hiệu lực 01/3/2026), cùng Luật Bảo vệ dữ liệu cá nhân; quốc tế: EU AI Act, ISO/IEC 42001, NIST AI RMF.","c":"Pháp luật về AI đang thay đổi nhanh; cần theo dõi văn bản hướng dẫn và thời hạn chuyển tiếp.","e":"Rà soát danh mục hệ thống AI đang vận hành để hoàn tất nghĩa vụ tuân thủ trong thời hạn 18 tháng áp dụng cho lĩnh vực tài chính."}]}],"concepts":[{"term":"Quá khớp (Overfitting)","def":"Mô hình học thuộc cả nhiễu của dữ liệu huấn luyện nên dự đoán kém trên dữ liệu mới.","ex":"Mô hình chấm điểm đạt 99% trên tập huấn luyện nhưng chỉ 70% trên tập kiểm tra.","mis":"Độ chính xác huấn luyện cao nghĩa là mô hình tốt. Chỉ kết quả trên dữ liệu chưa thấy mới có ý nghĩa."},{"term":"Tập huấn luyện, kiểm định và kiểm tra","def":"Chia dữ liệu để huấn luyện, chọn siêu tham số và đánh giá cuối cùng một cách độc lập.","ex":"Chia dữ liệu giao dịch theo thời gian: các tháng cũ để huấn luyện, các tháng gần nhất để kiểm tra.","mis":"Chia ngẫu nhiên luôn đúng. Với dữ liệu theo thời gian, chia ngẫu nhiên gây rò rỉ thông tin tương lai."},{"term":"Precision và Recall","def":"Precision là tỷ lệ dự đoán dương là đúng; Recall là tỷ lệ ca dương thực được phát hiện.","ex":"Mô hình phát hiện gian lận ưu tiên recall để không bỏ sót, chấp nhận thêm cảnh báo cần xem xét.","mis":"Accuracy là đủ. Với dữ liệu mất cân bằng, accuracy cao vẫn có thể vô dụng."},{"term":"Hạ gradient (Gradient descent)","def":"Thuật toán tối ưu cập nhật tham số ngược chiều gradient của hàm mất mát.","ex":"Mỗi vòng huấn luyện điều chỉnh trọng số để giảm sai số dự đoán.","mis":"Luôn tìm được cực tiểu toàn cục. Với mạng sâu, thường chỉ đạt nghiệm đủ tốt."},{"term":"Transformer và attention","def":"Kiến trúc mạng dùng cơ chế attention để mỗi phần tử đánh giá mức liên quan với mọi phần tử khác.","ex":"Khi dịch câu, mô hình tập trung vào những từ nguồn liên quan nhất.","mis":"Trọng số attention giải thích lý do mô hình quyết định. Đó không phải lời giải thích đáng tin cậy."},{"term":"Bịa đặt (Hallucination)","def":"LLM sinh nội dung nghe hợp lý nhưng sai hoặc không có căn cứ.","ex":"Trích dẫn một điều khoản văn bản pháp luật không tồn tại.","mis":"Mô hình lớn hơn sẽ hết bịa đặt. Cần RAG, kiểm chứng nguồn và con người rà soát."},{"term":"RAG (Retrieval-Augmented Generation)","def":"Truy xuất tài liệu liên quan rồi đưa vào ngữ cảnh để mô hình trả lời dựa trên nguồn.","ex":"Trợ lý nội bộ trả lời câu hỏi quy trình dựa trên kho văn bản quy định.","mis":"RAG loại bỏ hoàn toàn bịa đặt. Chất lượng truy xuất và cách phân đoạn tài liệu quyết định kết quả."},{"term":"Trôi dữ liệu (Data drift)","def":"Phân phối dữ liệu thực tế thay đổi so với lúc huấn luyện, làm mô hình suy giảm.","ex":"Hành vi chi tiêu thay đổi sau một chiến dịch khuyến mại lớn.","mis":"Mô hình triển khai xong là ổn định. Cần giám sát và huấn luyện lại định kỳ."},{"term":"Thiên lệch thuật toán (Algorithmic bias)","def":"Kết quả mô hình bất lợi có hệ thống cho một nhóm người, do dữ liệu hoặc thiết kế.","ex":"Mô hình tuyển dụng học từ dữ liệu lịch sử thiên về một nhóm ứng viên.","mis":"Bỏ thuộc tính nhạy cảm là đủ. Biến đại diện (proxy) vẫn có thể mang thiên lệch."},{"term":"Giám sát của con người (Human oversight)","def":"Cơ chế để con người hiểu, can thiệp và vô hiệu hóa quyết định của AI khi cần.","ex":"Hồ sơ bị AI đánh giá rủi ro cao được chuyên viên xem xét trước khi từ chối.","mis":"Có người bấm duyệt là đủ. Người giám sát cần thông tin, thời gian và thẩm quyền thực chất."}],"path":{"foundation":{"goal":"Hiểu AI làm được gì và không làm được gì.","topics":["Python và thư viện dữ liệu","Đại số tuyến tính và xác suất cơ bản","Khái niệm học máy","Sử dụng LLM an toàn trong công việc"],"signal":"Huấn luyện và đánh giá đúng cách một mô hình phân loại đơn giản."},"intermediate":{"goal":"Xây mô hình cho bài toán thực tế.","topics":["Các thuật toán học máy phổ biến","Đánh giá và lựa chọn mô hình","Học sâu cơ bản","Prompt engineering và RAG"],"signal":"Giải một bài toán nghiệp vụ với chỉ số đánh giá phù hợp và giải thích được đánh đổi."},"advanced":{"goal":"Đưa AI vào vận hành có kiểm soát.","topics":["MLOps","Fine-tuning và đánh giá LLM","AI agent","Quản trị rủi ro mô hình"],"signal":"Vận hành mô hình trên production có giám sát drift và quy trình hoàn tác."},"expert":{"goal":"Định hướng chiến lược và quản trị AI.","topics":["Kiến trúc nền tảng AI doanh nghiệp","Tuân thủ pháp luật AI và bảo vệ dữ liệu","Đánh giá an toàn và red-teaming","Nghiên cứu chuyên sâu"],"signal":"Xây khung quản trị AI cho tổ chức và dẫn dắt danh mục use case có giá trị đo được."}},"standards":[{"name":"Luật Trí tuệ nhân tạo số 134/2025/QH15","note":"Thông qua ngày 10/12/2025, hiệu lực từ 01/3/2026. Quản lý theo ba mức rủi ro: cao, trung bình, thấp. Hệ thống AI đã vận hành trước ngày hiệu lực có 18 tháng để tuân thủ nếu thuộc lĩnh vực y tế, giáo dục, tài chính và 12 tháng với lĩnh vực khác. Cần theo dõi văn bản hướng dẫn thi hành.","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"EU AI Act – Quy định (EU) 2024/1689","note":"Quy định AI của Liên minh châu Âu, tiếp cận theo mức rủi ro.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"NIST AI RMF 1.0 (2023)","note":"Khung quản lý rủi ro AI của NIST.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 42001:2023","note":"Hệ thống quản lý AI.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 23894:2023","note":"Hướng dẫn quản lý rủi ro AI.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 22989:2022","note":"Khái niệm và thuật ngữ AI.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Nguyên tắc AI của OECD (cập nhật 2024)","note":"Nguyên tắc liên chính phủ về AI đáng tin cậy.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"tools":[{"group":"Ngôn ngữ và thư viện","items":["Python","NumPy","pandas","scikit-learn"]},{"group":"Học sâu","items":["PyTorch","TensorFlow","Hugging Face Transformers"]},{"group":"Ứng dụng LLM","items":["API của các mô hình nền tảng","LangChain","LlamaIndex"]},{"group":"MLOps","items":["MLflow","Kubeflow","Azure Machine Learning"]},{"group":"Tìm kiếm vector","items":["pgvector","Milvus","FAISS"]}],"certs":[{"name":"Microsoft Certified: Azure AI Apps and Agents Developer Associate (AI-103)","note":"Phát triển ứng dụng AI và tác tử trên Azure; thay thế Azure AI Engineer Associate (AI-102), đã ngừng cấp từ 30/6/2026.","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"AWS Certified Machine Learning Engineer – Associate","note":"Học máy trên AWS.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Google Cloud Professional Machine Learning Engineer","note":"Học máy trên Google Cloud.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"IAPP AIGP","note":"Chuyên gia quản trị AI.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Kỹ sư học máy","skills":"Học máy, triển khai mô hình, MLOps"},{"role":"Nhà khoa học dữ liệu","skills":"Thống kê, mô hình hóa, diễn giải nghiệp vụ"},{"role":"Kỹ sư ứng dụng AI và LLM","skills":"Prompt, RAG, tích hợp API, đánh giá chất lượng"},{"role":"Nhà nghiên cứu AI","skills":"Toán, thực nghiệm, công bố khoa học"},{"role":"Chuyên viên quản trị rủi ro AI","skills":"Pháp lý, đạo đức, kiểm soát mô hình"}],"glossary":[["Model","Mô hình","Hàm đã học từ dữ liệu để dự đoán hoặc sinh nội dung."],["Training","Huấn luyện","Quá trình điều chỉnh tham số mô hình từ dữ liệu."],["Inference","Suy luận","Chạy mô hình đã huấn luyện trên dữ liệu mới."],["Feature","Đặc trưng","Biến đầu vào của mô hình."],["Label","Nhãn","Giá trị đúng dùng trong học có giám sát."],["Token","Token","Đơn vị văn bản mà mô hình ngôn ngữ xử lý."],["Embedding","Vector nhúng","Biểu diễn số của dữ liệu mang ngữ nghĩa."],["Fine-tuning","Tinh chỉnh","Huấn luyện thêm mô hình có sẵn cho tác vụ cụ thể."],["Hallucination","Bịa đặt","Nội dung sai nhưng được trình bày như thật."],["Bias","Thiên lệch","Sai lệch có hệ thống trong dữ liệu hoặc kết quả."]],"quiz":[{"q":"Mô hình đạt 98% trên tập huấn luyện nhưng 65% trên tập kiểm tra. Đây là dấu hiệu của gì?","o":["Chưa khớp (underfitting)","Quá khớp (overfitting)","Trôi dữ liệu","Mô hình tốt"],"a":1,"e":"Khoảng cách lớn giữa kết quả huấn luyện và kiểm tra cho thấy mô hình học thuộc dữ liệu huấn luyện."},{"q":"Với bài toán phát hiện gian lận, nơi ca gian lận rất hiếm, chỉ số nào dễ gây hiểu lầm nhất?","o":["Recall","Precision","Accuracy","F1"],"a":2,"e":"Mô hình luôn đoán ‘không gian lận’ vẫn có accuracy rất cao nhưng không phát hiện được ca nào."},{"q":"RAG chủ yếu giúp điều gì?","o":["Tăng tốc GPU","Trả lời dựa trên tài liệu được truy xuất, giảm bịa đặt","Loại bỏ nhu cầu đánh giá","Huấn luyện lại mô hình"],"a":1,"e":"RAG đưa nguồn tài liệu vào ngữ cảnh; nó không thay đổi trọng số mô hình."},{"q":"Quan hệ giữa Deep Learning và Machine Learning là gì?","o":["Không liên quan","Deep Learning là tập con của Machine Learning","Machine Learning là tập con của Deep Learning","Hai khái niệm đồng nghĩa"],"a":1,"e":"AI chứa ML, ML chứa DL."},{"q":"Loại bỏ cột giới tính khỏi dữ liệu có bảo đảm mô hình không thiên lệch không?","o":["Có, hoàn toàn","Không, biến đại diện vẫn có thể mang thiên lệch","Chỉ khi dùng học sâu","Chỉ khi dữ liệu đủ lớn"],"a":1,"e":"Các biến như nghề nghiệp hay địa bàn có thể tương quan với thuộc tính nhạy cảm."}],"links":[{"to":"data","why":"Mô hình AI phụ thuộc vào dữ liệu đúng, đủ và được quản trị."},{"to":"cs","why":"Giải thuật, tối ưu và tính toán là nền của học máy."},{"to":"sec","why":"Hệ thống AI có rủi ro riêng như prompt injection và rò rỉ dữ liệu huấn luyện."}]},{"id":"data","code":"IV.6","title":"Data","vi":"Dữ liệu","summary":"Lĩnh vực dữ liệu bao gồm các nguyên lý và thực hành thu thập, lưu trữ, tích hợp, quản trị, phân tích và khai thác dữ liệu như một tài sản của tổ chức.","diff":["Khác AI: lĩnh vực dữ liệu bảo đảm dữ liệu đúng, đủ, sẵn sàng và được quản trị; AI sử dụng dữ liệu đó để xây mô hình.","Khác IT: IT vận hành hạ tầng; quản trị dữ liệu quan tâm đến ý nghĩa, chất lượng, quyền sở hữu và vòng đời của chính dữ liệu.","Kỹ thuật dữ liệu (Data Engineering) xây đường ống dữ liệu; phân tích dữ liệu (Data Analytics) khai thác dữ liệu để trả lời câu hỏi kinh doanh."],"topics":[{"id":"stats","title":"Thống kê ứng dụng","summary":"Phương pháp mô tả, suy luận và ra quyết định từ dữ liệu có bất định.","points":["Thống kê mô tả tóm tắt dữ liệu; thống kê suy luận khái quát từ mẫu ra tổng thể.","Tương quan không đồng nghĩa với nhân quả.","Thử nghiệm A/B cần cỡ mẫu và thiết kế đúng để kết luận đáng tin cậy."],"children":["Thống kê mô tả","Phân phối xác suất","Kiểm định giả thuyết","Hồi quy","Thử nghiệm A/B"],"sub":[{"n":"Thống kê mô tả","d":"Tóm tắt dữ liệu bằng số đo trung tâm (trung bình, trung vị, yếu vị) và độ phân tán (phương sai, độ lệch chuẩn, khoảng tứ phân vị).","k":"Trung vị ít bị ảnh hưởng bởi giá trị ngoại lai hơn trung bình; luôn xem phân phối trước khi chọn chỉ số.","c":"Báo cáo chỉ số trung bình cho dữ liệu lệch mạnh như thu nhập hoặc số dư dễ gây hiểu lầm.","e":"Số dư tiền gửi trung bình là 150 triệu nhưng trung vị chỉ 12 triệu, cho thấy một nhóm nhỏ số dư rất lớn."},{"n":"Phân phối xác suất","d":"Mô hình toán mô tả khả năng xảy ra của các giá trị: chuẩn, nhị thức, Poisson, mũ, log-chuẩn.","k":"Nhận ra dạng phân phối giúp chọn phương pháp phân tích và phát hiện bất thường.","c":"Mặc định dữ liệu có phân phối chuẩn khi thực tế lệch hoặc có đuôi dày.","e":"Số giao dịch đến quầy mỗi giờ gần với phân phối Poisson, dùng để tính số quầy cần mở."},{"n":"Kiểm định giả thuyết","d":"Quy trình dùng dữ liệu mẫu để kết luận về một giả thuyết, với giả thuyết không và giá trị p.","k":"Giá trị p nhỏ cho thấy dữ liệu khó xảy ra nếu giả thuyết không đúng; cần xét cả mức độ ảnh hưởng thực tế.","c":"Giá trị p không phải là xác suất giả thuyết đúng; kiểm định nhiều lần làm tăng khả năng phát hiện giả.","e":"Kiểm định xem thời gian xử lý hồ sơ sau khi đổi quy trình có giảm một cách có ý nghĩa hay không."},{"n":"Hồi quy","d":"Mô hình hóa quan hệ giữa biến phụ thuộc và một hoặc nhiều biến độc lập.","k":"Hệ số hồi quy cho biết mức thay đổi trung bình; cần kiểm tra giả định về phần dư và đa cộng tuyến.","c":"Hồi quy cho thấy quan hệ, không tự chứng minh nhân quả.","e":"Hồi quy doanh số thẻ theo số lượng đơn vị chấp nhận thẻ và thu nhập bình quân từng khu vực."},{"n":"Thử nghiệm A/B","d":"Thử nghiệm có đối chứng: chia ngẫu nhiên người dùng vào các nhóm để so sánh tác động của một thay đổi.","k":"Cần xác định chỉ số chính, cỡ mẫu và thời gian chạy trước khi bắt đầu; ngẫu nhiên hóa loại bỏ biến gây nhiễu.","c":"Xem kết quả liên tục rồi dừng khi thấy có ý nghĩa (peeking) làm tăng tỷ lệ kết luận sai.","e":"So sánh hai thiết kế màn hình đăng ký thẻ, đo tỷ lệ hoàn thành trong 2 tuần với cỡ mẫu tính trước."}]},{"id":"modeling","title":"Mô hình hóa dữ liệu","summary":"Thiết kế cấu trúc dữ liệu ở mức khái niệm, logic và vật lý.","points":["Mô hình khái niệm thống nhất ngôn ngữ nghiệp vụ.","Mô hình quan hệ chuẩn hóa dùng cho hệ giao dịch; mô hình chiều (dimensional) dùng cho phân tích.","Data Vault phù hợp kho dữ liệu cần lưu vết lịch sử khi hệ nguồn thay đổi thường xuyên."],"children":["Mô hình khái niệm","Mô hình logic","Mô hình vật lý","Chuẩn hóa","Star schema","Data Vault"],"sub":[{"n":"Mô hình khái niệm","d":"Mô hình mức cao mô tả thực thể nghiệp vụ chính và quan hệ giữa chúng, không đi vào chi tiết kỹ thuật.","k":"Dùng để thống nhất ngôn ngữ giữa nghiệp vụ và CNTT; thường vẽ bằng sơ đồ thực thể – quan hệ.","c":"Bỏ qua bước này dẫn đến mỗi hệ thống hiểu ‘khách hàng’ theo một cách khác nhau.","e":"Mô hình khái niệm: Khách hàng sở hữu Tài khoản, Tài khoản có Giao dịch, Khách hàng thuộc Phân khúc."},{"n":"Mô hình logic","d":"Mô hình chi tiết thuộc tính, khóa, quan hệ và quy tắc, độc lập với hệ quản trị cơ sở dữ liệu cụ thể.","k":"Xác định khóa chính, khóa ngoại, lực lượng quan hệ và chuẩn hóa ở mức này.","c":"Thiếu định nghĩa nghiệp vụ cho từng thuộc tính làm mô hình khó dùng về sau.","e":"Thực thể Tài khoản gồm mã tài khoản, loại, ngày mở, trạng thái, mã khách hàng (khóa ngoại)."},{"n":"Mô hình vật lý","d":"Hiện thực mô hình logic trên hệ quản trị cụ thể: bảng, cột, kiểu dữ liệu, chỉ mục, phân vùng.","k":"Tối ưu cho hiệu năng và lưu trữ; có thể phi chuẩn hóa có chủ đích.","c":"Chọn kiểu dữ liệu sai (như dùng số thực cho tiền) gây lỗi khó sửa về sau.","e":"Bảng giao dịch phân vùng theo tháng, cột số tiền dùng kiểu NUMBER(18,2), chỉ mục trên mã tài khoản."},{"n":"Chuẩn hóa","d":"Tổ chức bảng theo các dạng chuẩn để giảm dư thừa và bất thường khi cập nhật.","k":"Hệ giao dịch thường chuẩn hóa đến 3NF; mỗi dữ kiện lưu một nơi.","c":"Chuẩn hóa quá mức cho hệ phân tích làm truy vấn phức tạp và chậm.","e":"Tách danh mục sản phẩm ra bảng riêng thay vì lặp tên sản phẩm trên mọi hợp đồng."},{"n":"Star schema","d":"Mô hình chiều gồm một bảng sự kiện ở trung tâm nối với các bảng chiều xung quanh.","k":"Dễ hiểu với người dùng nghiệp vụ, truy vấn phân tích nhanh; snowflake schema là biến thể chuẩn hóa bảng chiều.","c":"Xác định sai độ hạt (grain) của bảng sự kiện là lỗi thiết kế nghiêm trọng nhất.","e":"Bảng sự kiện số dư cuối ngày theo tài khoản nối với chiều thời gian, khách hàng, sản phẩm, chi nhánh."},{"n":"Data Vault","d":"Phương pháp mô hình hóa kho dữ liệu gồm Hub (khóa nghiệp vụ), Link (quan hệ) và Satellite (thuộc tính có lịch sử).","k":"Linh hoạt khi thêm nguồn mới, lưu vết lịch sử đầy đủ, phù hợp yêu cầu kiểm toán.","c":"Nhiều bảng và phép join nên thường cần thêm tầng mô hình chiều để phục vụ báo cáo.","e":"Hub Khách hàng lưu mã khách hàng; các Satellite lưu thông tin từ hệ thống lõi và CRM riêng biệt."}]},{"id":"engineering","title":"Kỹ thuật dữ liệu (Data Engineering)","summary":"Xây dựng và vận hành đường ống thu thập, biến đổi và cung cấp dữ liệu.","points":["ETL biến đổi trước khi nạp; ELT nạp trước rồi biến đổi trong nền tảng đích.","CDC đồng bộ thay đổi gần thời gian thực từ hệ nguồn.","Đường ống cần cơ chế đối soát (reconciliation) để phát hiện dữ liệu mất hoặc lệch."],"children":["ETL và ELT","CDC","Xử lý batch","Xử lý luồng","Điều phối pipeline","Đối soát dữ liệu"],"sub":[{"n":"ETL và ELT","d":"ETL trích xuất, biến đổi rồi nạp vào đích; ELT trích xuất, nạp nguyên trạng rồi biến đổi trong nền tảng đích.","k":"ELT tận dụng sức mạnh xử lý của kho dữ liệu hiện đại; ETL phù hợp khi cần làm sạch hoặc che dấu trước khi nạp.","c":"Thiếu ghi nhận lỗi theo từng bản ghi khiến một bản ghi hỏng làm dừng cả job.","e":"Nạp file giao dịch thô vào vùng staging, sau đó dùng dbt biến đổi thành bảng chuẩn."},{"n":"CDC","d":"Ghi nhận thay đổi thêm, sửa, xóa từ hệ nguồn để đồng bộ sang đích gần thời gian thực.","k":"CDC dựa trên log (như Debezium, Oracle GoldenGate) ít tác động hệ nguồn hơn CDC dựa trên truy vấn.","c":"Thay đổi cấu trúc bảng nguồn có thể làm gãy pipeline CDC nếu không được quản lý.","e":"Đồng bộ thay đổi thông tin khách hàng từ hệ thống lõi sang CRM với độ trễ dưới 1 phút."},{"n":"Xử lý batch","d":"Xử lý dữ liệu theo lô tại thời điểm định kỳ, như mỗi đêm hoặc mỗi giờ.","k":"Đơn giản, hiệu quả cho khối lượng lớn; phù hợp báo cáo không cần thời gian thực.","c":"Cửa sổ xử lý đêm bị thu hẹp khi dữ liệu tăng, dễ trễ báo cáo sáng hôm sau.","e":"Job cuối ngày tổng hợp số dư toàn bộ tài khoản để lập báo cáo quản trị."},{"n":"Xử lý luồng","d":"Xử lý dữ liệu liên tục khi sự kiện phát sinh, với độ trễ tính bằng giây hoặc mili giây.","k":"Công cụ như Kafka, Flink, Spark Structured Streaming; cần xử lý thời gian sự kiện, cửa sổ và dữ liệu đến trễ.","c":"Phức tạp và tốn kém hơn batch; chỉ dùng khi nghiệp vụ thực sự cần thời gian thực.","e":"Phát hiện giao dịch thẻ bất thường ngay khi phát sinh để gửi cảnh báo cho khách hàng."},{"n":"Điều phối pipeline","d":"Lập lịch, sắp thứ tự phụ thuộc và giám sát các bước trong pipeline dữ liệu.","k":"Mô hình hóa pipeline thành đồ thị có hướng không chu trình (DAG); có cơ chế thử lại và cảnh báo.","c":"Phụ thuộc ẩn giữa các job không khai báo gây chạy sai thứ tự và dữ liệu thiếu.","e":"Airflow DAG chạy job nạp giao dịch, rồi tính số dư, rồi làm mới data mart, cảnh báo khi bước nào lỗi."},{"n":"Đối soát dữ liệu","d":"So khớp dữ liệu giữa nguồn và đích để phát hiện thiếu, thừa hoặc sai lệch.","k":"Kiểm tra số bản ghi, tổng kiểm tra (checksum), tổng số tiền theo kỳ; lưu kết quả đối soát để kiểm toán.","c":"Chỉ đối soát số bản ghi mà không đối soát giá trị có thể bỏ sót sai lệch về số tiền.","e":"Sau mỗi lần nạp, so tổng số tiền giao dịch theo ngày giữa hệ thống lõi và kho dữ liệu, lệch thì dừng pipeline."}]},{"id":"warehouse","title":"Kho dữ liệu và Lakehouse","summary":"Nền tảng lưu trữ tập trung phục vụ báo cáo và phân tích.","points":["Data warehouse tối ưu cho dữ liệu có cấu trúc đã được làm sạch.","Data lake lưu dữ liệu thô đa dạng với chi phí thấp.","Lakehouse kết hợp hai mô hình nhờ định dạng bảng mở như Delta Lake và Apache Iceberg."],"children":["Data warehouse","Data lake","Lakehouse","Kiến trúc medallion","Data mart","Định dạng bảng mở"],"sub":[{"n":"Data warehouse","d":"Kho dữ liệu tập trung đã được làm sạch, tích hợp và tổ chức theo chủ đề để phục vụ phân tích và báo cáo.","k":"Dữ liệu có cấu trúc, lược đồ xác định khi ghi (schema-on-write), lưu lịch sử, là nguồn sự thật cho báo cáo.","c":"Thiết kế theo từng yêu cầu báo cáo riêng lẻ mà không có mô hình chung dẫn đến nhiều phiên bản số liệu.","e":"Kho dữ liệu ngân hàng tích hợp dữ liệu từ hệ thống lõi, thẻ, cho vay, CRM để lập báo cáo quản trị."},{"n":"Data lake","d":"Kho lưu trữ dữ liệu thô ở mọi định dạng với chi phí thấp, xác định lược đồ khi đọc (schema-on-read).","k":"Phù hợp dữ liệu phi cấu trúc, log, dữ liệu cho học máy; lưu trên object storage.","c":"Không có quản trị và danh mục dữ liệu, data lake biến thành đầm lầy dữ liệu (data swamp).","e":"Lưu log ứng dụng di động và ảnh chứng từ cho các dự án phân tích hành vi và học máy."},{"n":"Lakehouse","d":"Kiến trúc kết hợp chi phí thấp của data lake với khả năng quản lý và hiệu năng của data warehouse.","k":"Dựa trên định dạng bảng mở hỗ trợ giao dịch ACID, lịch sử phiên bản và thay đổi lược đồ.","c":"Chuyển sang lakehouse vẫn cần mô hình dữ liệu và quản trị như kho dữ liệu truyền thống.","e":"Một nền tảng duy nhất phục vụ cả báo cáo BI và huấn luyện mô hình học máy trên cùng dữ liệu."},{"n":"Kiến trúc medallion","d":"Tổ chức dữ liệu theo ba tầng Bronze (thô), Silver (đã làm sạch và chuẩn hóa), Gold (tổng hợp theo nhu cầu nghiệp vụ).","k":"Mỗi tầng tăng dần chất lượng và giá trị sử dụng; dễ truy vết và xử lý lại từ tầng dưới.","c":"Nhân bản dữ liệu qua nhiều tầng làm tăng chi phí lưu trữ nếu không có chính sách vòng đời.","e":"Bronze lưu file giao dịch nguyên trạng, Silver chuẩn hóa mã tiền tệ và loại trùng, Gold tính doanh số theo sản phẩm."},{"n":"Data mart","d":"Tập con của kho dữ liệu phục vụ một phòng ban hoặc chủ đề cụ thể.","k":"Nhỏ, tập trung, truy vấn nhanh; nên xây từ kho dữ liệu chung để giữ nhất quán số liệu.","c":"Data mart xây độc lập từ nguồn riêng tạo ra các ‘ốc đảo’ số liệu mâu thuẫn nhau.","e":"Data mart nhân sự phục vụ báo cáo biến động nhân sự, chi phí lương theo đơn vị."},{"n":"Định dạng bảng mở","d":"Định dạng lưu bảng dữ liệu mở như Delta Lake, Apache Iceberg, Apache Hudi trên nền tệp Parquet.","k":"Hỗ trợ giao dịch ACID, truy vấn dữ liệu tại thời điểm trong quá khứ (time travel) và thay đổi lược đồ an toàn.","c":"Nhiều công cụ hỗ trợ ở mức độ khác nhau; cần kiểm tra tương thích trước khi chọn.","e":"Dùng time travel để truy vấn lại bảng số dư đúng như trạng thái ngày chốt báo cáo tháng trước."}]},{"id":"bi","title":"BI và phân tích dữ liệu","summary":"Biến dữ liệu thành báo cáo, dashboard và hiểu biết phục vụ ra quyết định.","points":["Bốn cấp phân tích: mô tả, chẩn đoán, dự báo và đề xuất.","Định nghĩa chỉ số thống nhất quan trọng hơn biểu đồ đẹp.","Tầng ngữ nghĩa (semantic layer) giúp mọi báo cáo dùng chung một định nghĩa."],"children":["Phân tích mô tả","Phân tích chẩn đoán","Dashboard","Định nghĩa KPI","Semantic layer","Kể chuyện bằng dữ liệu"],"sub":[{"n":"Phân tích mô tả","d":"Phân tích trả lời câu hỏi ‘đã xảy ra điều gì’ bằng tổng hợp, so sánh và xu hướng.","k":"Là nền của mọi báo cáo định kỳ; cần định nghĩa chỉ số và kỳ so sánh rõ ràng.","c":"So sánh hai kỳ có số ngày làm việc khác nhau mà không điều chỉnh dẫn đến kết luận sai.","e":"Báo cáo số tài khoản mở mới theo tháng, theo kênh và theo chi nhánh."},{"n":"Phân tích chẩn đoán","d":"Phân tích trả lời câu hỏi ‘vì sao điều đó xảy ra’ bằng cách đi sâu vào chi tiết và tìm yếu tố đóng góp.","k":"Kỹ thuật: phân rã theo chiều (drill-down), so sánh nhóm, phân tích đóng góp vào biến động.","c":"Dễ dừng ở nguyên nhân đầu tiên tìm thấy thay vì kiểm tra các giả thuyết khác.","e":"Doanh số thẻ giảm 8% được phân rã thấy chủ yếu do một nhóm đơn vị chấp nhận thẻ lớn chuyển đối tác."},{"n":"Dashboard","d":"Giao diện trực quan hiển thị các chỉ số chính để theo dõi và ra quyết định.","k":"Thiết kế theo câu hỏi của người dùng; chỉ số quan trọng nhất ở góc trên bên trái; ít màu, nhất quán.","c":"Dashboard quá nhiều biểu đồ không dẫn đến hành động nào là lỗi phổ biến.","e":"Dashboard vận hành cho giám đốc chi nhánh gồm 6 chỉ số, mỗi chỉ số có mục tiêu và xu hướng 12 tháng."},{"n":"Định nghĩa KPI","d":"Xác định rõ ràng cách tính chỉ số hiệu quả then chốt: công thức, nguồn dữ liệu, kỳ tính, người chịu trách nhiệm.","k":"Mỗi KPI có một định nghĩa duy nhất trong từ điển nghiệp vụ; phân biệt chỉ số dẫn dắt và chỉ số kết quả.","c":"Hai đơn vị tính cùng tên KPI theo hai cách khác nhau làm mất niềm tin vào mọi báo cáo.","e":"KPI ‘Khách hàng hoạt động’ được định nghĩa là có ít nhất một giao dịch chủ động trong 90 ngày."},{"n":"Semantic layer","d":"Tầng trung gian định nghĩa chỉ số, chiều và quan hệ theo ngôn ngữ nghiệp vụ, dùng chung cho mọi báo cáo.","k":"Người dùng kéo thả chỉ số đã định nghĩa sẵn thay vì tự viết công thức; bảo đảm nhất quán.","c":"Không có semantic layer, mỗi báo cáo tự tính lại chỉ số và dần dần lệch nhau.","e":"Mô hình ngữ nghĩa Power BI dùng chung định nghĩa doanh thu phí cho mọi báo cáo của khối bán lẻ."},{"n":"Kể chuyện bằng dữ liệu","d":"Trình bày kết quả phân tích thành câu chuyện có bối cảnh, phát hiện chính và đề xuất hành động.","k":"Bắt đầu từ thông điệp chính, chọn biểu đồ phù hợp, loại bỏ chi tiết không cần thiết.","c":"Trình bày tất cả phân tích đã làm thay vì điều người nghe cần biết để quyết định.","e":"Mở đầu bằng ‘Tỷ lệ rời bỏ tăng gấp đôi ở nhóm khách hàng mới dưới 6 tháng’, sau đó mới đưa bằng chứng và đề xuất."}]},{"id":"governance","title":"Quản trị dữ liệu","summary":"Khung tổ chức, chính sách và vai trò để quản lý dữ liệu như một tài sản.","points":["DAMA-DMBOK mô tả các lĩnh vực quản lý dữ liệu, với quản trị dữ liệu ở trung tâm.","Vai trò Data Owner và Data Steward phân định trách nhiệm về dữ liệu.","Danh mục dữ liệu (data catalog) và dòng chảy dữ liệu (lineage) cho biết dữ liệu đến từ đâu."],"children":["Chính sách dữ liệu","Data Owner và Data Steward","Data catalog","Metadata","Data lineage","Từ điển nghiệp vụ"],"sub":[{"n":"Chính sách dữ liệu","d":"Văn bản quy định nguyên tắc, vai trò và yêu cầu về quản lý, sử dụng và bảo vệ dữ liệu trong tổ chức.","k":"Chính sách cấp cao được cụ thể hóa bằng tiêu chuẩn và quy trình; phê duyệt bởi cấp lãnh đạo.","c":"Chính sách không có người thực thi và cơ chế đo lường tuân thủ chỉ là văn bản.","e":"Chính sách phân loại dữ liệu thành công khai, nội bộ, mật, tuyệt mật với yêu cầu bảo vệ tương ứng."},{"n":"Data Owner và Data Steward","d":"Data Owner chịu trách nhiệm cuối cùng về một miền dữ liệu; Data Steward quản lý định nghĩa, chất lượng và cách dùng hằng ngày.","k":"Cả hai vai trò thuộc phía nghiệp vụ; CNTT là người giám hộ kỹ thuật (custodian).","c":"Giao trách nhiệm dữ liệu cho CNTT khiến quyết định về định nghĩa và chất lượng không có người quyết.","e":"Giám đốc khối bán lẻ là Data Owner dữ liệu khách hàng cá nhân; mỗi sản phẩm có một Data Steward."},{"n":"Data catalog","d":"Danh mục có thể tìm kiếm về các tài sản dữ liệu của tổ chức: bảng, báo cáo, định nghĩa, chủ sở hữu.","k":"Giúp người dùng tìm và hiểu dữ liệu trước khi dùng; kết hợp metadata tự động và mô tả của con người.","c":"Danh mục chỉ có metadata kỹ thuật mà thiếu mô tả nghiệp vụ thì ít người dùng.","e":"Người phân tích tìm ‘dư nợ’ trên data catalog, thấy bảng nguồn, định nghĩa, chủ sở hữu và mức độ tin cậy."},{"n":"Metadata","d":"Dữ liệu mô tả dữ liệu: metadata kỹ thuật (lược đồ, kiểu), nghiệp vụ (định nghĩa, quy tắc) và vận hành (thời gian nạp, chất lượng).","k":"Là nền của catalog, lineage và quản trị; nên được thu thập tự động từ hệ thống.","c":"Metadata không được cập nhật khi hệ thống thay đổi nhanh chóng mất giá trị.","e":"Mỗi cột trong kho dữ liệu có định nghĩa nghiệp vụ, mức phân loại bảo mật và người quản lý."},{"n":"Data lineage","d":"Dòng chảy dữ liệu từ nguồn, qua các bước biến đổi, đến báo cáo và mô hình sử dụng.","k":"Hỗ trợ phân tích ảnh hưởng, tìm nguyên nhân sai lệch và đáp ứng yêu cầu kiểm toán như BCBS 239.","c":"Lineage vẽ tay nhanh chóng lỗi thời; nên thu thập tự động từ công cụ ETL và truy vấn.","e":"Khi sửa quy tắc tính dư nợ quá hạn, lineage chỉ ra 7 báo cáo và 2 mô hình bị ảnh hưởng."},{"n":"Từ điển nghiệp vụ","d":"Tập hợp thuật ngữ nghiệp vụ được định nghĩa thống nhất trong toàn tổ chức (business glossary).","k":"Mỗi thuật ngữ có định nghĩa, người sở hữu, ví dụ và liên kết tới dữ liệu vật lý.","c":"Định nghĩa viết bằng ngôn ngữ kỹ thuật hoặc sao chép từ tên cột không giúp người dùng nghiệp vụ.","e":"Thuật ngữ ‘Nợ xấu’ được định nghĩa theo quy định phân loại nợ hiện hành và liên kết tới cột dữ liệu tương ứng."}]},{"id":"dq","title":"Chất lượng dữ liệu","summary":"Đo lường và cải thiện mức độ phù hợp của dữ liệu với mục đích sử dụng.","points":["Các chiều chất lượng phổ biến: đầy đủ, chính xác, nhất quán, kịp thời, hợp lệ và duy nhất.","Sửa lỗi tại nguồn hiệu quả hơn làm sạch ở hạ nguồn.","Quy tắc chất lượng cần có ngưỡng và người chịu trách nhiệm."],"children":["Các chiều chất lượng","Profiling","Quy tắc kiểm tra","Làm sạch dữ liệu","Giám sát chất lượng"],"sub":[{"n":"Các chiều chất lượng","d":"Các khía cạnh đo lường chất lượng dữ liệu: đầy đủ, chính xác, nhất quán, kịp thời, hợp lệ, duy nhất.","k":"Mỗi chiều có quy tắc đo riêng; mức chấp nhận phụ thuộc mục đích sử dụng.","c":"Đo một chiều mà bỏ qua chiều khác: dữ liệu đầy đủ nhưng sai vẫn là dữ liệu kém.","e":"Trường số điện thoại: đầy đủ 97%, hợp lệ định dạng 92%, trùng lặp giữa các khách hàng 1,5%."},{"n":"Profiling","d":"Khảo sát dữ liệu để hiểu cấu trúc, phân phối, giá trị rỗng, giá trị bất thường trước khi dùng.","k":"Là bước đầu tiên của mọi dự án dữ liệu và di chuyển dữ liệu; phát hiện vấn đề sớm.","c":"Bỏ qua profiling dẫn đến phát hiện dữ liệu bẩn ở cuối dự án, khi chi phí sửa đã cao.","e":"Profiling phát hiện 8% hồ sơ có ngày sinh là 01/01/1900, giá trị mặc định khi nhập thiếu."},{"n":"Quy tắc kiểm tra","d":"Quy tắc định nghĩa dữ liệu hợp lệ, được kiểm tra tự động và cho kết quả đạt hoặc không đạt.","k":"Quy tắc có ngưỡng, mức nghiêm trọng, người chịu trách nhiệm; chạy trong pipeline hoặc theo lịch.","c":"Quy tắc quá nhiều và cảnh báo liên tục mà không ai xử lý sẽ bị bỏ qua.","e":"Quy tắc: ngày giải ngân không được sau ngày đáo hạn; vi phạm thì chặn bản ghi và thông báo steward."},{"n":"Làm sạch dữ liệu","d":"Sửa, chuẩn hóa hoặc loại bỏ dữ liệu sai, thiếu, trùng lặp.","k":"Chuẩn hóa định dạng (địa chỉ, tên), loại trùng, điền giá trị theo quy tắc; ghi nhận mọi thay đổi.","c":"Làm sạch ở hạ nguồn mà không sửa tại nguồn thì lỗi tiếp tục phát sinh mãi.","e":"Chuẩn hóa tên tỉnh thành theo danh mục đơn vị hành chính hiện hành trước khi lập báo cáo theo vùng."},{"n":"Giám sát chất lượng","d":"Theo dõi liên tục các chỉ số chất lượng dữ liệu theo thời gian và cảnh báo khi suy giảm.","k":"Dashboard chất lượng theo miền dữ liệu; xu hướng quan trọng hơn con số một thời điểm.","c":"Chỉ đo mà không có quy trình xử lý sự cố chất lượng thì không cải thiện được gì.","e":"Dashboard chất lượng dữ liệu khách hàng theo tuần, cảnh báo khi tỷ lệ đầy đủ giảm quá 2 điểm phần trăm."}]},{"id":"mdm","title":"Dữ liệu chủ (MDM)","summary":"Quản lý phiên bản thống nhất, tin cậy của các thực thể cốt lõi như khách hàng, sản phẩm, đơn vị.","points":["Cùng một khách hàng có thể tồn tại nhiều bản ghi ở nhiều hệ thống.","Khớp và hợp nhất bản ghi tạo ra bản ghi vàng (golden record).","Dữ liệu tham chiếu như mã tỉnh, mã tiền tệ cũng cần quản lý tập trung."],"children":["Dữ liệu chủ","Dữ liệu tham chiếu","Khớp bản ghi","Golden record","Kiểu triển khai MDM"],"sub":[{"n":"Dữ liệu chủ","d":"Dữ liệu về các thực thể cốt lõi dùng chung giữa nhiều hệ thống: khách hàng, sản phẩm, nhân viên, đơn vị.","k":"Thay đổi chậm, được nhiều quy trình tham chiếu; sai ở dữ liệu chủ lan ra mọi hệ thống.","c":"Mỗi hệ thống tự quản lý bản sao dữ liệu chủ dẫn đến thông tin lệch nhau.","e":"Thông tin khách hàng được quản lý tập trung và phân phối tới hệ thống lõi, thẻ, cho vay, CRM."},{"n":"Dữ liệu tham chiếu","d":"Bộ mã và giá trị chuẩn dùng để phân loại, như mã tỉnh, mã tiền tệ, mã ngành nghề, loại giấy tờ.","k":"Thường theo chuẩn bên ngoài (ISO 4217 cho tiền tệ) hoặc danh mục của cơ quan nhà nước; cần quản lý phiên bản.","c":"Thay đổi danh mục như sáp nhập đơn vị hành chính cần được cập nhật đồng bộ ở mọi hệ thống.","e":"Cập nhật danh mục đơn vị hành chính mới và bảng ánh xạ từ mã cũ sang mã mới cho mọi hệ thống."},{"n":"Khớp bản ghi","d":"Xác định các bản ghi khác nhau thực chất là cùng một thực thể.","k":"Khớp chính xác theo định danh và khớp mờ theo tên, ngày sinh, địa chỉ với ngưỡng điểm; trường hợp không chắc cần người xem xét.","c":"Ngưỡng quá thấp gộp nhầm hai người khác nhau, quá cao bỏ sót bản trùng.","e":"Ghép hồ sơ ‘Nguyễn Văn An, 12/03/1985’ trên hệ thống thẻ với ‘Nguyen Van An, 1985-03-12’ trên hệ thống lõi."},{"n":"Golden record","d":"Bản ghi hợp nhất, tin cậy nhất của một thực thể, tạo từ nhiều nguồn theo quy tắc chọn giá trị (survivorship).","k":"Quy tắc theo độ tin cậy nguồn, thời điểm cập nhật gần nhất, mức độ đầy đủ.","c":"Không lưu vết giá trị đến từ nguồn nào thì khó giải thích và khó sửa khi sai.","e":"Số điện thoại lấy từ lần xác thực OTP gần nhất; địa chỉ lấy từ hệ thống lõi đã được kiểm tra giấy tờ."},{"n":"Kiểu triển khai MDM","d":"Các cách triển khai MDM: registry (chỉ lưu liên kết), consolidation (hợp nhất để tham chiếu), coexistence (đồng bộ hai chiều), centralized (tập trung tạo và sửa).","k":"Chọn theo mức kiểm soát cần có và độ phức tạp thay đổi quy trình chấp nhận được.","c":"Đi thẳng lên mô hình tập trung đòi hỏi thay đổi quy trình lớn và rủi ro cao.","e":"Bắt đầu bằng consolidation để có góc nhìn khách hàng thống nhất cho báo cáo, sau đó tiến dần tới coexistence."}]},{"id":"privacy","title":"Bảo vệ dữ liệu cá nhân","summary":"Nguyên tắc và nghĩa vụ pháp lý khi xử lý dữ liệu cá nhân.","points":["Tại Việt Nam, Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15 và Nghị định hướng dẫn 356/2025/NĐ-CP cùng có hiệu lực từ ngày 01/01/2026, thay thế Nghị định 13/2023/NĐ-CP.","Nguyên tắc cốt lõi: có căn cứ hợp pháp, giới hạn mục đích, tối thiểu hóa và bảo đảm an toàn.","Kỹ thuật bảo vệ gồm che dấu (masking), giả danh hóa, ẩn danh hóa và mã hóa."],"children":["Căn cứ xử lý và sự đồng ý","Dữ liệu cá nhân nhạy cảm","Quyền của chủ thể dữ liệu","Masking và ẩn danh hóa","Đánh giá tác động xử lý dữ liệu","Chuyển dữ liệu ra nước ngoài"],"sub":[{"n":"Căn cứ xử lý và sự đồng ý","d":"Cơ sở pháp lý cho phép xử lý dữ liệu cá nhân, trong đó sự đồng ý của chủ thể dữ liệu là căn cứ phổ biến nhất.","k":"Theo pháp luật Việt Nam, sự đồng ý phải tự nguyện, rõ ràng, cụ thể theo mục đích; có các trường hợp xử lý không cần đồng ý theo luật định.","c":"Gộp mọi mục đích vào một ô đồng ý chung hoặc đồng ý mặc định không đáp ứng yêu cầu.","e":"Ứng dụng tách riêng đồng ý cho mục đích cung cấp dịch vụ và mục đích tiếp thị sản phẩm."},{"n":"Dữ liệu cá nhân nhạy cảm","d":"Nhóm dữ liệu cá nhân mà khi bị xâm phạm gây ảnh hưởng nghiêm trọng, như sức khỏe, sinh trắc học, tài chính, vị trí.","k":"Yêu cầu bảo vệ cao hơn: thông báo cho chủ thể, đánh giá tác động, kiểm soát truy cập chặt chẽ.","c":"Dữ liệu tài chính và giao dịch của khách hàng ngân hàng thuộc nhóm nhạy cảm; cần tra cứu danh mục trong văn bản hiện hành.","e":"Dữ liệu sinh trắc học khuôn mặt dùng cho xác thực được lưu tách biệt, mã hóa và giới hạn quyền truy cập."},{"n":"Quyền của chủ thể dữ liệu","d":"Các quyền của người có dữ liệu: được biết, đồng ý, rút lại đồng ý, truy cập, chỉnh sửa, xóa, hạn chế xử lý, phản đối.","k":"Tổ chức cần quy trình tiếp nhận và xử lý yêu cầu trong thời hạn luật định.","c":"Dữ liệu phân tán trên nhiều hệ thống khiến việc đáp ứng yêu cầu xóa hoặc truy cập rất khó nếu không có danh mục dữ liệu.","e":"Khách hàng rút lại đồng ý tiếp thị; hệ thống loại khách hàng khỏi mọi danh sách chiến dịch trong thời hạn quy định."},{"n":"Masking và ẩn danh hóa","d":"Masking che hoặc thay thế giá trị nhạy cảm; ẩn danh hóa loại bỏ vĩnh viễn khả năng nhận diện; giả danh hóa thay định danh bằng mã có thể đảo ngược.","k":"Dữ liệu cho môi trường phát triển và kiểm thử nên được che dấu; chỉ dữ liệu ẩn danh thực sự mới không còn là dữ liệu cá nhân.","c":"Kết hợp nhiều thuộc tính tưởng như vô hại (ngày sinh, mã bưu chính, giới tính) vẫn có thể nhận diện cá nhân.","e":"Sao chép dữ liệu production sang UAT với số giấy tờ, số điện thoại, tên được thay bằng giá trị giả nhất quán."},{"n":"Đánh giá tác động xử lý dữ liệu","d":"Đánh giá rủi ro đối với quyền của chủ thể dữ liệu trước khi thực hiện hoạt động xử lý dữ liệu cá nhân.","k":"Nêu mục đích, loại dữ liệu, bên xử lý, thời gian lưu trữ, rủi ro và biện pháp bảo vệ; lập hồ sơ theo mẫu của văn bản hướng dẫn.","c":"Hồ sơ lập một lần rồi không cập nhật khi mục đích hoặc bên xử lý thay đổi.","e":"Lập hồ sơ đánh giá tác động trước khi triển khai mô hình chấm điểm tín dụng dùng dữ liệu giao dịch."},{"n":"Chuyển dữ liệu ra nước ngoài","d":"Chuyển dữ liệu cá nhân của người Việt Nam ra ngoài lãnh thổ, bao gồm lưu trữ hoặc xử lý ở nước ngoài.","k":"Cần đánh giá tác động chuyển dữ liệu ra nước ngoài và đáp ứng thủ tục theo luật và nghị định hướng dẫn.","c":"Dùng dịch vụ cloud hoặc SaaS đặt máy chủ ở nước ngoài cũng có thể là chuyển dữ liệu ra nước ngoài.","e":"Trước khi dùng công cụ phân tích SaaS lưu dữ liệu ở nước ngoài, lập hồ sơ đánh giá và kiểm tra hợp đồng xử lý dữ liệu."}]}],"concepts":[{"term":"ETL và ELT","def":"ETL trích xuất, biến đổi rồi nạp; ELT trích xuất, nạp rồi biến đổi trong nền tảng đích.","ex":"ELT nạp dữ liệu giao dịch thô vào lakehouse, sau đó biến đổi bằng SQL.","mis":"ELT luôn tốt hơn. ETL vẫn phù hợp khi cần làm sạch hoặc che dấu dữ liệu trước khi vào đích."},{"term":"CDC (Change Data Capture)","def":"Kỹ thuật ghi nhận thay đổi thêm, sửa, xóa từ hệ nguồn để đồng bộ sang hệ đích.","ex":"Đọc log giao dịch của cơ sở dữ liệu để cập nhật kho dữ liệu gần thời gian thực.","mis":"CDC không ảnh hưởng hệ nguồn. Cần đánh giá tải và quyền truy cập log."},{"term":"Bảng sự kiện và bảng chiều (Fact, Dimension)","def":"Bảng sự kiện chứa số đo nghiệp vụ; bảng chiều chứa ngữ cảnh mô tả.","ex":"Bảng sự kiện giao dịch thẻ nối với chiều khách hàng, thời gian và đơn vị chấp nhận thẻ.","mis":"Kho phân tích nên chuẩn hóa tối đa
