. Mô hình chiều chấp nhận dư thừa để truy vấn đơn giản và nhanh."},{"term":"Slowly Changing Dimension (SCD)","def":"Kỹ thuật xử lý thuộc tính của bảng chiều thay đổi theo thời gian.","ex":"SCD loại 2 lưu lịch sử khi khách hàng chuyển phân khúc.","mis":"Ghi đè là đủ. Ghi đè làm sai lệch báo cáo lịch sử."},{"term":"Dòng chảy dữ liệu (Data lineage)","def":"Mô tả dữ liệu đi từ nguồn nào, qua biến đổi gì, đến báo cáo nào.","ex":"Truy được chỉ tiêu dư nợ trên báo cáo về bảng và hệ thống nguồn.","mis":"Chỉ cần cho kiểm toán. Lineage giúp phân tích ảnh hưởng mỗi khi có thay đổi."},{"term":"Data Steward","def":"Người chịu trách nhiệm về định nghĩa, chất lượng và cách sử dụng một miền dữ liệu.","ex":"Chuyên viên khối bán lẻ phụ trách định nghĩa và chất lượng dữ liệu khách hàng cá nhân.","mis":"Đó là việc của bộ phận CNTT. Trách nhiệm về dữ liệu thuộc về phía nghiệp vụ."},{"term":"Các chiều chất lượng dữ liệu","def":"Các khía cạnh đo lường chất lượng như đầy đủ, chính xác, nhất quán, kịp thời.","ex":"3% hồ sơ thiếu số điện thoại là vấn đề về tính đầy đủ.","mis":"Chất lượng dữ liệu là tuyệt đối. Chất lượng được đánh giá theo mục đích sử dụng."},{"term":"Bản ghi vàng (Golden record)","def":"Bản ghi hợp nhất, tin cậy nhất của một thực thể từ nhiều nguồn.","ex":"Hợp nhất ba bản ghi của cùng một khách hàng từ hệ thống lõi, hệ thống thẻ và CRM.","mis":"Chỉ là loại bỏ trùng lặp. Cần quy tắc chọn giá trị đúng (survivorship) cho từng thuộc tính."},{"term":"Ẩn danh hóa và giả danh hóa","def":"Ẩn danh hóa loại bỏ khả năng nhận diện cá nhân không thể đảo ngược; giả danh hóa thay định danh bằng mã, có thể đảo ngược khi có khóa.","ex":"Dữ liệu kiểm thử dùng mã giả thay cho số định danh thật.","mis":"Giả danh hóa là ẩn danh. Dữ liệu giả danh hóa vẫn là dữ liệu cá nhân."},{"term":"Tương quan và nhân quả","def":"Hai biến cùng biến động không có nghĩa biến này gây ra biến kia.","ex":"Chi nhánh đông nhân sự có doanh số cao hơn, nhưng cả hai có thể cùng do vị trí đông dân cư.","mis":"Dữ liệu lớn tự chứng minh nhân quả. Cần thiết kế thử nghiệm hoặc phương pháp suy luận nhân quả."}],"path":{"foundation":{"goal":"Đọc và truy vấn dữ liệu chính xác.","topics":["SQL cơ bản đến trung cấp","Excel và trực quan hóa","Thống kê mô tả","Khái niệm mô hình dữ liệu"],"signal":"Viết truy vấn nhiều bảng cho kết quả đúng và giải thích được số liệu."},"intermediate":{"goal":"Xây sản phẩm dữ liệu phục vụ nghiệp vụ.","topics":["Mô hình chiều","ETL và ELT","Công cụ BI","Chất lượng dữ liệu"],"signal":"Xây một data mart và dashboard có định nghĩa chỉ số được nghiệp vụ xác nhận."},"advanced":{"goal":"Thiết kế nền tảng dữ liệu.","topics":["Kiến trúc lakehouse","Xử lý luồng và CDC","Điều phối pipeline","Quản trị dữ liệu và lineage"],"signal":"Thiết kế nền tảng dữ liệu có đối soát, giám sát chất lượng và phân quyền đúng."},"expert":{"goal":"Xây chiến lược dữ liệu cho tổ chức.","topics":["Chiến lược và mô hình vận hành dữ liệu","DAMA-DMBOK","Tuân thủ bảo vệ dữ liệu cá nhân","Data mesh và sản phẩm dữ liệu"],"signal":"Xây khung quản trị dữ liệu được áp dụng và cải thiện đo được chất lượng dữ liệu trọng yếu."}},"standards":[{"name":"DAMA-DMBOK, 2nd Edition Revised (2024)","note":"Khối kiến thức quản lý dữ liệu.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15","note":"Hiệu lực từ 01/01/2026; được hướng dẫn bởi Nghị định 356/2025/NĐ-CP.","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"Luật Dữ liệu số 60/2024/QH15","note":"Khung pháp lý về dữ liệu số của Việt Nam.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Nghị định 356/2025/NĐ-CP","note":"Quy định chi tiết Luật Bảo vệ dữ liệu cá nhân, hiệu lực từ 01/01/2026; thay thế Nghị định 13/2023/NĐ-CP (đã hết hiệu lực).","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"ISO/IEC 27701:2025","note":"Hệ thống quản lý thông tin quyền riêng tư (PIMS), thay thế bản 2019; từ bản 2025 là chuẩn độc lập, theo hiểu biết đến 06/2026"},{"name":"SnowPro Core","note":"Nền tảng Snowflake.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Chuyên viên phân tích dữ liệu","skills":"SQL, BI, hiểu nghiệp vụ"},{"role":"Kỹ sư dữ liệu","skills":"Pipeline, Spark, mô hình dữ liệu"},{"role":"Kiến trúc sư dữ liệu","skills":"Kiến trúc nền tảng, mô hình dữ liệu doanh nghiệp"},{"role":"Chuyên viên quản trị dữ liệu","skills":"Chính sách, metadata, lineage"},{"role":"Chuyên viên chất lượng dữ liệu","skills":"Profiling, quy tắc kiểm tra, giám sát"},{"role":"Cán bộ bảo vệ dữ liệu cá nhân (DPO)","skills":"Pháp lý dữ liệu cá nhân, đánh giá tác động"}],"glossary":[["Data pipeline","Đường ống dữ liệu","Chuỗi bước tự động di chuyển và biến đổi dữ liệu."],["Data warehouse","Kho dữ liệu","Kho tập trung phục vụ phân tích và báo cáo."],["Metadata","Siêu dữ liệu","Dữ liệu mô tả dữ liệu."],["Lineage","Dòng chảy dữ liệu","Nguồn gốc và quá trình biến đổi của dữ liệu."],["Data owner","Chủ sở hữu dữ liệu","Người chịu trách nhiệm cuối cùng về một miền dữ liệu."],["Data steward","Người quản lý dữ liệu","Người quản lý định nghĩa và chất lượng hằng ngày."],["Master data","Dữ liệu chủ","Dữ liệu về thực thể cốt lõi dùng chung."],["Reference data","Dữ liệu tham chiếu","Bộ mã và giá trị chuẩn dùng để phân loại."],["Reconciliation","Đối soát","So khớp dữ liệu giữa nguồn và đích."],["Masking","Che dấu dữ liệu","Thay thế giá trị nhạy cảm khi hiển thị hoặc sao chép."]],"quiz":[{"q":"Mô hình nào thường dùng cho kho dữ liệu phân tích?","o":["Mô hình chuẩn hóa 3NF cho hệ giao dịch","Star schema","Mô hình mạng","Tệp phẳng"],"a":1,"e":"Star schema với bảng sự kiện và bảng chiều giúp truy vấn phân tích đơn giản và nhanh."},{"q":"SCD loại 2 dùng để làm gì?","o":["Ghi đè giá trị cũ","Lưu lịch sử bằng cách thêm bản ghi mới kèm thời gian hiệu lực","Xóa bản ghi cũ","Mã hóa dữ liệu"],"a":1,"e":"Mỗi thay đổi tạo một phiên bản mới, giữ nguyên phiên bản cũ cho báo cáo lịch sử."},{"q":"Dữ liệu đã giả danh hóa có còn là dữ liệu cá nhân không?","o":["Không còn là dữ liệu cá nhân","Vẫn là dữ liệu cá nhân vì có thể đảo ngược","Trở thành dữ liệu công khai","Được tự do chuyển ra nước ngoài"],"a":1,"e":"Chỉ dữ liệu ẩn danh hóa không thể đảo ngược mới không còn nhận diện được cá nhân."},{"q":"Ai nên chịu trách nhiệm định nghĩa chỉ tiêu nghiệp vụ?","o":["Nhóm hạ tầng","Data owner và data steward phía nghiệp vụ","Nhà cung cấp phần mềm","Người xem báo cáo"],"a":1,"e":"Định nghĩa chỉ tiêu là quyết định nghiệp vụ; CNTT hỗ trợ hiện thực."},{"q":"Chi nhánh có nhiều ATM hơn có doanh số cao hơn. Kết luận nào hợp lý nhất?","o":["Thêm ATM chắc chắn tăng doanh số","Hai biến tương quan, cần phân tích thêm trước khi kết luận nhân quả","Doanh số cao khiến ATM tăng","Dữ liệu bị sai"],"a":1,"e":"Có thể có biến gây nhiễu như vị trí hoặc mật độ dân cư."}],"links":[{"to":"ai","why":"Dữ liệu chất lượng là điều kiện tiên quyết cho mô hình AI."},{"to":"it","why":"Nền tảng dữ liệu chạy trên hạ tầng và cloud."},{"to":"sec","why":"Bảo vệ dữ liệu cá nhân cần kiểm soát an ninh như mã hóa và phân quyền."},{"to":"cs","why":"Lý thuyết cơ sở dữ liệu và hệ phân tán là nền kỹ thuật."}]},{"id":"sec","code":"IV.7","title":"Cybersecurity","vi":"An ninh mạng","summary":"An ninh mạng (Cybersecurity) là tập hợp con người, quy trình và công nghệ nhằm bảo vệ hệ thống, mạng, ứng dụng và dữ liệu trước truy cập trái phép, gián đoạn và phá hoại.","diff":["Khác An toàn thông tin (Information Security): an toàn thông tin bảo vệ thông tin ở mọi dạng, kể cả giấy tờ; an ninh mạng tập trung vào môi trường số.","Khác IT: IT bảo đảm hệ thống chạy được; an ninh bảo đảm hệ thống chạy đúng, đúng người sử dụng và chống bị lạm dụng.","Nội dung trong portal này dừng ở mức khái niệm và phòng thủ, không hướng dẫn kỹ thuật tấn công."],"topics":[{"id":"fundamentals","title":"Nền tảng an ninh","summary":"Các nguyên tắc cốt lõi định hướng mọi quyết định bảo mật.","points":["Tam giác CIA: bảo mật, toàn vẹn và sẵn sàng.","Phòng thủ nhiều lớp (defense in depth) không trông cậy vào một biện pháp duy nhất.","Đặc quyền tối thiểu (least privilege) giới hạn thiệt hại khi tài khoản bị chiếm."],"children":["Tam giác CIA","Phòng thủ nhiều lớp","Đặc quyền tối thiểu","Zero Trust","Rủi ro, mối đe dọa và lỗ hổng"],"sub":[{"n":"Tam giác CIA","d":"Ba mục tiêu cốt lõi của an ninh thông tin: bảo mật (chỉ người được phép truy cập), toàn vẹn (không bị sửa trái phép), sẵn sàng (truy cập được khi cần).","k":"Mỗi biện pháp kiểm soát phục vụ một hoặc nhiều mục tiêu; ưu tiên phụ thuộc vào loại hệ thống.","c":"Tập trung vào bảo mật mà bỏ quên toàn vẹn và sẵn sàng dẫn đến bỏ ngỏ rủi ro sửa dữ liệu hoặc gián đoạn.","e":"Hệ thống thanh toán ưu tiên toàn vẹn và sẵn sàng; hồ sơ nhân sự ưu tiên bảo mật."},{"n":"Phòng thủ nhiều lớp","d":"Kết hợp nhiều lớp kiểm soát độc lập để một lớp thất bại không dẫn đến mất an toàn.","k":"Các lớp: con người, vật lý, mạng, điểm cuối, ứng dụng, dữ liệu; kết hợp phòng ngừa, phát hiện và phản ứng.","c":"Nhiều lớp cùng phụ thuộc một điểm (như một tài khoản quản trị) thì không còn độc lập.","e":"Dữ liệu khách hàng được bảo vệ bởi phân vùng mạng, xác thực MFA, phân quyền, mã hóa và giám sát truy cập."},{"n":"Đặc quyền tối thiểu","d":"Chỉ cấp quyền tối thiểu cần thiết để thực hiện công việc, trong thời gian cần thiết.","k":"Áp dụng cho người dùng, tài khoản dịch vụ và ứng dụng; kết hợp với rà soát quyền định kỳ.","c":"Quyền tích lũy khi nhân viên chuyển vị trí mà không thu hồi quyền cũ là lỗ hổng phổ biến.","e":"Nhân viên chuyển từ phòng tín dụng sang phòng vận hành được thu hồi quyền hệ thống tín dụng ngay khi chuyển."},{"n":"Zero Trust","d":"Mô hình không mặc định tin cậy dựa trên vị trí mạng; mọi truy cập đều được xác minh danh tính, thiết bị và ngữ cảnh.","k":"NIST SP 800-207 mô tả kiến trúc Zero Trust; triển khai dần theo từng nhóm tài nguyên.","c":"Zero Trust không phải sản phẩm mua được; là lộ trình thay đổi kiến trúc và vận hành.","e":"Truy cập ứng dụng nội bộ yêu cầu MFA và kiểm tra thiết bị đạt chuẩn, kể cả khi ngồi trong văn phòng."},{"n":"Rủi ro, mối đe dọa và lỗ hổng","d":"Rủi ro là khả năng một mối đe dọa khai thác lỗ hổng gây tác động lên tài sản; mối đe dọa là tác nhân gây hại; lỗ hổng là điểm yếu.","k":"Rủi ro được đánh giá theo khả năng xảy ra và mức tác động; xử lý bằng giảm thiểu, chuyển giao, tránh hoặc chấp nhận.","c":"Danh sách lỗ hổng dài không phải đánh giá rủi ro nếu không gắn với tài sản và mối đe dọa cụ thể.","e":"Máy chủ chưa vá (lỗ hổng), nhóm mã độc tống tiền (mối đe dọa), gián đoạn dịch vụ thanh toán (tác động)."}]},{"id":"netsec","title":"An ninh hạ tầng mạng","summary":"Bảo vệ hạ tầng mạng và luồng dữ liệu truyền qua mạng.","points":["Tường lửa và phân vùng mạng kiểm soát luồng truy cập.","IDS và IPS phát hiện, ngăn chặn hành vi bất thường.","Mã hóa đường truyền (TLS, VPN) bảo vệ dữ liệu khi truyền."],"children":["Tường lửa","Phân vùng mạng","IDS và IPS","VPN","Bảo vệ trước DDoS","Bảo mật mạng không dây"],"sub":[{"n":"Tường lửa","d":"Thiết bị hoặc phần mềm kiểm soát lưu lượng mạng theo tập luật cho phép hoặc chặn.","k":"Tường lửa thế hệ mới (NGFW) nhận biết ứng dụng, người dùng, kết hợp phòng chống xâm nhập; nguyên tắc chặn mặc định.","c":"Tập luật tích lũy nhiều năm không rà soát chứa luật thừa và luật quá rộng như cho phép mọi cổng.","e":"Rà soát định kỳ luật tường lửa, xóa luật không có lưu lượng trong 6 tháng và luật không rõ người yêu cầu."},{"n":"Phân vùng mạng","d":"Chia mạng thành các vùng theo mức tin cậy và chức năng, kiểm soát chặt lưu lượng giữa các vùng.","k":"Vi phân vùng (microsegmentation) kiểm soát đến từng máy chủ hoặc workload; hạn chế di chuyển ngang của kẻ tấn công.","c":"Mạng phẳng cho phép một máy trạm bị nhiễm mã độc tiếp cận toàn bộ máy chủ.","e":"Vùng máy chủ CSDL chỉ nhận kết nối từ vùng máy chủ ứng dụng qua đúng cổng CSDL."},{"n":"IDS và IPS","d":"IDS phát hiện và cảnh báo hành vi xâm nhập; IPS phát hiện và chặn tự động.","k":"Phát hiện dựa trên chữ ký (mẫu đã biết) và dựa trên bất thường (lệch khỏi hành vi bình thường).","c":"IPS chặn nhầm lưu lượng hợp lệ có thể gây gián đoạn dịch vụ; cần giai đoạn chạy chế độ giám sát trước.","e":"Bật IPS ở chế độ chỉ phát hiện 2 tuần, tinh chỉnh luật rồi mới chuyển sang chế độ chặn."},{"n":"VPN","d":"Kênh kết nối mã hóa qua mạng công cộng, cho kết nối giữa các địa điểm hoặc truy cập từ xa.","k":"Dùng giao thức và thuật toán mạnh, xác thực đa yếu tố cho người dùng; giám sát phiên truy cập.","c":"Thiết bị VPN là mục tiêu tấn công phổ biến; lỗ hổng trên thiết bị VPN cần được vá khẩn cấp.","e":"Cổng VPN được vá trong 48 giờ khi có lỗ hổng nghiêm trọng và yêu cầu MFA cho mọi người dùng."},{"n":"Bảo vệ trước DDoS","d":"Các biện pháp duy trì dịch vụ khi bị tấn công từ chối dịch vụ phân tán, làm quá tải băng thông hoặc tài nguyên.","k":"Kết hợp dịch vụ lọc của nhà mạng hoặc nhà cung cấp chuyên dụng, CDN, giới hạn tần suất và khả năng mở rộng.","c":"Chỉ bảo vệ tầng mạng mà bỏ qua tấn công tầng ứng dụng, như gửi hàng loạt yêu cầu hợp lệ tới API nặng.","e":"Hợp đồng dịch vụ chống DDoS với nhà cung cấp và kịch bản ứng phó khi cổng ngân hàng điện tử bị tấn công."},{"n":"Bảo mật mạng không dây","d":"Bảo vệ mạng Wi-Fi và thiết bị không dây khỏi truy cập trái phép và nghe lén.","k":"Dùng WPA3 hoặc WPA2-Enterprise với xác thực 802.1X; phát hiện điểm truy cập giả mạo.","c":"Mật khẩu Wi-Fi dùng chung cho mọi nhân viên không thu hồi được khi nhân viên nghỉ việc.","e":"Wi-Fi nhân viên xác thực bằng tài khoản cá nhân qua 802.1X; Wi-Fi khách tách biệt hoàn toàn."}]},{"id":"appsec","title":"Bảo mật ứng dụng","summary":"Tích hợp bảo mật vào thiết kế, lập trình và kiểm thử phần mềm.","points":["OWASP Top 10:2025 liệt kê các nhóm rủi ro phổ biến của ứng dụng web, trong đó có nhóm mới về lỗi chuỗi cung ứng phần mềm.","Mọi dữ liệu đầu vào phải được kiểm tra ở phía máy chủ.","DevSecOps đưa kiểm tra bảo mật tự động vào pipeline."],"children":["OWASP Top 10:2025","Lập trình an toàn","SAST và DAST","Chuỗi cung ứng phần mềm và thư viện phụ thuộc","Bảo mật API","DevSecOps"],"sub":[{"n":"OWASP Top 10:2025","d":"Tài liệu nhận thức về 10 nhóm rủi ro nghiêm trọng nhất của ứng dụng web, phiên bản 2025 là bản hiện hành.","k":"Kiểm soát truy cập bị phá vỡ vẫn đứng đầu; bản 2025 bổ sung lỗi chuỗi cung ứng phần mềm và xử lý sai điều kiện ngoại lệ.","c":"Top 10 là điểm khởi đầu nâng cao nhận thức, không phải bộ kiểm soát đầy đủ; dùng OWASP ASVS để kiểm chứng chi tiết.","e":"Dùng Top 10:2025 làm nội dung đào tạo bảo mật bắt buộc cho lập trình viên mới."},{"n":"Lập trình an toàn","d":"Thực hành viết mã tránh tạo lỗ hổng bảo mật.","k":"Kiểm tra và làm sạch đầu vào, dùng truy vấn tham số hóa, mã hóa đầu ra, xử lý lỗi không lộ thông tin, quản lý bí mật an toàn.","c":"Kiểm tra dữ liệu chỉ ở phía trình duyệt là không đủ vì có thể bị bỏ qua dễ dàng.","e":"Mọi truy vấn CSDL dùng tham số hóa; không nối chuỗi dữ liệu người dùng vào câu SQL."},{"n":"SAST và DAST","d":"SAST phân tích mã nguồn khi chưa chạy; DAST kiểm thử ứng dụng đang chạy từ bên ngoài.","k":"SAST phát hiện sớm trong pipeline; DAST phát hiện lỗi cấu hình và lỗi chỉ lộ ra khi chạy; hai cách bổ sung cho nhau.","c":"Tỷ lệ cảnh báo sai cao nếu không tinh chỉnh; cần phân loại và theo dõi xử lý.","e":"SAST chạy mỗi pull request; DAST chạy hằng tuần trên môi trường UAT."},{"n":"Chuỗi cung ứng phần mềm và thư viện phụ thuộc","d":"Rủi ro từ thư viện, công cụ và thành phần bên thứ ba được đưa vào phần mềm.","k":"Duy trì danh mục thành phần phần mềm (SBOM), quét lỗ hổng thư viện (SCA), dùng nguồn tin cậy và ký số bản phát hành.","c":"Thư viện phụ thuộc gián tiếp chiếm phần lớn mã và thường không được theo dõi.","e":"Pipeline chặn build khi phát hiện thư viện có lỗ hổng nghiêm trọng đã có bản sửa."},{"n":"Bảo mật API","d":"Bảo vệ giao diện lập trình ứng dụng khỏi truy cập trái phép và lạm dụng.","k":"Xác thực và phân quyền ở cấp từng đối tượng, giới hạn tần suất, kiểm tra đầu vào, không trả dữ liệu thừa; tham khảo OWASP API Security Top 10.","c":"Lỗi phân quyền cấp đối tượng: người dùng đổi mã định danh trên URL để xem dữ liệu của người khác.","e":"API sao kê kiểm tra tài khoản được yêu cầu thuộc về đúng khách hàng đang đăng nhập."},{"n":"DevSecOps","d":"Tích hợp bảo mật vào mọi giai đoạn của vòng đời phát triển và vận hành, tự động hóa trong pipeline.","k":"Đưa bảo mật sớm (shift left): mô hình hóa mối đe dọa khi thiết kế, SAST, SCA, quét container, quét IaC trong CI.","c":"Thêm công cụ quét mà không có quy trình xử lý kết quả chỉ tạo thêm cảnh báo bị bỏ qua.","e":"Mỗi nhóm có một thành viên phụ trách bảo mật (security champion) phối hợp với đội an ninh thông tin."}]},{"id":"iam","title":"Quản lý định danh và truy cập (IAM)","summary":"Bảo đảm đúng người được truy cập đúng tài nguyên vào đúng thời điểm.","points":["Xác thực (authentication) khác với phân quyền (authorization).","Xác thực đa yếu tố (MFA) giảm mạnh rủi ro chiếm đoạt tài khoản.","Quản lý tài khoản đặc quyền (PAM) và rà soát quyền định kỳ là kiểm soát then chốt."],"children":["Xác thực","Phân quyền RBAC và ABAC","MFA","SSO và liên kết định danh","PAM","Rà soát quyền truy cập"],"sub":[{"n":"Xác thực","d":"Quá trình xác minh danh tính người dùng hoặc hệ thống là đúng như họ tuyên bố.","k":"Các yếu tố: điều bạn biết, điều bạn có, đặc điểm của bạn; xu hướng chuyển sang xác thực không mật khẩu (passkey).","c":"Mật khẩu yếu, dùng lại mật khẩu và lưu mật khẩu không an toàn là nguyên nhân phổ biến của xâm nhập.","e":"Đăng nhập hệ thống nội bộ qua SSO với mật khẩu kết hợp xác thực trên ứng dụng di động."},{"n":"Phân quyền RBAC và ABAC","d":"Xác định người dùng đã xác thực được làm gì. RBAC phân quyền theo vai trò; ABAC theo thuộc tính người dùng, tài nguyên và ngữ cảnh.","k":"RBAC dễ quản lý với vai trò ổn định; ABAC linh hoạt cho quy tắc phức tạp như theo chi nhánh, hạn mức, thời gian.","c":"Bùng nổ vai trò (role explosion) khi tạo vai trò riêng cho từng ngoại lệ.","e":"Giao dịch viên chỉ duyệt giao dịch dưới hạn mức và thuộc chi nhánh của mình, quy tắc dạng ABAC."},{"n":"MFA","d":"Xác thực đa yếu tố yêu cầu ít nhất hai yếu tố thuộc các nhóm khác nhau.","k":"Giảm mạnh rủi ro chiếm đoạt tài khoản; ưu tiên phương thức chống lừa đảo như FIDO2 hơn SMS OTP.","c":"Tấn công gửi yêu cầu xác nhận liên tục (MFA fatigue) khiến người dùng bấm đồng ý cho xong.","e":"Bắt buộc MFA cho truy cập từ xa, tài khoản quản trị và mọi ứng dụng chứa dữ liệu khách hàng."},{"n":"SSO và liên kết định danh","d":"SSO cho phép đăng nhập một lần để truy cập nhiều ứng dụng; liên kết định danh chia sẻ danh tính giữa các tổ chức qua chuẩn SAML, OpenID Connect.","k":"Giảm số mật khẩu người dùng phải nhớ, tập trung kiểm soát và thu hồi quyền.","c":"Tài khoản SSO bị chiếm đồng nghĩa với truy cập mọi ứng dụng liên kết; MFA là bắt buộc.","e":"Nhân viên nghỉ việc bị khóa tài khoản trên hệ thống định danh, mất quyền mọi ứng dụng cùng lúc."},{"n":"PAM","d":"Quản lý truy cập đặc quyền: kiểm soát, giám sát và ghi lại việc sử dụng tài khoản quản trị.","k":"Kho mật khẩu đặc quyền, cấp quyền đúng lúc (just-in-time), ghi hình phiên làm việc, luân chuyển mật khẩu tự động.","c":"Tài khoản quản trị dùng chung không xác định được ai đã thực hiện thao tác.","e":"Quản trị viên CSDL mượn quyền qua hệ thống PAM có phê duyệt, phiên làm việc được ghi lại để kiểm tra."},{"n":"Rà soát quyền truy cập","d":"Định kỳ rà soát và xác nhận quyền truy cập của người dùng còn phù hợp với công việc.","k":"Quản lý trực tiếp và chủ sở hữu ứng dụng xác nhận; thu hồi quyền không còn cần thiết.","c":"Người rà soát bấm xác nhận hàng loạt mà không xem xét làm quy trình mất tác dụng.","e":"Rà soát quyền hệ thống lõi hằng quý; quyền không được xác nhận sẽ tự động bị thu hồi."}]},{"id":"crypto","title":"Mật mã học ứng dụng","summary":"Kỹ thuật toán học bảo vệ tính bí mật, toàn vẹn và xác thực của dữ liệu.","points":["Mã hóa đối xứng nhanh; mã hóa bất đối xứng giải quyết trao đổi khóa và chữ ký số.","Hàm băm bảo đảm toàn vẹn; mật khẩu cần băm có salt bằng thuật toán chậm chuyên dụng.","Quản lý khóa thường là điểm yếu hơn cả bản thân thuật toán."],"children":["Mã hóa đối xứng","Mã hóa bất đối xứng","Hàm băm","Chữ ký số","PKI và chứng thư số","Quản lý khóa và HSM","Mật mã hậu lượng tử"],"sub":[{"n":"Mã hóa đối xứng","d":"Dùng cùng một khóa để mã hóa và giải mã, tốc độ nhanh, phù hợp dữ liệu lớn.","k":"AES là chuẩn phổ biến; nên dùng chế độ có xác thực như AES-GCM.","c":"Vấn đề chính là phân phối và bảo vệ khóa; khóa lộ thì mọi dữ liệu bị lộ.","e":"Mã hóa dữ liệu lưu trữ trên đĩa máy chủ CSDL bằng AES-256."},{"n":"Mã hóa bất đối xứng","d":"Dùng cặp khóa công khai và bí mật; mã hóa bằng khóa công khai, chỉ khóa bí mật tương ứng giải mã được.","k":"RSA và ECC là thuật toán phổ biến; dùng cho trao đổi khóa và chữ ký số, chậm hơn mã hóa đối xứng.","c":"Độ dài khóa không đủ (như RSA 1024 bit) không còn an toàn.","e":"TLS dùng mã hóa bất đối xứng để thỏa thuận khóa phiên, sau đó mã hóa dữ liệu bằng khóa đối xứng."},{"n":"Hàm băm","d":"Hàm một chiều tạo giá trị độ dài cố định từ dữ liệu bất kỳ, dùng kiểm tra toàn vẹn.","k":"SHA-256 và SHA-3 là chuẩn hiện hành; mật khẩu cần hàm chuyên dụng chậm có salt như Argon2, bcrypt.","c":"MD5 và SHA-1 đã bị phá về tính kháng va chạm, không dùng cho mục đích bảo mật.","e":"Lưu giá trị băm SHA-256 của file đối soát để phát hiện file bị sửa khi truyền."},{"n":"Chữ ký số","d":"Cơ chế dùng khóa bí mật để ký dữ liệu, bất kỳ ai có khóa công khai đều kiểm tra được.","k":"Bảo đảm toàn vẹn, xác thực nguồn gốc và chống chối bỏ; có giá trị pháp lý khi dùng chữ ký số hợp lệ theo quy định.","c":"Khóa bí mật bị lộ thì kẻ gian ký thay được; cần lưu trong thiết bị bảo mật.","e":"Hợp đồng điện tử được ký bằng chữ ký số của khách hàng và của ngân hàng."},{"n":"PKI và chứng thư số","d":"Hạ tầng khóa công khai: hệ thống cấp, quản lý và thu hồi chứng thư số gắn khóa công khai với danh tính.","k":"Tổ chức chứng thực (CA) ký chứng thư; chuỗi tin cậy từ CA gốc; danh sách thu hồi (CRL) và OCSP.","c":"Chứng thư hết hạn không được theo dõi gây gián đoạn dịch vụ đột ngột.","e":"Hệ thống theo dõi ngày hết hạn của mọi chứng thư TLS và cảnh báo trước 30 ngày."},{"n":"Quản lý khóa và HSM","d":"Quản lý vòng đời khóa mật mã: tạo, lưu trữ, phân phối, luân chuyển, thu hồi, hủy. HSM là thiết bị phần cứng chuyên dụng bảo vệ khóa.","k":"Khóa quan trọng không bao giờ rời HSM dưới dạng rõ; tách quyền giữa người quản lý khóa và người vận hành.","c":"Lưu khóa trong mã nguồn hoặc file cấu hình là lỗi nghiêm trọng và phổ biến.","e":"Khóa ký giao dịch thẻ và khóa mã hóa PIN được lưu và sử dụng bên trong HSM."},{"n":"Mật mã hậu lượng tử","d":"Thuật toán mật mã được thiết kế để an toàn trước máy tính lượng tử trong tương lai.","k":"NIST đã công bố các chuẩn đầu tiên năm 2024 (ML-KEM, ML-DSA, SLH-DSA); tổ chức cần kiểm kê mật mã và lập lộ trình chuyển đổi.","c":"Rủi ro ‘thu thập bây giờ, giải mã sau’ đe dọa dữ liệu cần giữ bí mật trong nhiều năm.","e":"Lập danh mục hệ thống dùng RSA và ECC, ưu tiên chuyển đổi cho dữ liệu cần bảo mật dài hạn."}]},{"id":"soc","title":"Giám sát và ứng cứu sự cố","summary":"Phát hiện, phân tích và phản ứng với sự cố an ninh.","points":["SOC giám sát tập trung bằng SIEM và nhiều nguồn log.","Quy trình ứng cứu: chuẩn bị, phát hiện, ngăn chặn, loại bỏ, khôi phục và rút kinh nghiệm.","MITRE ATT&CK giúp ánh xạ hành vi của đối thủ với biện pháp phát hiện."],"children":["Trung tâm điều hành an ninh (SOC)","SIEM","EDR và XDR","Quy trình ứng cứu sự cố","Threat intelligence","MITRE ATT&CK"],"sub":[{"n":"Trung tâm điều hành an ninh (SOC)","d":"Trung tâm điều hành an ninh: đội ngũ, quy trình và công nghệ giám sát, phát hiện và ứng phó sự cố an ninh liên tục.","k":"Phân tầng phân tích viên L1 (sàng lọc), L2 (điều tra), L3 (chuyên sâu, săn mối đe dọa); vận hành 24/7.","c":"SOC chỉ xử lý cảnh báo mà không cải tiến quy tắc phát hiện sẽ quá tải và bỏ sót.","e":"SOC nội bộ phối hợp với dịch vụ giám sát bên ngoài để bảo đảm giám sát 24/7."},{"n":"SIEM","d":"Hệ thống thu thập, chuẩn hóa, tương quan và phân tích log từ nhiều nguồn để phát hiện sự cố.","k":"Giá trị phụ thuộc vào nguồn log đầy đủ và quy tắc tương quan tốt; lưu log đủ thời gian cho điều tra và quy định.","c":"Thu thập mọi log mà không có mục tiêu phát hiện làm chi phí tăng mạnh mà hiệu quả thấp.","e":"Quy tắc cảnh báo khi một tài khoản đặc quyền đăng nhập ngoài giờ từ máy không đăng ký."},{"n":"EDR và XDR","d":"EDR giám sát và phản ứng trên điểm cuối; XDR mở rộng sang email, mạng, cloud, định danh với phân tích tập trung.","k":"Phát hiện hành vi bất thường thay vì chỉ dựa vào chữ ký; cô lập máy từ xa khi cần.","c":"EDR không được triển khai đủ trên mọi máy tạo điểm mù cho kẻ tấn công.","e":"EDR phát hiện tiến trình mã hóa hàng loạt tệp và tự động cô lập máy khỏi mạng."},{"n":"Quy trình ứng cứu sự cố","d":"Quy trình xử lý sự cố an ninh theo các bước: chuẩn bị, phát hiện và phân tích, ngăn chặn, loại bỏ, khôi phục, rút kinh nghiệm.","k":"Có kịch bản (playbook) cho các loại sự cố phổ biến; vai trò và kênh liên lạc rõ ràng; nghĩa vụ báo cáo cơ quan chức năng.","c":"Xóa dấu vết hoặc cài lại máy quá sớm làm mất bằng chứng cần cho điều tra.","e":"Playbook mã độc tống tiền quy định cô lập, thông báo lãnh đạo, liên hệ cơ quan chức năng và khôi phục từ bản sao lưu bất biến."},{"n":"Threat intelligence","d":"Thông tin về mối đe dọa, tác nhân, kỹ thuật và dấu hiệu nhận biết giúp tổ chức phòng thủ chủ động.","k":"Các cấp: chiến lược (xu hướng), chiến thuật (kỹ thuật tấn công), vận hành (chiến dịch), kỹ thuật (chỉ số như IP, hash).","c":"Nạp danh sách chỉ số xâm phạm mà không lọc theo bối cảnh tạo nhiều cảnh báo sai.","e":"Nhận thông tin từ cộng đồng chia sẻ ngành tài chính về chiến dịch lừa đảo đang nhắm vào khách hàng ngân hàng."},{"n":"MITRE ATT&CK","d":"Cơ sở tri thức mở về chiến thuật và kỹ thuật của kẻ tấn công dựa trên quan sát thực tế.","k":"Dùng để đánh giá mức bao phủ phát hiện, thiết kế diễn tập và chia sẻ thông tin bằng ngôn ngữ chung.","c":"Cố gắng bao phủ mọi kỹ thuật cùng lúc; nên ưu tiên theo mối đe dọa thực tế với ngành.","e":"Ánh xạ quy tắc phát hiện hiện có lên ma trận ATT&CK để tìm các kỹ thuật chưa có khả năng phát hiện."}]},{"id":"threat","title":"Mô hình hóa mối đe dọa và quản lý lỗ hổng","summary":"Chủ động nhận diện điểm yếu trước khi bị khai thác.","points":["STRIDE phân loại mối đe dọa thành sáu nhóm khi thiết kế hệ thống.","Quản lý lỗ hổng gồm phát hiện, đánh giá mức độ, vá và xác minh.","Kiểm thử xâm nhập chỉ được thực hiện khi có ủy quyền bằng văn bản và phạm vi rõ ràng."],"children":["STRIDE","Quản lý lỗ hổng","CVSS","Quản lý bản vá","Kiểm thử xâm nhập có ủy quyền"],"sub":[{"n":"STRIDE","d":"Phương pháp mô hình hóa mối đe dọa của Microsoft theo sáu nhóm: giả mạo, sửa đổi, chối bỏ, lộ thông tin, từ chối dịch vụ, leo thang đặc quyền.","k":"Áp dụng trên sơ đồ luồng dữ liệu ở giai đoạn thiết kế; mỗi mối đe dọa có biện pháp giảm thiểu.","c":"Làm một lần khi thiết kế rồi không cập nhật khi kiến trúc thay đổi.","e":"Mô hình hóa mối đe dọa cho API chuyển tiền phát hiện cần ký yêu cầu để chống sửa đổi số tiền."},{"n":"Quản lý lỗ hổng","d":"Quy trình liên tục phát hiện, đánh giá, ưu tiên, khắc phục và xác minh lỗ hổng.","k":"Quét định kỳ, ưu tiên theo mức nghiêm trọng, mức phơi nhiễm và thông tin lỗ hổng đang bị khai thác.","c":"Chỉ đo số lỗ hổng đã phát hiện mà không đo thời gian khắc phục.","e":"Lỗ hổng nghiêm trọng trên hệ thống hướng Internet phải khắc phục trong 7 ngày, hệ thống nội bộ trong 30 ngày."},{"n":"CVSS","d":"Hệ thống chấm điểm mức độ nghiêm trọng của lỗ hổng từ 0 đến 10; phiên bản hiện hành là CVSS v4.0.","k":"Điểm cơ sở phản ánh đặc tính lỗ hổng; cần bổ sung bối cảnh môi trường và thông tin khai thác thực tế.","c":"Chỉ dựa vào điểm cơ sở để ưu tiên dẫn đến vá nhiều lỗ hổng ít rủi ro trước lỗ hổng đang bị khai thác.","e":"Kết hợp CVSS với danh mục lỗ hổng đang bị khai thác để quyết định thứ tự vá."},{"n":"Quản lý bản vá","d":"Quy trình thử nghiệm, phê duyệt và triển khai bản vá phần mềm, hệ điều hành, thiết bị.","k":"Lịch vá định kỳ, quy trình vá khẩn cấp, thử nghiệm trên môi trường kiểm thử, theo dõi tỷ lệ tuân thủ.","c":"Hệ thống cũ không còn bản vá cần biện pháp bù như cô lập mạng và giám sát tăng cường.","e":"Vá hệ điều hành máy trạm hằng tháng theo đợt, nhóm thí điểm trước, toàn bộ sau 1 tuần."},{"n":"Kiểm thử xâm nhập có ủy quyền","d":"Đánh giá bảo mật bằng cách mô phỏng tấn công thực tế trong phạm vi và thời gian đã được ủy quyền bằng văn bản.","k":"Phạm vi, quy tắc tham gia, đầu mối liên lạc khẩn cấp được thống nhất trước; kết quả là báo cáo lỗ hổng kèm khuyến nghị khắc phục.","c":"Kiểm thử không có ủy quyền là vi phạm pháp luật dù với mục đích tốt; kết quả cần được kiểm tra lại sau khắc phục.","e":"Thuê đơn vị độc lập kiểm thử ứng dụng ngân hàng di động trước khi phát hành phiên bản lớn."}]},{"id":"grc","title":"Quản trị, rủi ro và tuân thủ (GRC)","summary":"Khung quản lý an ninh thông tin gắn với rủi ro kinh doanh và quy định.","points":["ISO/IEC 27001 là chuẩn hệ thống quản lý an toàn thông tin có thể được chứng nhận.","NIST CSF 2.0 tổ chức hoạt động theo sáu chức năng, trong đó bổ sung chức năng Govern.","Ngành thẻ tuân thủ PCI DSS; ngân hàng Việt Nam tuân thủ quy định an toàn hệ thống thông tin của Ngân hàng Nhà nước."],"children":["ISO/IEC 27001","NIST CSF 2.0","PCI DSS","Đánh giá rủi ro","Chính sách an ninh","Quản lý rủi ro bên thứ ba"],"sub":[{"n":"ISO/IEC 27001","d":"Tiêu chuẩn quốc tế về hệ thống quản lý an toàn thông tin (ISMS), có thể chứng nhận.","k":"Bản 2022 có 93 biện pháp kiểm soát trong Phụ lục A, chia bốn nhóm: tổ chức, con người, vật lý, công nghệ; Tuyên bố áp dụng (SoA) giải thích lựa chọn.","c":"Phạm vi chứng nhận quá hẹp tạo cảm giác an toàn giả cho toàn tổ chức.","e":"Tổ chức xác định phạm vi ISMS gồm trung tâm dữ liệu và các hệ thống xử lý dữ liệu khách hàng."},{"n":"NIST CSF 2.0","d":"Khung an ninh mạng của NIST phiên bản 2.0 năm 2024, gồm sáu chức năng: Govern, Identify, Protect, Detect, Respond, Recover.","k":"Dùng Profile hiện trạng và mục tiêu để lập lộ trình cải thiện; áp dụng cho mọi quy mô tổ chức.","c":"Khung không phải danh sách kiểm soát bắt buộc; cần ánh xạ sang biện pháp cụ thể.","e":"Đánh giá hiện trạng theo CSF 2.0, xác định khoảng cách lớn nhất ở chức năng Detect và lập kế hoạch 2 năm."},{"n":"PCI DSS","d":"Tiêu chuẩn bảo mật dữ liệu ngành thẻ thanh toán do PCI SSC ban hành, áp dụng cho tổ chức lưu trữ, xử lý, truyền dữ liệu chủ thẻ.","k":"Phiên bản 4.0.1 là bản hiện hành; 12 yêu cầu chính; giảm phạm vi bằng phân vùng và mã hóa thay thế (tokenization).","c":"Phạm vi không được xác định chặt khiến nhiều hệ thống vô tình nằm trong phạm vi đánh giá.","e":"Thay số thẻ bằng token trong hệ thống CRM để loại hệ thống này khỏi phạm vi PCI DSS."},{"n":"Đánh giá rủi ro","d":"Quy trình nhận diện, phân tích và đánh giá rủi ro an ninh thông tin đối với tài sản của tổ chức.","k":"Phương pháp định tính hoặc định lượng; gắn với khẩu vị rủi ro; kết quả là kế hoạch xử lý rủi ro.","c":"Đánh giá rủi ro một lần mỗi năm cho kịp kiểm toán không theo kịp thay đổi của hệ thống.","e":"Đánh giá rủi ro trước khi đưa ứng dụng mới lên cloud, xác định biện pháp bổ sung trước khi phê duyệt."},{"n":"Chính sách an ninh","d":"Bộ văn bản định hướng và quy định về an ninh thông tin: chính sách cấp cao, tiêu chuẩn, quy trình, hướng dẫn.","k":"Chính sách được lãnh đạo phê duyệt, phổ biến tới nhân viên và rà soát định kỳ.","c":"Chính sách sao chép từ mẫu mà không phù hợp thực tế sẽ không được tuân thủ.","e":"Chính sách sử dụng AI tạo sinh quy định loại dữ liệu không được đưa vào công cụ bên ngoài."},{"n":"Quản lý rủi ro bên thứ ba","d":"Đánh giá và giám sát rủi ro an ninh từ nhà cung cấp, đối tác có truy cập dữ liệu hoặc hệ thống.","k":"Đánh giá trước khi ký hợp đồng, điều khoản bảo mật trong hợp đồng, đánh giá định kỳ, kế hoạch chấm dứt.","c":"Nhà cung cấp của nhà cung cấp (bên thứ tư) thường nằm ngoài tầm kiểm soát và tầm nhìn.","e":"Nhà cung cấp dịch vụ tổng đài phải đáp ứng bảng câu hỏi bảo mật và cho phép đánh giá tại chỗ hằng năm."}]},{"id":"awareness","title":"Yếu tố con người và nhận thức","summary":"Con người vừa là mục tiêu phổ biến nhất vừa là tuyến phòng thủ quan trọng.","points":["Lừa đảo (phishing) và kỹ nghệ xã hội là con đường tấn công phổ biến.","Đào tạo và diễn tập định kỳ hiệu quả hơn đào tạo một lần.","Văn hóa báo cáo sớm, không đổ lỗi giúp phát hiện sự cố nhanh hơn."],"children":["Phishing","Kỹ nghệ xã hội","Đào tạo nhận thức","Diễn tập","Văn hóa an ninh"],"sub":[{"n":"Phishing","d":"Lừa đảo giả mạo nguồn tin cậy qua email, tin nhắn, cuộc gọi để đánh cắp thông tin hoặc cài mã độc.","k":"Dấu hiệu: yêu cầu khẩn cấp, người gửi lạ hoặc giả mạo, đường link hoặc tệp đính kèm bất thường; biến thể nhắm mục tiêu (spear phishing).","c":"AI tạo sinh làm email lừa đảo trôi chảy hơn, lỗi chính tả không còn là dấu hiệu đáng tin cậy.","e":"Email giả danh giám đốc yêu cầu chuyển tiền gấp cho đối tác mới; quy trình yêu cầu xác minh qua kênh khác."},{"n":"Kỹ nghệ xã hội","d":"Kỹ thuật thao túng tâm lý con người để lấy thông tin hoặc quyền truy cập.","k":"Khai thác sự tin tưởng, sợ hãi, khẩn cấp, muốn giúp đỡ; qua điện thoại, gặp trực tiếp, mạng xã hội.","c":"Quy trình cho phép ngoại lệ khi ‘cấp trên yêu cầu gấp’ là điểm yếu bị khai thác nhiều nhất.","e":"Kẻ gian gọi điện giả làm nhân viên hỗ trợ CNTT yêu cầu đọc mã OTP để ‘sửa lỗi tài khoản’."},{"n":"Đào tạo nhận thức","d":"Chương trình giúp nhân viên hiểu rủi ro và hành xử an toàn.","k":"Ngắn, thường xuyên, gắn với vai trò và tình huống thực tế; đo hiệu quả bằng hành vi, không chỉ bằng tỷ lệ hoàn thành khóa học.","c":"Đào tạo một lần mỗi năm với nội dung chung chung ít thay đổi được hành vi.","e":"Bài học 5 phút hằng tháng về một chủ đề, kèm ví dụ lừa đảo thực tế vừa phát hiện."},{"n":"Diễn tập","d":"Mô phỏng tình huống an ninh để kiểm tra phản ứng của con người và quy trình.","k":"Mô phỏng phishing, diễn tập ứng cứu sự cố trên bàn (tabletop) với lãnh đạo, diễn tập kỹ thuật.","c":"Dùng kết quả mô phỏng phishing để phạt người bấm link làm giảm tinh thần báo cáo.","e":"Mô phỏng phishing hằng quý, người bấm link được hướng dẫn ngay; đo tỷ lệ báo cáo email đáng ngờ."},{"n":"Văn hóa an ninh","d":"Giá trị và thói quen chung khiến hành vi an toàn trở thành điều tự nhiên trong tổ chức.","k":"Lãnh đạo làm gương, báo cáo sự cố không bị đổ lỗi, bảo mật được xem là trách nhiệm của mọi người.","c":"Coi an ninh là việc riêng của bộ phận an ninh thông tin khiến nhân viên thụ động.","e":"Nút báo cáo email đáng ngờ trên phần mềm thư, người báo cáo nhận phản hồi cảm ơn và kết quả xử lý."}]},{"id":"cloudsec","title":"Bảo mật cloud và công nghệ vận hành (OT)","summary":"Bảo mật cho môi trường đám mây và hệ thống điều khiển công nghiệp.","points":["Cấu hình sai là nguyên nhân hàng đầu của sự cố trên cloud.","CSPM giám sát cấu hình cloud một cách liên tục.","Hệ thống OT/ICS ưu tiên tính sẵn sàng và an toàn vật lý, khó vá như IT thông thường."],"children":["Cấu hình an toàn cloud","CSPM","Bảo mật container","Bảo mật OT/ICS","IEC 62443"],"sub":[{"n":"Cấu hình an toàn cloud","d":"Thiết lập tài nguyên cloud theo cấu hình chuẩn an toàn: phân quyền, mạng, mã hóa, ghi log.","k":"Dùng chuẩn tham chiếu như CIS Benchmarks; quản lý cấu hình bằng IaC và kiểm tra trước khi triển khai.","c":"Kho lưu trữ công khai, khóa truy cập lâu dài và quyền quản trị rộng là lỗi cấu hình phổ biến nhất.","e":"Chính sách tổ chức chặn tạo kho lưu trữ công khai và bắt buộc mã hóa trên mọi tài khoản cloud."},{"n":"CSPM","d":"Công cụ quản lý tư thế bảo mật cloud: liên tục đánh giá cấu hình so với chuẩn và phát hiện lệch.","k":"Bao quát nhiều tài khoản và nhiều nhà cung cấp; thường nằm trong nền tảng CNAPP rộng hơn.","c":"Phát hiện mà không có quy trình và người chịu trách nhiệm khắc phục thì danh sách lỗi chỉ ngày càng dài.","e":"CSPM cảnh báo trong vài phút khi có máy ảo mở cổng quản trị ra Internet."},{"n":"Bảo mật container","d":"Bảo vệ image, registry, runtime và nền tảng điều phối container như Kubernetes.","k":"Quét lỗ hổng image, dùng image tối giản, không chạy với quyền root, chính sách mạng giữa các pod, quản lý bí mật an toàn.","c":"Image cơ sở lấy từ nguồn không tin cậy có thể chứa mã độc hoặc lỗ hổng.","e":"Registry nội bộ chỉ cho phép image đã quét và ký; cụm Kubernetes từ chối image chưa được ký."},{"n":"Bảo mật OT/ICS","d":"Bảo mật hệ thống công nghệ vận hành và điều khiển công nghiệp như SCADA, PLC, DCS.","k":"Ưu tiên sẵn sàng và an toàn vật lý; phân vùng tách biệt với mạng IT; giám sát thụ động để không ảnh hưởng vận hành.","c":"Áp dụng máy móc quy trình vá và quét của IT có thể làm dừng dây chuyền sản xuất.","e":"Mạng điều khiển tòa nhà trung tâm dữ liệu (điện, làm mát) được tách biệt khỏi mạng văn phòng."},{"n":"IEC 62443","d":"Bộ tiêu chuẩn quốc tế về an ninh cho hệ thống tự động hóa và điều khiển công nghiệp.","k":"Mô hình vùng và kênh dẫn (zones and conduits); mức an ninh SL 1 đến 4; phân vai trò chủ sở hữu, nhà tích hợp, nhà sản xuất thiết bị.","c":"Cần sự phối hợp giữa kỹ sư vận hành và đội an ninh vì hai bên có ưu tiên khác nhau.","e":"Phân vùng nhà máy theo IEC 62443, xác định mức an ninh mục tiêu cho từng vùng và kênh kết nối."}]}],"concepts":[{"term":"Tam giác CIA","def":"Ba mục tiêu của an ninh: bảo mật (Confidentiality), toàn vẹn (Integrity) và sẵn sàng (Availability).","ex":"Mã hóa sao kê (bảo mật), chống sửa số tiền giao dịch (toàn vẹn), chống DDoS (sẵn sàng).","mis":"Bảo mật chỉ là giữ bí mật. Mất toàn vẹn hoặc mất sẵn sàng cũng là sự cố an ninh."},{"term":"Rủi ro (Risk)","def":"Khả năng một mối đe dọa khai thác lỗ hổng và gây tác động lên tài sản.","ex":"Máy chủ chưa vá (lỗ hổng) bị mã độc tống tiền (mối đe dọa) làm gián đoạn dịch vụ (tác động).","mis":"Phải loại bỏ mọi rủi ro. Mục tiêu là đưa rủi ro về mức chấp nhận được theo khẩu vị rủi ro."},{"term":"Zero Trust","def":"Mô hình không mặc định tin cậy người dùng, thiết bị hay vị trí mạng nào; mọi truy cập đều được xác minh.","ex":"Nhân viên trong mạng nội bộ vẫn phải xác thực MFA và kiểm tra thiết bị khi vào hệ thống nhạy cảm.","mis":"Zero Trust là một sản phẩm mua được. Đó là chiến lược kiến trúc được triển khai dần."},{"term":"Đặc quyền tối thiểu (Least privilege)","def":"Chỉ cấp quyền vừa đủ để thực hiện công việc.","ex":"Chuyên viên báo cáo chỉ có quyền đọc, không có quyền sửa dữ liệu.","mis":"Cấp rộng cho tiện rồi thu hồi sau. Quyền dư thừa hiếm khi được thu hồi."},{"term":"Xác thực đa yếu tố (MFA)","def":"Yêu cầu từ hai yếu tố thuộc các nhóm khác nhau: điều bạn biết, điều bạn có, đặc điểm của bạn.","ex":"Mật khẩu kết hợp mã từ ứng dụng xác thực trên điện thoại.","mis":"Hai mật khẩu là MFA. Hai yếu tố cùng nhóm không phải là đa yếu tố."},{"term":"Hàm băm (Hash function)","def":"Hàm một chiều biến dữ liệu thành giá trị có độ dài cố định; thay đổi nhỏ ở đầu vào làm đầu ra thay đổi lớn.","ex":"Kiểm tra tệp tải về không bị sửa bằng giá trị SHA-256.","mis":"Băm là mã hóa. Băm không có khóa để giải ngược."},{"term":"Phishing","def":"Hình thức lừa đảo giả mạo nguồn tin cậy để dụ người dùng tiết lộ thông tin hoặc thực hiện hành động.","ex":"Email giả danh bộ phận CNTT yêu cầu đăng nhập qua một đường link lạ.","mis":"Chỉ người thiếu hiểu biết mới bị lừa. Tấn công nhắm mục tiêu tinh vi có thể đánh lừa cả chuyên gia."},{"term":"SIEM","def":"Hệ thống thu thập, tương quan và phân tích log từ nhiều nguồn để phát hiện sự cố.","ex":"Cảnh báo khi một tài khoản đăng nhập thất bại nhiều lần rồi thành công từ vị trí bất thường.","mis":"Triển khai SIEM là đã có năng lực phát hiện. Cần quy tắc phát hiện tốt và người phân tích."},{"term":"CVSS","def":"Hệ thống chấm điểm mức độ nghiêm trọng của lỗ hổng trên thang từ 0 đến 10.","ex":"Lỗ hổng điểm 9,8 được ưu tiên vá khẩn cấp.","mis":"Chỉ dựa vào điểm CVSS để ưu tiên. Cần xét mức phơi nhiễm và giá trị tài sản thực tế."},{"term":"Phòng thủ nhiều lớp (Defense in depth)","def":"Kết hợp nhiều lớp kiểm soát độc lập để khi một lớp thất bại, hệ thống vẫn chưa mất an toàn.","ex":"Tường lửa, MFA, EDR, mã hóa và sao lưu cùng bảo vệ một hệ thống.","mis":"Càng nhiều lớp càng tốt. Các lớp phải được quản lý, nếu không sẽ sinh phức tạp và lỗi cấu hình."}],"path":{"foundation":{"goal":"Có nhận thức và nắm nguyên tắc an ninh cơ bản.","topics":["Tam giác CIA và khái niệm rủi ro","Mạng và hệ điều hành cơ bản","Nhận diện phishing","Mật khẩu và MFA"],"signal":"Giải thích được các mối đe dọa phổ biến và áp dụng đúng quy định an ninh nội bộ."},"intermediate":{"goal":"Vận hành các biện pháp kiểm soát.","topics":["Bảo mật mạng và hệ thống","IAM","Quản lý lỗ hổng và bản vá","Giám sát log cơ bản"],"signal":"Cấu hình và giám sát được các kiểm soát an ninh cho một hệ thống."},"advanced":{"goal":"Phát hiện, ứng cứu và bảo mật ngay từ thiết kế.","topics":["SOC và ứng cứu sự cố","Bảo mật ứng dụng và DevSecOps","Mô hình hóa mối đe dọa","Bảo mật cloud"],"signal":"Dẫn dắt xử lý sự cố thực tế và đưa kiểm soát bảo mật vào vòng đời phát triển."},"expert":{"goal":"Xây chiến lược và quản trị an ninh.","topics":["Kiến trúc an ninh doanh nghiệp và Zero Trust","GRC và tuân thủ ngành","Quản lý rủi ro bên thứ ba","Khả năng chống chịu (resilience)"],"signal":"Xây chiến lược an ninh gắn với rủi ro kinh doanh và báo cáo được cho cấp lãnh đạo."}},"standards":[{"name":"ISO/IEC 27001:2022","note":"Hệ thống quản lý an toàn thông tin.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 27002:2022","note":"Bộ biện pháp kiểm soát an toàn thông tin.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 27701:2025","note":"Hệ thống quản lý thông tin quyền riêng tư (PIMS), thay thế bản 2019; từ bản 2025 là chuẩn độc lập, chứng nhận được mà không cần ISO/IEC 27001.","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"NIST Cybersecurity Framework 2.0 (2024)","note":"Khung an ninh mạng với sáu chức năng.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"PCI DSS v4.0.1","note":"Chuẩn bảo mật dữ liệu ngành thẻ thanh toán.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"CIS Critical Security Controls v8.1","note":"Bộ kiểm soát an ninh ưu tiên.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"OWASP Top 10:2025 và OWASP ASVS","note":"Phiên bản Top 10 hiện hành, thay bản 2021; bổ sung hai nhóm mới: lỗi chuỗi cung ứng phần mềm và xử lý sai điều kiện ngoại lệ.","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"MITRE ATT&CK","note":"Cơ sở tri thức về hành vi của đối thủ.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"IEC 62443","note":"An ninh cho hệ thống tự động hóa và điều khiển công nghiệp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Luật An ninh mạng số 116/2025/QH15","note":"Thông qua ngày 10/12/2025, hiệu lực từ 01/7/2026; thay thế Luật An ninh mạng 2018 (24/2018/QH14) và Luật An toàn thông tin mạng 2015.","checked":"Đối chiếu nguồn ngày 25/09/2026"},{"name":"Thông tư 09/2020/TT-NHNN","note":"Quy định an toàn hệ thống thông tin trong hoạt động ngân hàng. Còn hiệu lực; tháng 3/2026 VNBA đã lấy ý kiến hội viên về dự thảo sửa đổi, bổ sung.","checked":"Đối chiếu nguồn ngày 25/09/2026"}],"tools":[{"group":"SIEM và giám sát","items":["Microsoft Sentinel","Splunk","Elastic Security","Wazuh"]},{"group":"Bảo vệ điểm cuối","items":["Microsoft Defender for Endpoint","CrowdStrike Falcon"]},{"group":"Quản lý lỗ hổng","items":["Tenable Nessus","Qualys","OpenVAS"]},{"group":"Bảo mật ứng dụng","items":["OWASP ZAP","Burp Suite","SonarQube","Snyk"]},{"group":"Định danh và đặc quyền","items":["Microsoft Entra ID","Okta","CyberArk"]},{"group":"Mật mã","items":["HSM","OpenSSL"]}],"certs":[{"name":"CompTIA Security+","note":"Nền tảng an ninh mạng.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISC2 CISSP","note":"Chuyên gia bảo mật hệ thống thông tin.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISACA CISM","note":"Quản lý an ninh thông tin.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISACA CISA","note":"Kiểm toán hệ thống thông tin.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"EC-Council CEH","note":"Kiểm thử bảo mật có đạo đức.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"OffSec OSCP","note":"Kiểm thử xâm nhập thực hành.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 27001 Lead Implementer / Lead Auditor","note":"Triển khai và đánh giá hệ thống quản lý an toàn thông tin.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISC2 CCSP","note":"Bảo mật cloud.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Chuyên viên phân tích SOC","skills":"SIEM, phân tích log, ứng cứu sự cố"},{"role":"Kỹ sư bảo mật","skills":"Tường lửa, IAM, EDR, gia cố hệ thống"},{"role":"Chuyên gia bảo mật ứng dụng","skills":"Lập trình an toàn, SAST, DAST, threat modeling"},{"role":"Chuyên viên kiểm thử xâm nhập (có ủy quyền)","skills":"Đánh giá lỗ hổng, báo cáo, khuyến nghị khắc phục"},{"role":"Chuyên viên GRC","skills":"ISO/IEC 27001, đánh giá rủi ro, tuân thủ"},{"role":"Giám đốc an ninh thông tin (CISO)","skills":"Chiến lược an ninh, quản trị rủi ro, giao tiếp với lãnh đạo"}],"glossary":[["Threat","Mối đe dọa","Tác nhân hoặc sự kiện có thể gây hại."],["Vulnerability","Lỗ hổng","Điểm yếu có thể bị khai thác."],["Exploit","Mã khai thác","Cách lợi dụng một lỗ hổng (chỉ ở mức khái niệm)."],["Malware","Mã độc","Phần mềm được tạo ra để gây hại."],["Ransomware","Mã độc tống tiền","Mã độc mã hóa dữ liệu để đòi tiền chuộc."],["Patch","Bản vá","Bản cập nhật sửa lỗi hoặc lỗ hổng."],["Encryption","Mã hóa","Biến dữ liệu thành dạng không đọc được nếu thiếu khóa."],["Authentication","Xác thực","Kiểm tra danh tính người dùng."],["Authorization","Phân quyền","Xác định người dùng được làm gì."],["Incident response","Ứng cứu sự cố","Quy trình xử lý sự cố an ninh."]],"quiz":[{"q":"Tấn công DDoS chủ yếu nhắm vào thuộc tính nào của tam giác CIA?","o":["Bảo mật","Toàn vẹn","Sẵn sàng","Chống chối bỏ"],"a":2,"e":"DDoS làm quá tải dịch vụ để người dùng hợp lệ không truy cập được."},{"q":"Mật khẩu kết hợp câu hỏi bảo mật có phải là MFA không?","o":["Có, là MFA","Không, vì cả hai đều thuộc nhóm ‘điều bạn biết’","Có, là MFA mức cao","Là xác thực sinh trắc học"],"a":1,"e":"MFA đòi hỏi các yếu tố thuộc nhóm khác nhau."},{"q":"Cách lưu mật khẩu người dùng đúng là gì?","o":["Mã hóa đối xứng","Lưu dạng văn bản rõ","Băm có salt bằng thuật toán chậm chuyên dụng","Mã hóa Base64"],"a":2,"e":"Các thuật toán như Argon2, bcrypt hay scrypt được thiết kế để làm chậm tấn công dò mật khẩu; Base64 chỉ là mã hóa hiển thị."},{"q":"Chức năng nào được bổ sung trong NIST CSF 2.0?","o":["Identify","Govern","Recover","Detect"],"a":1,"e":"CSF 2.0 thêm Govern bên cạnh năm chức năng Identify, Protect, Detect, Respond, Recover."},{"q":"Kiểm thử xâm nhập hợp pháp bắt buộc phải có điều gì?","o":["Công cụ chuyên dụng","Ủy quyền bằng văn bản và phạm vi rõ ràng","Thực hiện ngoài giờ làm việc","Không thông báo cho ai"],"a":1,"e":"Không có ủy quyền, hoạt động kiểm thử có thể vi phạm pháp luật."}],"links":[{"to":"it","why":"Kiểm soát an ninh được triển khai trên hạ tầng và dịch vụ IT."},{"to":"se","why":"Bảo mật ứng dụng gắn liền với vòng đời phát triển phần mềm."},{"to":"ai","why":"AI vừa là công cụ phòng thủ vừa mang rủi ro an ninh mới."},{"to":"data","why":"Bảo vệ dữ liệu cá nhân dựa vào mã hóa, phân quyền và giám sát."},{"to":"eng","why":"Hệ thống OT/ICS trong kỹ thuật công nghiệp cần bảo mật chuyên biệt."}]}]};</script>
<script>
(function(){
'use strict';
var D=DATA.domains, B=DATA.branch;
var byId={}; D.forEach(function(d){byId[d.id]=d;});
var TABS=[['overview','Tổng quan'],['map','Bản đồ kiến thức'],['concepts','Khái niệm cốt lõi'],['path','Lộ trình học'],['standards','Chuẩn và công cụ'],['careers','Nghề nghiệp'],['glossary','Thuật ngữ'],['quiz','Quiz']];
var STAGES=[['foundation','Nền tảng'],['intermediate','Trung cấp'],['advanced','Nâng cao'],['expert','Chuyên gia']];
var state={learned:{},expanded:{},quiz:{},first:true};
var main=document.getElementById('main'), side=document.getElementById('sidebar');

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase();}
function learnedCount(d){return d.topics.filter(function(t){return state.learned[d.id+'/'+t.id];}).length;}
function pct(d){return Math.round(100*learnedCount(d)/d.topics.length);}
function bar(d){var p=pct(d);return '<div class="bar" role="progressbar" aria-label="Tiến độ '+esc(d.title)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><span style="width:'+p+'%"></span></div>';}
function chk(s){var ok=/^Đối chiếu/.test(s.checked);return '<span class="chk'+(ok?' ok':'')+'">'+esc(s.checked)+'</span>';}
function subs(t){return t.sub||t.children.map(function(n){return{n:n};});}
function childHref(d,t,i){return '#/iv/'+d.id+'/t/'+t.id+'/'+i;}
function firstSentence(s){var m=s.match(/^.*?[.](\s|$)/);return m?m[0]:s;}

/* ---------- Routing (hash only, no history API writes) ---------- */
function parse(){
  var h=location.hash.replace(/^#\/?/,''); try{h=decodeURIComponent(h);}catch(e){}
  var p=h.split('/').filter(Boolean);
  if(!p.length||(p[0]==='iv'&&p.length===1))return{v:'home'};
  if(p[0]!=='iv')return{v:'404'};
  var d=byId[p[1]]; if(!d)return{v:'404'};
  if(p[2]==='t'){var t=d.topics.filter(function(x){return x.id===p[3];})[0];if(!t)return{v:'404'};
    if(p[4]!=null){var ci=/^\d+$/.test(p[4])?+p[4]:-1;var sub=subs(t);return(ci>=0&&ci<sub.length)?{v:'child',d:d,t:t,ci:ci}:{v:'404'};}
    return{v:'topic',d:d,t:t};}
  var tab=p[2]||'overview';
  if(!TABS.some(function(x){return x[0]===tab;}))return{v:'404'};
  var idx=(p[3]!=null&&/^\d+$/.test(p[3]))?+p[3]:null;
  return{v:'domain',d:d,tab:tab,idx:idx};
}

/* ---------- Sidebar ---------- */
function renderSidebar(r){
  var cur=r.d?r.d.id:null, curT=r.t?r.t.id:null;
  if(cur)state.expanded[cur]=true;
  var h='<p class="side-head"><a href="#/iv">IV. Engineering &amp; Technology</a></p><ul class="tree">';
  D.forEach(function(d){
    var open=!!state.expanded[d.id];
    h+='<li><div class="node"><button class="twisty" aria-expanded="'+open+'" aria-controls="sub-'+d.id+'" data-toggle="'+d.id+'"><span class="sr">'+(open?'Thu gọn ':'Mở rộng ')+esc(d.title)+'</span></button>'+
      '<a href="#/iv/'+d.id+'"'+(cur===d.id&&!curT?' aria-current="page"':'')+'><span class="code">'+d.code+'</span>'+esc(d.title)+'</a>'+
      '<span class="count" title="Chủ đề đã học">'+learnedCount(d)+'/'+d.topics.length+'</span></div>'+
      '<ul id="sub-'+d.id+'" class="sub"'+(open?'':' hidden')+'>';
    d.topics.forEach(function(t){
      var l=state.learned[d.id+'/'+t.id];

function crumbs(items){

function edges(){
  var seen={},out=[];
  D.forEach(function(d){d.links.forEach(function(l){var k=[d.id,l.to].sort().join('|');if(!seen[k]){seen[k]=1;out.push([d.id,l.to]);}});});
  return out;
}
function schematic(){
  var W=760,H=460,cx=W/2,cy=H/2+4,rx=268,ry=170,nw=200,nh=54,pos={};
  D.forEach(function(d,i){var a=-Math.PI/2+i*2*Math.PI/D.length;pos[d.id]=[cx+rx*Math.cos(a),cy+ry*Math.sin(a)];});
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Sơ đồ liên kết giữa bảy lĩnh vực"><g class="edges">';
  edges().forEach(function(e,i){var a=pos[e[0]],b=pos[e[1]];
    s+='<line class="edge" pathLength="1" style="animation-delay:'+(i*60)+'ms" data-a="'+e[0]+'" data-b="'+e[1]+'" x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"/>';});
  s+='</g>';
  D.forEach(function(d){var p=pos[d.id],x=p[0]-nw/2,y=p[1]-nh/2;
    s+='<a class="snode" href="#/iv/'+d.id+'" data-id="'+d.id+'" aria-label="'+esc(d.code+' '+d.title+', '+d.vi)+'"><rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+nw+'" height="'+nh+'" rx="3"/>'+
      '<text class="sc" x="'+(x+12).toFixed(1)+'" y="'+(y+20).toFixed(1)+'">'+d.code+'</text>'+
      '<text class="st" x="'+(x+48).toFixed(1)+'" y="'+(y+21).toFixed(1)+'">'+esc(d.title)+'</text>'+
      '<text class="sv" x="'+(x+48).toFixed(1)+'" y="'+(y+40).toFixed(1)+'">'+esc(d.vi)+'</text></a>';});
  return '<div class="schematic'+(state.first?' draw':'')+'">'+s+'</svg></div>';
}
function wireSchematic(){
  var svg=main.querySelector('.schematic svg'); if(!svg)return;
  function hot(id){svg.querySelectorAll('.edge').forEach(function(e){e.classList.toggle('hot',!!id&&(e.dataset.a===id||e.dataset.b===id));});}
  svg.querySelectorAll('.snode').forEach(function(n){
    n.addEventListener('mouseenter',function(){hot(n.dataset.id);});
    n.addEventListener('focus',function(){hot(n.dataset.id);});
    n.addEventListener('mouseleave',function(){hot(null);});
    n.addEventListener('blur',function(){hot(null);});
  });
}

/* ---------- Render ---------- */
function render(opts){
  opts=opts||{};
  var r=parse(),h;
  if(r.v==='home')h=viewHome();
  else if(r.v==='domain')h=viewDomain(r);
  else if(r.v==='topic')h=viewTopic(r);
  else if(r.v==='child')h=viewChild(r);
  else h=view404();
  main.innerHTML=h;
  renderSidebar(r);
  if(r.v==='home')wireSchematic();
  document.title=(r.v==='child'?subs(r.t)[r.ci].n+' – '+r.t.title+' – ':r.v==='topic'?r.t.title+' – ':r.v==='domain'?r.d.title+' – ':'')+'IV. Engineering & Technology';
  if(opts.keep)return;
  if(r.v==='domain'&&r.idx!=null){
    var el=document.getElementById('focus-'+r.idx);
    if(el){el.setAttribute('tabindex','-1');el.scrollIntoView({block:'center'});el.focus({preventScroll:true});return;}
  }
  window.scrollTo(0,0);
  if(!state.first){var h1=main.querySelector('h1');if(h1)h1.focus({preventScroll:true});}
  state.first=false;
}

main.addEventListener('click',function(e){

  var lb=t.closest('[data-learn]');

    render({keep:true});var nb=main.querySelector('[data-learn]');if(nb)nb.focus();return;}
  var cb=t.closest('[data-check]');

    render({keep:true});var fb=document.getElementById('fb-'+i);if(fb)fb.focus();return;}
  var rb=t.closest('[data-reset]');
  if(rb){var id=rb.getAttribute('data-reset');state.quiz[id]={sel:{},checked:{}};render({keep:true});

});
INDEX.forEach(function(x){x.tn=norm(x.t);});
function search(q){
  var toks=norm(q).split(/\s+/).filter(Boolean); if(!toks.length)return[];
  var out=[];
  INDEX.forEach(function(x){
    if(!toks.every(function(k){return x.k.indexOf(k)>=0||x.tn.indexOf(k)>=0;}))return;
    var sc=x.w; toks.forEach(function(k){if(x.tn.indexOf(k)>=0)sc+=5;if(x.tn.indexOf(k)===0)sc+=3;});
    out.push([sc,x]);
  });
  out.sort(function(a,b){return b[0]-a[0];});
  return out.slice(0,12).map(function(a){return a[1];});
}
var qEl=document.getElementById('q'),res=document.getElementById('results'),timer;
function showResults(){
  var v=qEl.value.trim();
  if(!v){res.hidden=true;qEl.setAttribute('aria-expanded','false');return;}
  var list=search(v),h='';
  if(!list.length)h='<p class="empty">Không có kết quả cho “'+esc(v)+'”. Thử từ khóa ngắn hơn hoặc thuật ngữ tiếng Anh.</p>';
  else list.forEach(function(x){h+='<a href="'+x.r+'"><span class="rt">'+esc(x.t)+'</span><span class="rs">'+esc(x.s)+'</span></a>';});
  res.innerHTML=h;res.hidden=false;qEl.setAttribute('aria-expanded','true');
}
qEl.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(showResults,120);});
qEl.addEventListener('focus',function(){if(qEl.value.trim())showResults();});
qEl.addEventListener('keydown',function(e){
  if(e.key==='Escape'){res.hidden=true;qEl.setAttribute('aria-expanded','false');}
  if(e.key==='ArrowDown'){var a=res.querySelector('a');if(a){e.preventDefault();a.focus();}}
  if(e.key==='Enter'){var a2=res.querySelector('a');if(a2&&!res.hidden){e.preventDefault();location.hash=a2.getAttribute('href');}}
});
res.addEventListener('keydown',function(e){
  var links=[].slice.call(res.querySelectorAll('a')),i=links.indexOf(document.activeElement);
  if(e.key==='ArrowDown'&&i<links.length-1){e.preventDefault();links[i+1].focus();}
  if(e.key==='ArrowUp'){e.preventDefault();if(i>0)links[i-1].focus();else qEl.focus();}
  if(e.key==='Escape'){res.hidden=true;qEl.focus();}
});
document.addEventListener('click',function(e){if(!e.target.closest('.search')){res.hidden=true;qEl.setAttribute('aria-expanded','false');}});

/* ---------- Theme and mobile nav ---------- */
var themeBtn=document.getElementById('themeBtn');
function setTheme(dark){document.documentElement.setAttribute('data-theme',dark?'dark':'light');themeBtn.setAttribute('aria-pressed',dark);themeBtn.textContent=dark?'Giao diện sáng':'Giao diện tối';}
setTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
themeBtn.addEventListener('click',function(){setTheme(document.documentElement.getAttribute('data-theme')!=='dark');});
var navBtn=document.getElementById('navToggle');
navBtn.addEventListener('click',function(){var o=!side.classList.contains('open');side.classList.toggle('open',o);navBtn.setAttribute('aria-expanded',o);});
function closeNav(){side.classList.remove('open');navBtn.setAttribute('aria-expanded','false');}

window.addEventListener('hashchange',function(){res.hidden=true;qEl.setAttribute('aria-expanded','false');closeNav();render();});
render();
})();
</script>
</body>
