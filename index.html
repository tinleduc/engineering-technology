<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IV. Engineering &amp; Technology – Portal kiến thức</title>
<style>
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#16233A; --graphite:#566173; --rule:#D3DAD9;
  --accent:#0E6E63; --accent-soft:#DCEDEA; --signal:#9A5F0E; --signal-soft:#F6EAD6;
  --ok:#1E6B3A; --ok-soft:#E1F1E6; --no:#A3322A; --no-soft:#F8E3E1;
  --serif:"Charter","Bitstream Charter","Sitka Text","Cambria","Georgia",serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --side:292px;
}
[data-theme="dark"]{
  --paper:#0F1A24; --surface:#152331; --ink:#E4EAEE; --graphite:#9EABB6; --rule:#2A3B4A;
  --accent:#5BBBAD; --accent-soft:#16352F; --signal:#E0AA4A; --signal-soft:#3A2C12;
  --ok:#6CC58A; --ok-soft:#15301F; --no:#EE8A80; --no-soft:#3A1B18;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:8px 12px;z-index:50}
.skip:focus{left:8px;top:8px}
button{font:inherit;color:inherit;cursor:pointer}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand-code{font:700 22px/1 var(--serif);color:var(--accent)}
.brand-name{font-weight:600}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(16,30,50,.14);padding:4px}
.results a{display:block;padding:8px 10px;border-radius:4px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus{background:var(--accent-soft);outline:none}
.results .rt{display:block;font-weight:600}
.results .rs{display:block;font-size:13px;color:var(--graphite)}
.results .empty{padding:10px;color:var(--graphite)}
.themebtn,.navtoggle,.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:7px 12px}
.themebtn:hover,.navtoggle:hover,.btn:hover{border-color:var(--accent)}
.navtoggle{display:none}

/* Layout */
.layout{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - 56px)}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid var(--rule);padding:18px 12px 40px;background:var(--paper)}
.main{padding:28px 40px 80px;min-width:0}
.main:focus{outline:none}
.wrap{max-width:860px}

/* Sidebar tree */
.side-head{margin:0 8px 12px;font-size:13px;color:var(--graphite)}
.side-head a{color:var(--graphite)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.node{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:4px;padding:2px 4px;border-radius:4px}
.node a{text-decoration:none;color:var(--ink);padding:5px 2px;font-weight:600}
.node a[aria-current="page"],.sub a[aria-current="page"]{color:var(--accent)}
.node .code{font-family:var(--serif);color:var(--graphite);font-weight:400;margin-right:4px;font-variant-numeric:tabular-nums}
.count{font-size:12px;color:var(--graphite);font-variant-numeric:tabular-nums}
.twisty{width:22px;height:22px;border:0;background:none;padding:0;position:relative;border-radius:3px}
.twisty::before{content:"";position:absolute;left:8px;top:6px;border:5px solid transparent;border-left:6px solid var(--graphite);transition:transform .15s}
.twisty[aria-expanded="true"]::before{transform:rotate(90deg);transform-origin:3px 5px}
.sub{margin:0 0 6px 30px !important;border-left:1px solid var(--rule)}
.sub a{display:block;padding:4px 10px;font-size:14px;color:var(--ink);text-decoration:none;border-radius:0 4px 4px 0}
.sub a:hover{background:var(--accent-soft)}
.sub a.learned{color:var(--graphite)}
.sub a.learned::after{content:" – đã học";font-size:12px;color:var(--signal)}

/* Common */
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
h1{font-size:34px;font-weight:700}
h2{font-size:22px;margin:36px 0 12px}
h3{font-size:18px;margin:0 0 6px}
.prose{font-family:var(--serif);font-size:17px;line-height:1.65;max-width:68ch}
.lede{font-family:var(--serif);font-size:19px;line-height:1.6;max-width:64ch;color:var(--ink);margin:12px 0 0}
.muted{color:var(--graphite)}
.crumbs{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.crumbs ol{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:14px}
.crumbs li+li::before{content:"/";margin-right:6px;color:var(--graphite)}
.crumbs .btn{font-size:13px;padding:4px 10px}

/* Home */
.home-head{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.home-code{font:700 120px/.8 var(--serif);color:var(--accent);margin:0;letter-spacing:-2px}
.schematic{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
[data-theme="dark"] .schematic{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px)}
.schematic svg{display:block;width:100%;height:auto}
.edge{stroke:var(--graphite);stroke-width:1.4;opacity:.55;fill:none;transition:opacity .15s,stroke .15s}
.edge.hot{stroke:var(--accent);opacity:1;stroke-width:2.4}
.snode rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.snode .sc{fill:var(--accent);font:600 12px var(--serif)}
.snode .st{fill:var(--ink);font:600 14px var(--sans)}
.snode .sv{fill:var(--graphite);font:12px var(--sans)}
.snode:hover rect,.snode:focus rect{stroke:var(--accent);stroke-width:2.4}
.snode:focus{outline:none}
.draw .edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.dlist li{display:grid;grid-template-columns:70px 1fr 150px;gap:18px;align-items:start;padding:16px 0;border-bottom:1px solid var(--rule)}
.dlist .dc{font:600 20px var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.dlist a.dt{font:700 18px var(--serif);color:var(--ink);text-decoration:none}
.dlist a.dt:hover{color:var(--accent)}
.dlist p{margin:4px 0 0;color:var(--graphite);max-width:60ch}
.prog{font-size:13px;color:var(--graphite)}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--signal)}
.note{margin-top:40px;padding:14px 16px;border-left:3px solid var(--signal);background:var(--signal-soft);font-size:14px;max-width:72ch}

/* Domain */
.dhead{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:end}
.dcode{font:700 64px/.85 var(--serif);color:var(--accent);margin:0;font-variant-numeric:tabular-nums}
.dvi{margin:6px 0 0;font-size:16px;color:var(--graphite)}
.tabs{margin:26px 0 8px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;white-space:nowrap}
.tabs a{display:block;padding:9px 12px;text-decoration:none;color:var(--graphite);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.panel{padding-top:10px}
.diff{padding-left:1.1em}
.diff li{margin:8px 0}
.xlinks{list-style:none;padding:0;margin:0}
.xlinks li{padding:10px 0;border-bottom:1px solid var(--rule)}
.xlinks a{font-weight:600}

.kmap{list-style:none;padding:0;margin:0}
.kmap>li{padding:16px 0;border-bottom:1px solid var(--rule)}
.kmap .kt{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kmap .kt a{font:700 18px var(--serif);text-decoration:none}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;background:var(--signal-soft);color:var(--signal)}
.leaves{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:8px 0 0}
.leaves li{font-size:13px;padding:2px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}

.concept{padding:18px 0;border-bottom:1px solid var(--rule);scroll-margin-top:80px}
.concept p{margin:6px 0;max-width:70ch}
.concept .lbl{font-weight:600}
.concept .mis{color:var(--graphite)}
.focus{background:var(--accent-soft);box-shadow:-12px 0 0 var(--accent-soft),12px 0 0 var(--accent-soft)}

.stages{list-style:none;padding:0;margin:0;counter-reset:st}
.stages>li{position:relative;padding:4px 0 26px 56px;counter-increment:st}
.stages>li::before{content:counter(st);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:700 16px var(--serif)}
.stages>li:not(:last-child)::after{content:"";position:absolute;left:17px;top:38px;bottom:4px;border-left:1.5px solid var(--rule)}
.stages ul{margin:6px 0;padding-left:1.1em}
.stages .sig{margin:6px 0 0;padding:8px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;max-width:68ch}

table{border-collapse:collapse;width:100%;max-width:860px;background:var(--surface);border:1px solid var(--rule)}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{font-size:13px;color:var(--graphite);font-weight:600;background:var(--paper)}
tr.focus td{background:var(--accent-soft)}
tr{scroll-margin-top:80px}
.deflist{margin:0}
.deflist div{padding:10px 0;border-bottom:1px solid var(--rule)}
.deflist dt{font-weight:600}
.deflist dd{margin:2px 0 0;color:var(--graphite)}
.chk{display:block;margin-top:3px;font-size:12px;color:var(--graphite)}
.chk.ok{color:var(--ok)}
.legal{margin:4px 0 18px;padding:12px 14px;border-left:3px solid var(--no);background:var(--no-soft);font-size:14px;max-width:72ch}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 24px}
.tools div{padding:8px 0;border-bottom:1px solid var(--rule)}
.tools h3{font:600 14px var(--sans);color:var(--graphite);margin:0 0 2px}

.q{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:14px 18px 16px;margin:0 0 16px;scroll-margin-top:80px}
.q legend{font-weight:600;padding:0 4px;max-width:64ch}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:4px;margin:2px 0}
.opt input{margin-top:4px}
.opt.right{background:var(--ok-soft)}
.opt.wrong{background:var(--no-soft)}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:4px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--no-soft)}
.fb strong{display:block}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="dark"] .btn.primary{color:#0F1A24}
.btn:disabled{opacity:.5;cursor:not-allowed}
.score{font-weight:600}

.subl{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.subl li{padding:12px 0;border-bottom:1px solid var(--rule)}
.subl a{font-weight:600;text-decoration:none}
.subl p{margin:3px 0 0;color:var(--graphite);max-width:70ch}
.leaves a{text-decoration:none;color:inherit}
.leaves a:hover{color:var(--accent)}
.facet{margin:0 0 22px;max-width:70ch}
.facet h2{font-size:15px;font-family:var(--sans);text-transform:none;color:var(--graphite);margin:26px 0 6px;font-weight:600}
.facet p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.65}
.facet.warn{padding:12px 16px;background:var(--signal-soft);border-left:3px solid var(--signal)}
.facet.warn h2{margin-top:0}
.facet.ex{padding:12px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.facet.ex h2{margin-top:0}
.sibs{margin-top:30px}
.sibs ol{padding-left:1.4em}
.sibs li{margin:4px 0}
.topic-actions{display:flex;gap:10px;align-items:center;margin:26px 0;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:16px;border-top:1px solid var(--rule)}
.pager a{text-decoration:none;max-width:45%}
.pager span{display:block;font-size:12px;color:var(--graphite)}
.points{padding-left:1.1em}
.points li{margin:8px 0}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .navtoggle{display:inline-block}
  .sidebar{position:fixed;top:56px;left:0;width:min(88vw,320px);z-index:15;background:var(--paper);transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .sidebar.open{transform:none}
  .main{padding:22px 18px 70px}
  .brand-name{display:none}
  .home-code{font-size:72px}
  .dcode{font-size:44px}
  h1{font-size:28px}
  .dlist li{grid-template-columns:52px 1fr}
  .dlist .progcell{grid-column:2}
  .themebtn{padding:7px 9px;font-size:13px}
}
@media (max-width:520px){
  .home-head,.dhead{grid-template-columns:1fr;gap:8px}
  table{font-size:14px}
  th,td{padding:8px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  .draw .edge{stroke-dasharray:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<a class="skip" href="#main">Bỏ qua đến nội dung</a>
<header class="topbar">
  <button id="navToggle" class="navtoggle" aria-expanded="false" aria-controls="sidebar">Mục lục</button>
  <a class="brand" href="#/iv"><span class="brand-code">IV</span><span class="brand-name">Engineering &amp; Technology</span></a>
  <div class="search" role="search">
    <label for="q" class="sr">Tìm kiếm chủ đề, khái niệm, thuật ngữ</label>
    <input id="q" type="search" placeholder="Tìm chủ đề, khái niệm, thuật ngữ" autocomplete="off" aria-controls="results" aria-expanded="false">
    <div id="results" class="results" hidden></div>
  </div>
  <button id="themeBtn" class="themebtn" aria-pressed="false">Giao diện tối</button>
</header>
<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Cây kiến thức"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<script>const DATA={"branch":{"code":"IV","title":"Engineering & Technology","intro":"Nhánh IV tập hợp bảy lĩnh vực tạo nên nền tảng kỹ thuật và công nghệ, từ nguyên lý kỹ thuật truyền thống và khoa học máy tính đến phần mềm, hạ tầng, trí tuệ nhân tạo, dữ liệu và an ninh mạng. Mỗi lĩnh vực có bản đồ kiến thức, khái niệm cốt lõi, lộ trình học, chuẩn tham chiếu, nghề nghiệp, thuật ngữ và quiz.","asOf":"25/09/2026"},"domains":[{"id":"eng","code":"IV.1","title":"Engineering","vi":"Kỹ thuật","summary":"Kỹ thuật (Engineering) là ngành ứng dụng khoa học, toán học và kinh nghiệm thực tiễn để thiết kế, xây dựng và vận hành các hệ thống, kết cấu, máy móc và quy trình, đáp ứng nhu cầu con người trong giới hạn về chi phí, an toàn và nguồn lực.","diff":["Khác Khoa học (Science): khoa học tìm hiểu vì sao thế giới vận hành như vậy; kỹ thuật dùng hiểu biết đó để tạo ra giải pháp chịu nhiều ràng buộc thực tế.","Khác Software Engineering: kỹ thuật truyền thống làm việc với vật chất, năng lượng và kết cấu vật lý, nơi sai sót thường rất khó sửa sau khi đã chế tạo; phần mềm thay đổi được với chi phí biên thấp hơn nhiều.","Kỹ thuật hệ thống (Systems Engineering) là cầu nối: các nguyên lý vòng đời hệ thống áp dụng chung cho cả phần cứng lẫn phần mềm."],"topics":[{"id":"design","title":"Quy trình thiết kế kỹ thuật","summary":"Chuỗi bước lặp từ xác định vấn đề đến kiểm chứng giải pháp, là nền tảng chung của mọi chuyên ngành kỹ thuật.","points":["Xác định yêu cầu và ràng buộc trước khi nghĩ đến giải pháp.","Tạo nhiều phương án rồi đánh giá bằng tiêu chí có trọng số thay vì chọn theo cảm tính.","Mẫu thử (prototype) và kiểm thử giúp phát hiện sai lệch sớm, khi chi phí sửa còn thấp."],"children":["Xác định vấn đề","Yêu cầu và ràng buộc","Sinh phương án","Ma trận quyết định","Prototype","Kiểm chứng và thẩm định (V&V)"],"sub":[{"n":"Xác định vấn đề","d":"Bước làm rõ vấn đề thật cần giải quyết, ai bị ảnh hưởng và thành công trông như thế nào.","k":"Phát biểu vấn đề tốt không chứa sẵn giải pháp; kỹ thuật hỏi ‘vì sao’ nhiều lần giúp tìm nguyên nhân gốc.","c":"Nhảy ngay vào giải pháp quen thuộc khiến nhóm giải đúng bài toán sai.","e":"Thay vì ‘cần máy bơm lớn hơn’, phát biểu lại: ‘tầng 12 thiếu áp lực nước vào giờ cao điểm’."},{"n":"Yêu cầu và ràng buộc","d":"Liệt kê chức năng cần có và các giới hạn bắt buộc như ngân sách, khối lượng, kích thước, quy chuẩn, môi trường vận hành.","k":"Phân biệt yêu cầu bắt buộc với mong muốn; mỗi yêu cầu cần đo được để kiểm chứng.","c":"Ràng buộc ngầm (thói quen người vận hành, mặt bằng lắp đặt) hay bị bỏ sót nhất.","e":"Tủ điện phải đạt cấp bảo vệ IP54, vừa khoang 600 mm, chi phí dưới ngân sách và dùng linh kiện có sẵn trong nước."},{"n":"Sinh phương án","d":"Tạo ra nhiều phương án khác nhau trước khi chọn, bằng brainstorming, phân tích chức năng, tham khảo giải pháp tương tự.","k":"Số lượng phương án ban đầu quan trọng; đánh giá tách khỏi bước sinh ý tưởng để không dập tắt ý tưởng sớm.","c":"Chỉ có một phương án thì không có quyết định thiết kế, chỉ có mặc định.","e":"Cho bài toán làm mát tủ điện: quạt thông gió, điều hòa tủ, tản nhiệt thụ động, di chuyển thiết bị tỏa nhiệt ra ngoài."},{"n":"Ma trận quyết định","d":"Bảng đánh giá các phương án theo tiêu chí có trọng số để chọn phương án tốt nhất một cách minh bạch.","k":"Trọng số phản ánh ưu tiên của bên liên quan và cần thống nhất trước khi chấm điểm.","c":"Điểm số tạo cảm giác chính xác giả tạo; nên kiểm tra độ nhạy: đổi trọng số một chút kết quả có đảo ngược không.","e":"Chấm 4 phương án làm mát theo chi phí (30%), độ tin cậy (30%), bảo trì (20%), tiêu thụ điện (20%)."},{"n":"Prototype","d":"Mẫu thử vật lý hoặc số dùng để kiểm tra ý tưởng, hình dáng, chức năng trước khi sản xuất.","k":"Mỗi prototype nên trả lời một câu hỏi cụ thể; từ mô hình thô đến mẫu gần sản phẩm thật.","c":"Đầu tư quá nhiều vào mẫu thử đầu tiên làm nhóm ngại loại bỏ nó dù kết quả không tốt.","e":"In 3D vỏ thiết bị để kiểm tra lắp ghép với bo mạch trước khi làm khuôn ép nhựa."},{"n":"Kiểm chứng và thẩm định (V&V)","d":"Kiểm chứng xác nhận sản phẩm đúng đặc tả; thẩm định xác nhận sản phẩm đáp ứng nhu cầu sử dụng thật.","k":"Kế hoạch V&V lập từ đầu; mỗi yêu cầu có phương pháp kiểm chứng: kiểm tra, phân tích, trình diễn hoặc thử nghiệm.","c":"Chỉ kiểm chứng trong phòng thí nghiệm mà bỏ qua điều kiện vận hành thực tế.","e":"Máy lọc nước đạt thông số lưu lượng (kiểm chứng) và được vận hành thử 30 ngày tại trường học (thẩm định)."}]},{"id":"mech","title":"Kỹ thuật cơ khí","summary":"Thiết kế, phân tích và chế tạo máy móc, cơ cấu và các hệ thống nhiệt – chất lưu.","points":["Cơ học vật rắn quyết định một kết cấu có chịu được tải hay không.","Nhiệt động lực học chi phối mọi hệ thống chuyển hóa năng lượng.","CAD/CAE cho phép mô phỏng và tối ưu trước khi chế tạo thật."],"children":["Cơ học kỹ thuật","Sức bền vật liệu","Nhiệt động lực học","Cơ học chất lưu","Chi tiết máy","Công nghệ chế tạo"],"sub":[{"n":"Cơ học kỹ thuật","d":"Nghiên cứu lực, chuyển động và cân bằng của vật thể, gồm tĩnh học và động lực học.","k":"Sơ đồ vật thể tự do là công cụ cơ bản để phân tích lực; định luật Newton là nền của động lực học.","c":"Bỏ sót lực ma sát, lực quán tính hoặc giả định sai điểm đặt lực dẫn đến tính sai toàn bộ.","e":"Tính phản lực tại hai gối đỡ của một dầm cầu trục khi xe con mang tải ở vị trí bất lợi nhất."},{"n":"Sức bền vật liệu","d":"Nghiên cứu ứng suất, biến dạng và khả năng chịu lực của chi tiết dưới tác dụng của tải trọng.","k":"Kiểm tra theo ba điều kiện: bền (không phá hủy), cứng (không biến dạng quá mức), ổn định (không mất ổn định như uốn dọc).","c":"Chỉ tính tải tĩnh mà bỏ qua tải lặp gây mỏi là nguyên nhân phổ biến của hỏng chi tiết máy.","e":"Chọn đường kính trục truyền mô-men xoắn sao cho ứng suất tiếp nhỏ hơn giới hạn cho phép với hệ số an toàn 2."},{"n":"Nhiệt động lực học","d":"Nghiên cứu năng lượng, nhiệt, công và hiệu suất chuyển hóa năng lượng.","k":"Định luật 1: năng lượng bảo toàn; định luật 2: không có máy nhiệt hiệu suất 100%, giới hạn bởi chu trình Carnot.","c":"Nhầm lẫn giữa nhiệt và nhiệt độ; bỏ qua tổn thất khi tính hiệu suất thực tế.","e":"Đánh giá hiệu suất lò hơi và tính lượng nhiên liệu tiết kiệm khi thu hồi nhiệt từ khói thải."},{"n":"Cơ học chất lưu","d":"Nghiên cứu hành vi của chất lỏng và chất khí khi đứng yên và chuyển động.","k":"Phương trình Bernoulli và tổn thất áp suất trong ống là nền tảng thiết kế hệ thống bơm, quạt, đường ống.","c":"Bỏ qua tổn thất cục bộ tại co, van, tê khiến bơm chọn thiếu công suất.","e":"Tính cột áp bơm cấp nước cho tòa nhà 15 tầng, gồm chiều cao hình học và tổn thất đường ống."},{"n":"Chi tiết máy","d":"Thiết kế và tính toán các chi tiết máy tiêu chuẩn như trục, ổ lăn, bánh răng, lò xo, mối ghép ren.","k":"Ưu tiên dùng chi tiết theo tiêu chuẩn để dễ thay thế; chọn theo catalog nhà sản xuất dựa trên tải và tuổi thọ.","c":"Chọn ổ lăn chỉ theo đường kính trục mà không tính tuổi thọ theo tải thực tế.","e":"Chọn ổ bi cho động cơ quạt đạt tuổi thọ 20.000 giờ theo tải hướng kính và tốc độ quay."},{"n":"Công nghệ chế tạo","d":"Các phương pháp gia công và sản xuất chi tiết: cắt gọt, đúc, rèn, hàn, ép, gia công CNC, in 3D.","k":"Thiết kế phải tính đến khả năng chế tạo (DFM); dung sai quá chặt làm chi phí tăng mạnh.","c":"Bản vẽ không ghi dung sai và độ nhám làm xưởng gia công tự hiểu theo cách riêng.","e":"Đổi chi tiết từ phay nguyên khối sang đúc rồi gia công tinh để giảm 40% chi phí khi sản xuất loạt lớn."}]},{"id":"elec","title":"Điện – điện tử","summary":"Nghiên cứu và ứng dụng điện, điện tử và điện từ trường, từ vi mạch đến lưới điện quốc gia.","points":["Định luật Ohm và Kirchhoff là nền tảng phân tích mạch.","Điện tử số là cơ sở phần cứng của máy tính và thiết bị thông minh.","Hệ thống điện lực quan tâm đến độ ổn định, tổn thất và an toàn vận hành."],"children":["Lý thuyết mạch","Điện tử tương tự","Điện tử số","Xử lý tín hiệu","Hệ thống điện","Viễn thông"],"sub":[{"n":"Lý thuyết mạch","d":"Phân tích mạch điện bằng các định luật và phương pháp như Ohm, Kirchhoff, Thevenin, Norton.","k":"Mạch một chiều, xoay chiều và quá độ có cách phân tích khác nhau; số phức giúp giải mạch xoay chiều.","c":"Quên chiều quy ước dòng và dấu điện áp là lỗi hay gặp khi giải mạch nhiều vòng.","e":"Tính dòng qua từng nhánh của mạch cấp nguồn LED để chọn điện trở hạn dòng phù hợp."},{"n":"Điện tử tương tự","d":"Mạch xử lý tín hiệu liên tục như khuếch đại, lọc, nguồn tuyến tính, dùng transistor và khuếch đại thuật toán.","k":"Khuếch đại thuật toán (op-amp) là khối xây dựng cơ bản; hồi tiếp âm quyết định độ ổn định và độ lợi.","c":"Nhiễu, trôi nhiệt và bố trí mạch in ảnh hưởng lớn đến chất lượng tín hiệu tương tự.","e":"Mạch khuếch đại tín hiệu cảm biến nhiệt độ từ vài mV lên dải 0 đến 3,3 V cho bộ chuyển đổi ADC."},{"n":"Điện tử số","d":"Mạch xử lý tín hiệu rời rạc 0 và 1: cổng logic, flip-flop, bộ đếm, vi xử lý, FPGA.","k":"Logic tổ hợp phụ thuộc đầu vào hiện tại; logic tuần tự có trạng thái và đồng hồ.","c":"Các vấn đề thời gian như setup, hold và metastability dễ gây lỗi chập chờn khó tái hiện.","e":"Thiết kế bộ đếm sản phẩm trên băng tải bằng cảm biến quang và vi điều khiển hiển thị lên LED 7 đoạn."},{"n":"Xử lý tín hiệu","d":"Biến đổi, phân tích và trích xuất thông tin từ tín hiệu như âm thanh, hình ảnh, rung động.","k":"Biến đổi Fourier chuyển tín hiệu sang miền tần số; định lý lấy mẫu Nyquist yêu cầu tần số lấy mẫu ít nhất gấp đôi tần số cao nhất.","c":"Lấy mẫu thiếu gây hiện tượng chồng phổ (aliasing) không thể sửa sau khi đã số hóa.","e":"Phân tích phổ rung động động cơ để phát hiện sớm hỏng ổ bi qua tần số đặc trưng."},{"n":"Hệ thống điện","d":"Hệ thống phát, truyền tải, phân phối và sử dụng điện năng.","k":"Điện áp cao giảm tổn thất truyền tải; cân bằng pha, hệ số công suất và bảo vệ rơ-le là mối quan tâm chính.","c":"Hệ số công suất thấp làm tăng dòng, tổn thất và có thể bị phạt tiền điện.","e":"Lắp tụ bù nâng hệ số công suất của nhà xưởng từ 0,75 lên 0,95."},{"n":"Viễn thông","d":"Truyền thông tin qua khoảng cách bằng dây dẫn, cáp quang hoặc sóng vô tuyến.","k":"Các khái niệm cốt lõi: điều chế, băng thông, tỷ số tín hiệu trên nhiễu, mã hóa kênh.","c":"Băng thông lý thuyết khác thông lượng thực tế; môi trường truyền và nhiễu làm giảm đáng kể.","e":"Tính quỹ đường truyền cho tuyến vi ba 10 km để chọn công suất phát và kích thước ăng-ten."}]},{"id":"civil","title":"Kỹ thuật xây dựng","summary":"Thiết kế và thi công công trình hạ tầng như nhà, cầu, đường và hệ thống cấp thoát nước.","points":["Kết cấu phải chịu tải trọng tĩnh, tải trọng động và tác động môi trường.","Địa kỹ thuật đánh giá nền đất trước khi đặt móng.","Quy chuẩn xây dựng là ràng buộc pháp lý bắt buộc, không phải khuyến nghị."],"children":["Cơ học kết cấu","Bê tông cốt thép","Kết cấu thép","Địa kỹ thuật","Kỹ thuật giao thông","Cấp thoát nước"],"sub":[{"n":"Cơ học kết cấu","d":"Phân tích nội lực và chuyển vị của kết cấu như dầm, cột, khung, dàn dưới tác dụng của tải trọng.","k":"Kết cấu tĩnh định giải bằng phương trình cân bằng; kết cấu siêu tĩnh cần thêm điều kiện biến dạng hoặc phần mềm phần tử hữu hạn.","c":"Mô hình liên kết sai (ngàm thay vì khớp) làm kết quả nội lực sai lệch lớn.","e":"Tính biểu đồ mô-men của khung nhà xưởng dưới tải gió và tải cầu trục."},{"n":"Bê tông cốt thép","d":"Vật liệu kết hợp bê tông chịu nén và cốt thép chịu kéo, dùng phổ biến nhất trong xây dựng.","k":"Thiết kế theo trạng thái giới hạn: độ bền và điều kiện sử dụng như độ võng, bề rộng vết nứt.","c":"Lớp bê tông bảo vệ không đủ khiến cốt thép bị ăn mòn, giảm tuổi thọ công trình.","e":"Thiết kế sàn bê tông cốt thép cho văn phòng với tải sử dụng và kiểm tra độ võng cho phép."},{"n":"Kết cấu thép","d":"Kết cấu dùng thép hình và thép tấm, có cường độ cao, thi công nhanh, phù hợp nhịp lớn.","k":"Liên kết (bu lông, hàn) và ổn định (uốn dọc, mất ổn định cục bộ) thường quyết định thiết kế.","c":"Thép cần được chống ăn mòn và chống cháy; bỏ qua sẽ giảm tuổi thọ và an toàn.","e":"Thiết kế khung thép tiền chế cho kho hàng nhịp 30 m."},{"n":"Địa kỹ thuật","d":"Nghiên cứu đất, đá làm nền móng: sức chịu tải, độ lún, ổn định mái dốc.","k":"Khảo sát địa chất là bắt buộc; lựa chọn móng nông hay móng cọc phụ thuộc vào địa tầng.","c":"Lún không đều gây nứt công trình dù từng móng vẫn đủ sức chịu tải.","e":"Chọn móng cọc khoan nhồi cho tòa nhà trên nền đất yếu ven sông."},{"n":"Kỹ thuật giao thông","d":"Quy hoạch, thiết kế và vận hành hạ tầng giao thông như đường, cầu, nút giao, hệ thống tín hiệu.","k":"Lưu lượng, tốc độ và mật độ là ba đại lượng cơ bản của dòng giao thông.","c":"Mở rộng đường có thể kích thích thêm nhu cầu đi lại và nhanh chóng tắc trở lại.","e":"Tối ưu chu kỳ đèn tín hiệu tại nút giao để giảm thời gian chờ giờ cao điểm."},{"n":"Cấp thoát nước","d":"Thiết kế hệ thống cấp nước sạch và thu gom, xử lý nước thải, nước mưa.","k":"Tính toán theo nhu cầu dùng nước, lưu lượng mưa và độ dốc đường ống.","c":"Thiết kế thoát nước theo số liệu mưa cũ có thể không đủ trước biến đổi khí hậu.","e":"Thiết kế hệ thống thoát nước mưa cho khu dân cư với chu kỳ lặp mưa phù hợp quy chuẩn."}]},{"id":"chem","title":"Kỹ thuật hóa học","summary":"Thiết kế quy trình biến đổi nguyên liệu thành sản phẩm có giá trị ở quy mô công nghiệp.","points":["Cân bằng vật chất và năng lượng là công cụ phân tích cơ bản.","Quy trình trong phòng thí nghiệm không tự động mở rộng được lên quy mô nhà máy.","An toàn quy trình (process safety) là ưu tiên hàng đầu."],"children":["Cân bằng vật chất","Truyền nhiệt và truyền khối","Động học phản ứng","Thiết bị phản ứng","An toàn quy trình"],"sub":[{"n":"Cân bằng vật chất","d":"Nguyên tắc khối lượng vào bằng khối lượng ra cộng tích lũy, áp dụng cho từng thiết bị và toàn quy trình.","k":"Là bước đầu tiên của mọi thiết kế quy trình; cần xác định rõ biên hệ thống và cơ sở tính.","c":"Sai số nhỏ ở mỗi dòng cộng dồn thành lệch lớn trong toàn quy trình.","e":"Tính lượng nguyên liệu cần mỗi giờ để sản xuất 10 tấn sản phẩm với hiệu suất phản ứng 85%."},{"n":"Truyền nhiệt và truyền khối","d":"Nghiên cứu cơ chế truyền nhiệt (dẫn, đối lưu, bức xạ) và truyền khối (khuếch tán) giữa các pha.","k":"Là nền của thiết kế thiết bị trao đổi nhiệt, tháp chưng cất, tháp hấp thụ, sấy.","c":"Cáu cặn trên bề mặt trao đổi nhiệt làm giảm hiệu suất theo thời gian; cần hệ số dự phòng.","e":"Thiết kế thiết bị trao đổi nhiệt dạng ống chùm để làm nguội dòng sản phẩm từ 120 xuống 40 độ C."},{"n":"Động học phản ứng","d":"Nghiên cứu tốc độ phản ứng hóa học và các yếu tố ảnh hưởng như nhiệt độ, nồng độ, xúc tác.","k":"Phương trình Arrhenius mô tả tốc độ phản ứng tăng theo nhiệt độ.","c":"Phản ứng tỏa nhiệt có thể tự tăng tốc mất kiểm soát nếu tản nhiệt không đủ.","e":"Xác định bậc phản ứng và năng lượng hoạt hóa từ số liệu thí nghiệm để thiết kế thiết bị."},{"n":"Thiết bị phản ứng","d":"Thiết bị nơi phản ứng diễn ra: bình khuấy gián đoạn, bình khuấy liên tục (CSTR), ống dòng đẩy (PFR).","k":"Chọn loại thiết bị theo động học phản ứng, quy mô sản xuất và yêu cầu kiểm soát nhiệt.","c":"Khuấy trộn không đều tạo điểm nóng và sản phẩm phụ ngoài ý muốn.","e":"Chọn thiết bị phản ứng gián đoạn cho dược phẩm sản lượng nhỏ, cần truy xuất theo mẻ."},{"n":"An toàn quy trình","d":"Quản lý rủi ro cháy, nổ, rò rỉ hóa chất trong nhà máy thông qua thiết kế, vận hành và bảo trì.","k":"Nguyên tắc nhiều lớp bảo vệ: thiết kế an toàn bản chất, điều khiển, báo động, hệ thống an toàn tự động, van an toàn.","c":"Thay đổi nhỏ về thiết bị hoặc quy trình mà không đánh giá an toàn (quản lý thay đổi) là nguyên nhân của nhiều tai nạn lớn.","e":"Lắp van an toàn và hệ thống dừng khẩn tự động cho bồn phản ứng áp suất cao."}]},{"id":"mechatronics","title":"Cơ điện tử và tự động hóa","summary":"Tích hợp cơ khí, điện tử, điều khiển và phần mềm để tạo hệ thống thông minh như robot và dây chuyền tự động.","points":["Lý thuyết điều khiển (vòng hở, vòng kín, PID) là phần cốt lõi.","Cảm biến và cơ cấu chấp hành kết nối thế giới vật lý với bộ điều khiển.","PLC và SCADA là nền tảng phổ biến trong công nghiệp."],"children":["Lý thuyết điều khiển","Cảm biến","Cơ cấu chấp hành","PLC","Robot công nghiệp","Hệ nhúng"],"sub":[{"n":"Lý thuyết điều khiển","d":"Nghiên cứu cách điều khiển hành vi của hệ thống động học để đạt mục tiêu mong muốn.","k":"Điều khiển vòng hở không đo đầu ra; vòng kín dùng phản hồi để bù sai lệch. Ổn định, thời gian đáp ứng và độ vọt lố là các tiêu chí chính.","c":"Bộ điều khiển chỉnh tốt trong mô phỏng có thể dao động ngoài thực tế do trễ và nhiễu cảm biến.","e":"Chỉnh tham số PID cho lò nhiệt để đạt nhiệt độ đặt trong 5 phút với độ vọt lố dưới 2%."},{"n":"Cảm biến","d":"Thiết bị đo đại lượng vật lý như nhiệt độ, áp suất, vị trí, lưu lượng và chuyển thành tín hiệu điện.","k":"Chọn cảm biến theo dải đo, độ chính xác, thời gian đáp ứng và điều kiện môi trường.","c":"Lắp đặt sai vị trí hoặc không hiệu chuẩn định kỳ làm dữ liệu sai dù cảm biến tốt.","e":"Dùng encoder quang đo vị trí trục động cơ với độ phân giải 2.500 xung mỗi vòng."},{"n":"Cơ cấu chấp hành","d":"Bộ phận biến tín hiệu điều khiển thành chuyển động hoặc lực, như động cơ điện, xi lanh khí nén, van điều khiển.","k":"Chọn theo lực hoặc mô-men, tốc độ, độ chính xác và nguồn năng lượng sẵn có.","c":"Chọn cơ cấu vừa đủ tải danh định mà không tính tải khởi động và quán tính.","e":"Dùng động cơ servo cho trục định vị cần độ chính xác cao, xi lanh khí nén cho thao tác kẹp đơn giản."},{"n":"PLC","d":"Bộ điều khiển logic khả trình dùng trong công nghiệp, đọc tín hiệu vào, chạy chương trình và điều khiển đầu ra theo chu kỳ quét.","k":"Lập trình theo chuẩn IEC 61131-3 với các ngôn ngữ như Ladder, Function Block, Structured Text.","c":"Chương trình không có logic an toàn và xử lý lỗi cảm biến có thể gây vận hành nguy hiểm.","e":"PLC điều khiển trạm chiết rót: đọc cảm biến mức, mở van, đếm chai và dừng khi phát hiện kẹt."},{"n":"Robot công nghiệp","d":"Tay máy lập trình được, thực hiện thao tác lặp lại như hàn, sơn, gắp đặt, lắp ráp.","k":"Động học thuận và nghịch xác định vị trí đầu công tác từ góc khớp và ngược lại; robot cộng tác (cobot) làm việc gần người.","c":"Vùng làm việc của robot công nghiệp phải có rào chắn hoặc cảm biến an toàn theo tiêu chuẩn.","e":"Robot gắp đặt sản phẩm từ băng tải vào thùng với tốc độ 30 chu kỳ mỗi phút."},{"n":"Hệ nhúng","d":"Máy tính chuyên dụng tích hợp trong thiết bị để thực hiện chức năng cụ thể, thường có ràng buộc thời gian thực và tài nguyên hạn chế.","k":"Vi điều khiển, hệ điều hành thời gian thực (RTOS), giao tiếp ngoại vi như UART, SPI, I2C, CAN.","c":"Phần mềm nhúng khó cập nhật sau khi xuất xưởng; lỗi bảo mật trong thiết bị IoT tồn tại nhiều năm.","e":"Bộ điều khiển máy bán hàng tự động dùng vi điều khiển đọc cảm biến, điều khiển động cơ và kết nối máy chủ."}]},{"id":"systems","title":"Kỹ thuật hệ thống","summary":"Cách tiếp cận liên ngành để định nghĩa, phát triển và quản lý hệ thống phức tạp trong suốt vòng đời.","points":["Nhìn hệ thống như tổng thể các thành phần tương tác, không phải phép cộng các bộ phận.","Mô hình chữ V liên kết mỗi mức yêu cầu với một mức kiểm chứng tương ứng.","MBSE (Model-Based Systems Engineering) thay tài liệu rời rạc bằng mô hình thống nhất."],"children":["Vòng đời hệ thống","Mô hình chữ V","Phân rã yêu cầu","Quản lý giao diện","MBSE","Nghiên cứu đánh đổi (trade study)"],"sub":[{"n":"Vòng đời hệ thống","d":"Các giai đoạn của hệ thống từ ý tưởng, phát triển, sản xuất, vận hành, hỗ trợ đến thải bỏ.","k":"ISO/IEC/IEEE 15288 mô tả các quy trình vòng đời; chi phí vận hành và bảo trì thường lớn hơn chi phí phát triển.","c":"Chỉ tối ưu chi phí đầu tư ban đầu mà bỏ qua tổng chi phí sở hữu.","e":"Đánh giá phương án hệ thống thang máy theo tổng chi phí 20 năm, không chỉ giá mua."},{"n":"Mô hình chữ V","d":"Mô hình vòng đời liên kết mỗi mức phân rã yêu cầu và thiết kế với mức tích hợp và kiểm chứng tương ứng.","k":"Yêu cầu hệ thống ghép với kiểm thử hệ thống, yêu cầu phân hệ ghép với kiểm thử phân hệ, thiết kế thành phần ghép với kiểm thử thành phần.","c":"Chỉ chú trọng nhánh trái mà để kế hoạch kiểm chứng đến cuối dự án.","e":"Hệ thống tín hiệu đường sắt: yêu cầu an toàn cấp hệ thống được kiểm chứng bằng thử nghiệm tích hợp toàn tuyến."},{"n":"Phân rã yêu cầu","d":"Chia yêu cầu cấp hệ thống thành yêu cầu cho các phân hệ và thành phần, giữ khả năng truy vết.","k":"Mỗi yêu cầu con phải góp phần đáp ứng yêu cầu cha; phân bổ ngân sách hiệu năng như khối lượng, công suất, độ trễ.","c":"Phân bổ ngân sách mà không có dự phòng khiến phân hệ sau cùng không còn biên.","e":"Tổng thời gian phản hồi 2 giây được phân bổ: cảm biến 0,2 giây, truyền 0,5 giây, xử lý 1 giây, dự phòng 0,3 giây."},{"n":"Quản lý giao diện","d":"Xác định và kiểm soát ranh giới, luồng dữ liệu, năng lượng, lực giữa các phân hệ.","k":"Tài liệu kiểm soát giao diện (ICD) là hợp đồng giữa các nhóm; lỗi tích hợp phần lớn nằm ở giao diện.","c":"Thay đổi đơn phương ở một bên giao diện mà không thông báo bên kia.","e":"ICD giữa phân hệ nguồn và phân hệ điều khiển quy định điện áp, đầu nối, giao thức truyền thông."},{"n":"MBSE","d":"Kỹ thuật hệ thống dựa trên mô hình, dùng mô hình thống nhất (thường bằng SysML) thay cho tài liệu rời rạc.","k":"Một nguồn sự thật cho yêu cầu, cấu trúc, hành vi và tham số; thay đổi được lan truyền nhất quán.","c":"Chi phí công cụ và đào tạo cao; mô hình không được duy trì sẽ nhanh chóng lỗi thời.","e":"Mô hình SysML của hệ thống vệ tinh liên kết yêu cầu, sơ đồ khối và mô phỏng quỹ đạo năng lượng."},{"n":"Nghiên cứu đánh đổi (trade study)","d":"Phân tích có hệ thống các phương án dựa trên tiêu chí để chọn giải pháp cân bằng tốt nhất.","k":"Xác định tiêu chí, trọng số, dữ liệu cho từng phương án và phân tích độ nhạy.","c":"Chọn tiêu chí sau khi đã có phương án ưa thích làm kết quả bị thiên lệch.","e":"So sánh pin lithium và siêu tụ điện cho hệ thống lưu trữ theo mật độ năng lượng, tuổi thọ chu kỳ, chi phí và an toàn."}]},{"id":"materials","title":"Khoa học vật liệu","summary":"Mối quan hệ giữa cấu trúc, tính chất, quá trình gia công và hiệu năng của vật liệu.","points":["Chọn vật liệu là cân bằng giữa độ bền, khối lượng, chi phí và khả năng chịu môi trường.","Mỏi và ăn mòn là nguyên nhân của phần lớn sự cố kết cấu.","Vật liệu composite và bán dẫn là động lực của nhiều công nghệ mới."],"children":["Kim loại","Polyme","Gốm","Composite","Vật liệu bán dẫn","Mỏi và ăn mòn"],"sub":[{"n":"Kim loại","d":"Nhóm vật liệu có liên kết kim loại, dẫn điện và nhiệt tốt, dẻo, dễ gia công, như thép, nhôm, đồng.","k":"Tính chất phụ thuộc nhiều vào thành phần hợp kim và nhiệt luyện.","c":"Ghép hai kim loại khác nhau trong môi trường ẩm gây ăn mòn điện hóa.","e":"Chọn thép không gỉ 316 thay cho 304 cho thiết bị ven biển vì chống ăn mòn clorua tốt hơn."},{"n":"Polyme","d":"Vật liệu gồm chuỗi phân tử dài như nhựa nhiệt dẻo, nhựa nhiệt rắn, cao su.","k":"Nhẹ, dễ tạo hình, cách điện; tính chất thay đổi mạnh theo nhiệt độ.","c":"Nhựa bị lão hóa bởi tia UV và biến dạng từ từ dưới tải lâu dài (từ biến).","e":"Dùng nhựa ABS cho vỏ thiết bị trong nhà, nhựa ASA cho thiết bị ngoài trời vì chịu UV tốt hơn."},{"n":"Gốm","d":"Vật liệu vô cơ phi kim như gốm sứ, thủy tinh, gốm kỹ thuật; cứng, chịu nhiệt, chịu mài mòn.","k":"Chịu nén rất tốt nhưng giòn, dễ vỡ khi chịu kéo hoặc va đập.","c":"Thiết kế chi tiết gốm cần tránh góc nhọn tập trung ứng suất và sốc nhiệt.","e":"Dùng gốm alumina làm đế cách điện chịu nhiệt trong linh kiện điện tử công suất."},{"n":"Composite","d":"Vật liệu kết hợp hai hoặc nhiều thành phần để đạt tính chất vượt trội, như sợi carbon trong nhựa epoxy.","k":"Tỷ lệ độ bền trên khối lượng rất cao; tính chất phụ thuộc hướng sợi.","c":"Hư hỏng bên trong như tách lớp khó phát hiện bằng mắt; sửa chữa và tái chế phức tạp.","e":"Cánh quạt tuabin gió làm bằng composite sợi thủy tinh để nhẹ mà vẫn đủ cứng."},{"n":"Vật liệu bán dẫn","d":"Vật liệu có độ dẫn điện nằm giữa kim loại và chất cách điện, điều khiển được bằng pha tạp, như silicon.","k":"Là nền của transistor, vi mạch, pin mặt trời, LED; các vật liệu thế hệ mới như SiC, GaN cho điện tử công suất.","c":"Sản xuất đòi hỏi độ tinh khiết và môi trường phòng sạch rất cao.","e":"Linh kiện GaN cho bộ sạc nhỏ gọn hơn nhờ chuyển mạch ở tần số cao với tổn hao thấp."},{"n":"Mỏi và ăn mòn","d":"Mỏi là hỏng do tải lặp nhiều chu kỳ dưới giới hạn bền; ăn mòn là suy giảm vật liệu do phản ứng với môi trường.","k":"Mỏi thường bắt đầu từ điểm tập trung ứng suất; ăn mòn được chống bằng lớp phủ, chọn vật liệu, bảo vệ catot.","c":"Hai cơ chế cộng hưởng nhau (ăn mòn mỏi) làm tuổi thọ giảm nhanh hơn từng cơ chế riêng lẻ.","e":"Kiểm tra định kỳ mối hàn của kết cấu cầu bằng siêu âm để phát hiện vết nứt mỏi sớm."}]},{"id":"measurement","title":"Đo lường và chất lượng","summary":"Khoa học đo lường và hệ thống bảo đảm sản phẩm đạt yêu cầu một cách ổn định.","points":["Mọi phép đo đều có sai số và độ không đảm bảo.","Hiệu chuẩn (calibration) giữ khả năng truy xuất về chuẩn quốc gia và quốc tế.","Kiểm soát quá trình bằng thống kê (SPC) phát hiện biến động trước khi sinh lỗi."],"children":["Hệ đơn vị SI","Sai số và độ không đảm bảo","Hiệu chuẩn","SPC","Six Sigma","ISO 9001"],"sub":[{"n":"Hệ đơn vị SI","d":"Hệ đơn vị quốc tế gồm 7 đơn vị cơ bản: mét, kilôgam, giây, ampe, kelvin, mol, candela.","k":"Từ năm 2019, các đơn vị cơ bản được định nghĩa qua các hằng số vật lý cố định.","c":"Nhầm lẫn đơn vị giữa các nhóm hoặc hệ thống có thể gây sự cố nghiêm trọng.","e":"Chuẩn hóa mọi tài liệu kỹ thuật dùng đơn vị SI, ghi rõ đơn vị trên từng cột số liệu."},{"n":"Sai số và độ không đảm bảo","d":"Sai số là chênh lệch giữa giá trị đo và giá trị thực; độ không đảm bảo là khoảng nghi ngờ quanh kết quả đo.","k":"Sai số hệ thống lệch về một phía, sai số ngẫu nhiên phân tán; độ không đảm bảo được đánh giá theo hướng dẫn GUM.","c":"Báo cáo kết quả đo không kèm độ không đảm bảo thì không đủ cơ sở để so sánh với dung sai.","e":"Kết quả đo 25,02 mm ± 0,01 mm (k=2) cho phép kết luận chi tiết đạt dung sai 25,00 ± 0,05 mm."},{"n":"Hiệu chuẩn","d":"So sánh thiết bị đo với chuẩn có độ chính xác cao hơn để xác định sai số và điều chỉnh nếu cần.","k":"Chuỗi truy xuất nguồn gốc đo lường nối thiết bị tới chuẩn quốc gia và quốc tế.","c":"Hiệu chuẩn quá hạn làm mọi kết quả đo từ thời điểm đó bị nghi ngờ.","e":"Cân điện tử trong phòng thí nghiệm được hiệu chuẩn 12 tháng một lần bằng quả cân chuẩn."},{"n":"SPC","d":"Kiểm soát quá trình bằng thống kê, dùng biểu đồ kiểm soát để phân biệt biến động thông thường và biến động bất thường.","k":"Điểm vượt giới hạn kiểm soát hoặc chuỗi điểm có xu hướng là tín hiệu cần điều tra nguyên nhân đặc biệt.","c":"Giới hạn kiểm soát tính từ dữ liệu quá trình, khác với giới hạn dung sai từ bản vẽ.","e":"Biểu đồ X-bar và R theo dõi đường kính chi tiết tiện; 7 điểm liên tiếp tăng báo hiệu dao mòn."},{"n":"Six Sigma","d":"Phương pháp cải tiến dựa trên dữ liệu nhằm giảm biến động và khuyết tật, theo chu trình DMAIC: Define, Measure, Analyze, Improve, Control.","k":"Mục tiêu lý tưởng là 3,4 lỗi trên một triệu cơ hội; kết hợp với Lean để loại bỏ lãng phí.","c":"Áp dụng như một chương trình phong trào không gắn với vấn đề kinh doanh thực sẽ nhanh chóng mất động lực.","e":"Dự án DMAIC giảm tỷ lệ sản phẩm lỗi đóng gói từ 2% xuống 0,3% trong 6 tháng."},{"n":"ISO 9001","d":"Tiêu chuẩn quốc tế về hệ thống quản lý chất lượng, áp dụng cho mọi loại tổ chức.","k":"Dựa trên cách tiếp cận quá trình, tư duy dựa trên rủi ro và chu trình PDCA; có thể được chứng nhận bởi tổ chức độc lập.","c":"Làm hồ sơ chỉ để qua đánh giá mà không thay đổi cách vận hành là thất bại phổ biến.","e":"Nhà máy thiết lập quy trình kiểm soát thay đổi thiết kế và đánh giá nhà cung cấp theo ISO 9001."}]},{"id":"safety","title":"An toàn và đạo đức kỹ thuật","summary":"Nguyên tắc bảo vệ con người và môi trường, cùng trách nhiệm nghề nghiệp của kỹ sư.","points":["Phân tích rủi ro như FMEA và HAZOP được thực hiện ngay từ khâu thiết kế.","An toàn chức năng (functional safety) áp dụng cho hệ thống điều khiển có thể gây nguy hiểm.","Kỹ sư có trách nhiệm đặt an toàn công chúng lên trên lợi ích thương mại."],"children":["FMEA","HAZOP","An toàn chức năng","An toàn lao động","Đạo đức nghề nghiệp","Phát triển bền vững"],"sub":[{"n":"FMEA","d":"Phân tích dạng hỏng và tác động: liệt kê cách mỗi thành phần có thể hỏng, hậu quả và nguyên nhân, để ưu tiên biện pháp.","k":"Truyền thống dùng chỉ số RPN = mức nghiêm trọng × khả năng xảy ra × khả năng phát hiện; phương pháp AIAG-VDA dùng mức ưu tiên hành động (AP).","c":"Chỉ tối ưu con số RPN dễ bỏ qua dạng hỏng nghiêm trọng nhưng hiếm gặp.","e":"FMEA cho van điều áp xác định dạng hỏng ‘kẹt mở’ có mức nghiêm trọng cao, bổ sung van an toàn dự phòng."},{"n":"HAZOP","d":"Phân tích nguy hiểm và khả năng vận hành: nhóm liên ngành rà soát từng đoạn quy trình bằng từ hướng dẫn như ‘không có’, ‘nhiều hơn’, ‘ít hơn’.","k":"Phổ biến trong công nghiệp hóa chất, dầu khí; phát hiện sai lệch khỏi ý định thiết kế và hậu quả.","c":"Phụ thuộc lớn vào kinh nghiệm của nhóm và chất lượng bản vẽ công nghệ (P&ID).","e":"Từ hướng dẫn ‘lưu lượng nhiều hơn’ tại đường cấp nguyên liệu phát hiện nguy cơ tràn bồn, bổ sung báo mức cao."},{"n":"An toàn chức năng","d":"Phần an toàn của hệ thống phụ thuộc vào việc hệ thống điều khiển hoạt động đúng khi có tín hiệu nguy hiểm.","k":"IEC 61508 và các tiêu chuẩn ngành định nghĩa mức toàn vẹn an toàn (SIL) từ 1 đến 4 theo mức giảm rủi ro cần đạt.","c":"Hệ thống an toàn phải độc lập với hệ thống điều khiển thông thường; dùng chung cảm biến làm mất tính độc lập.","e":"Hệ thống dừng khẩn lò hơi đạt SIL 2 dùng cảm biến áp suất và van ngắt riêng biệt."},{"n":"An toàn lao động","d":"Biện pháp bảo vệ người lao động khỏi tai nạn và bệnh nghề nghiệp.","k":"Thứ bậc kiểm soát: loại bỏ, thay thế, kiểm soát kỹ thuật, kiểm soát hành chính, trang bị bảo hộ cá nhân.","c":"Dựa chủ yếu vào trang bị bảo hộ, lớp kiểm soát yếu nhất, thay vì loại bỏ nguy hiểm từ gốc.","e":"Lắp che chắn và khóa liên động cho máy cắt thay vì chỉ yêu cầu công nhân đeo găng tay."},{"n":"Đạo đức nghề nghiệp","d":"Chuẩn mực hành xử của kỹ sư: đặt an toàn, sức khỏe và phúc lợi công chúng lên hàng đầu, trung thực và làm việc trong phạm vi năng lực.","k":"Các hiệp hội nghề nghiệp như NSPE, IEEE có bộ quy tắc đạo đức; kỹ sư có trách nhiệm lên tiếng khi phát hiện rủi ro.","c":"Áp lực tiến độ và chi phí là nguồn gốc phổ biến của các quyết định vi phạm đạo đức.","e":"Kỹ sư từ chối ký nghiệm thu khi kết quả thử tải chưa đạt dù chủ đầu tư yêu cầu bàn giao đúng hạn."},{"n":"Phát triển bền vững","d":"Thiết kế và vận hành đáp ứng nhu cầu hiện tại mà không làm tổn hại khả năng đáp ứng nhu cầu của thế hệ sau.","k":"Đánh giá vòng đời (LCA) đo tác động môi trường từ khai thác nguyên liệu đến thải bỏ; thiết kế cho tái chế và tiết kiệm năng lượng.","c":"Tuyên bố ‘xanh’ không có số liệu đo lường dễ bị coi là tẩy xanh (greenwashing).","e":"Chọn vật liệu cách nhiệt có hàm lượng tái chế cao và tính toán giảm phát thải CO2 theo vòng đời công trình."}]}],"concepts":[{"term":"Ràng buộc thiết kế (Design constraint)","def":"Giới hạn mà giải pháp bắt buộc phải tuân thủ, như chi phí, khối lượng, kích thước hay quy chuẩn.","ex":"Cầu đi bộ phải chịu tải tối thiểu theo quy chuẩn và nằm trong ngân sách được duyệt.","mis":"Ràng buộc chỉ là yếu tố cản trở. Thực tế ràng buộc định hướng và thu hẹp không gian thiết kế một cách có ích."},{"term":"Hệ số an toàn (Factor of safety)","def":"Tỷ số giữa khả năng chịu tải thực tế của kết cấu và tải trọng thiết kế dự kiến.","ex":"Dầm chịu được 30 kN cho tải dự kiến 10 kN có hệ số an toàn bằng 3.","mis":"Hệ số càng lớn càng tốt. Hệ số quá lớn làm tăng khối lượng và chi phí không cần thiết."},{"term":"Ứng suất và biến dạng (Stress, Strain)","def":"Ứng suất là lực tác dụng trên một đơn vị diện tích; biến dạng là mức thay đổi hình dạng tương đối của vật liệu.","ex":"Thanh thép bị kéo dài thêm 0,1% khi chịu ứng suất kéo.","mis":"Vật liệu cứng thì luôn bền. Độ cứng, độ bền và độ dai là ba tính chất khác nhau."},{"term":"Vòng điều khiển phản hồi (Feedback loop)","def":"Cơ chế đo đầu ra, so sánh với giá trị mong muốn rồi điều chỉnh đầu vào.","ex":"Máy lạnh đo nhiệt độ phòng rồi bật, tắt máy nén để giữ 25 độ C.","mis":"Phản hồi càng mạnh thì đáp ứng càng tốt. Hệ số khuếch đại quá lớn gây dao động và mất ổn định."},{"term":"Bộ điều khiển PID","def":"Bộ điều khiển kết hợp ba thành phần tỷ lệ (P), tích phân (I) và vi phân (D) của sai lệch.","ex":"Điều khiển tốc độ băng tải giữ ổn định khi tải trọng thay đổi.","mis":"PID là thuật toán lỗi thời. PID vẫn là bộ điều khiển được dùng phổ biến nhất trong công nghiệp."},{"term":"Mô hình chữ V (V-model)","def":"Mô hình vòng đời trong đó nhánh trái phân rã yêu cầu và thiết kế, nhánh phải tích hợp và kiểm chứng ở mức tương ứng.","ex":"Yêu cầu cấp hệ thống được kiểm chứng bằng kiểm thử hệ thống; thiết kế thành phần được kiểm chứng bằng kiểm thử thành phần.","mis":"Mô hình chữ V buộc làm tuần tự cứng nhắc. Nó có thể áp dụng lặp theo từng phiên bản."},{"term":"Kiểm chứng và thẩm định (Verification và Validation)","def":"Kiểm chứng trả lời câu hỏi ‘làm đúng đặc tả chưa’; thẩm định trả lời câu hỏi ‘làm đúng thứ người dùng cần chưa’.","ex":"Máy bơm đạt đúng thông số kỹ thuật (kiểm chứng đạt) nhưng không phù hợp nhu cầu tưới tiêu thực tế (thẩm định không đạt).","mis":"Hai khái niệm là một. Nhầm lẫn khiến dự án đạt thông số nhưng không tạo ra giá trị."},{"term":"FMEA (Failure Mode and Effects Analysis)","def":"Phương pháp phân tích các dạng hỏng có thể xảy ra, tác động và nguyên nhân của chúng để ưu tiên biện pháp phòng ngừa.","ex":"Đánh giá rủi ro cảm biến áp suất báo sai trên dây chuyền và bổ sung cảm biến dự phòng.","mis":"FMEA làm một lần là xong. FMEA cần cập nhật khi thiết kế hoặc điều kiện vận hành thay đổi."},{"term":"Độ không đảm bảo đo (Measurement uncertainty)","def":"Khoảng giá trị mà giá trị thực của đại lượng đo được kỳ vọng nằm trong đó, kèm một mức tin cậy.","ex":"Chiều dài 100,0 mm ± 0,2 mm với độ tin cậy 95%.","mis":"Thiết bị đắt tiền thì không có sai số. Mọi phép đo đều có độ không đảm bảo."},{"term":"Đánh đổi (Trade-off)","def":"Chấp nhận giảm một thuộc tính để cải thiện một thuộc tính khác có giá trị hơn trong bối cảnh cụ thể.","ex":"Dùng hợp kim nhôm giảm khối lượng nhưng tăng chi phí so với thép.","mis":"Luôn có giải pháp tối ưu mọi mặt. Kỹ thuật luôn là bài toán cân bằng có chủ đích."}],"path":{"foundation":{"goal":"Hiểu ngôn ngữ chung của kỹ thuật.","topics":["Giải tích và đại số tuyến tính","Vật lý đại cương","Vẽ kỹ thuật và đọc bản vẽ","Quy trình thiết kế kỹ thuật"],"signal":"Đọc được bản vẽ cơ bản và giải thích quy trình thiết kế bằng một ví dụ cụ thể."},"intermediate":{"goal":"Phân tích được bài toán chuyên ngành.","topics":["Cơ học, mạch điện hoặc nhiệt động (theo chuyên ngành)","Công cụ CAD/CAE","Đo lường và xử lý số liệu","Vật liệu kỹ thuật"],"signal":"Tự tính toán và mô phỏng một chi tiết hoặc mạch đơn giản, giải thích được kết quả."},"advanced":{"goal":"Thiết kế hệ thống hoàn chỉnh trong ràng buộc thực tế.","topics":["Kỹ thuật hệ thống và quản lý yêu cầu","Điều khiển và tự động hóa","Phân tích rủi ro FMEA, HAZOP","Quản lý chất lượng"],"signal":"Dẫn dắt thiết kế một sản phẩm từ yêu cầu đến nghiệm thu."},"expert":{"goal":"Định hướng kỹ thuật và chịu trách nhiệm nghề nghiệp.","topics":["Kiến trúc hệ thống phức tạp","An toàn chức năng","Chuẩn hóa và pháp quy","Đạo đức và phát triển bền vững"],"signal":"Ký duyệt thiết kế, dẫn dắt đánh giá an toàn và đào tạo kỹ sư khác."}},"standards":[{"name":"ISO 9001:2015","note":"Hệ thống quản lý chất lượng.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC/IEEE 15288:2023","note":"Quy trình vòng đời hệ thống.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"IEC 61508","note":"An toàn chức năng cho hệ thống điện, điện tử và điện tử khả trình.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO 45001:2018","note":"Hệ thống quản lý an toàn và sức khỏe nghề nghiệp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO 14001:2015","note":"Hệ thống quản lý môi trường.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"INCOSE Systems Engineering Handbook, ấn bản 5 (2023)","note":"Cẩm nang thực hành kỹ thuật hệ thống.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"tools":[{"group":"Thiết kế CAD","items":["AutoCAD","SolidWorks","CATIA","Fusion 360"]},{"group":"Mô phỏng CAE","items":["ANSYS","Abaqus","COMSOL Multiphysics"]},{"group":"Tính toán kỹ thuật","items":["MATLAB và Simulink","Python (NumPy, SciPy)"]},{"group":"Điện – điện tử","items":["KiCad","Altium Designer","LTspice"]},{"group":"Tự động hóa","items":["Siemens TIA Portal","CODESYS"]},{"group":"Mô hình hóa hệ thống","items":["SysML","Cameo Systems Modeler"]}],"certs":[{"name":"PE (Professional Engineer)","note":"Giấy phép kỹ sư hành nghề tại Mỹ.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"CEng (Chartered Engineer)","note":"Danh hiệu kỹ sư chuyên nghiệp tại Vương quốc Anh.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"INCOSE ASEP / CSEP","note":"Chứng chỉ kỹ thuật hệ thống.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Lean Six Sigma Green Belt / Black Belt","note":"Cải tiến chất lượng và quy trình.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Chứng chỉ hành nghề hoạt động xây dựng","note":"Do cơ quan quản lý xây dựng tại Việt Nam cấp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Kỹ sư thiết kế cơ khí","skills":"CAD, sức bền vật liệu, dung sai lắp ghép"},{"role":"Kỹ sư điện – điện tử","skills":"Thiết kế mạch, PCB, đo kiểm"},{"role":"Kỹ sư tự động hóa","skills":"PLC, SCADA, lý thuyết điều khiển"},{"role":"Kỹ sư kết cấu","skills":"Tính toán kết cấu, quy chuẩn xây dựng"},{"role":"Kỹ sư hệ thống","skills":"Quản lý yêu cầu, mô hình hóa, V&V"},{"role":"Kỹ sư chất lượng","skills":"SPC, FMEA, ISO 9001"}],"glossary":[["Tolerance","Dung sai","Khoảng sai lệch cho phép của một kích thước."],["Load","Tải trọng","Lực hoặc tác động mà kết cấu phải chịu."],["Fatigue","Mỏi vật liệu","Hỏng do tải lặp lại nhiều chu kỳ dù dưới giới hạn bền."],["Actuator","Cơ cấu chấp hành","Bộ phận biến tín hiệu điều khiển thành chuyển động hoặc tác động."],["Sensor","Cảm biến","Thiết bị đo đại lượng vật lý và chuyển thành tín hiệu."],["Calibration","Hiệu chuẩn","So sánh thiết bị đo với chuẩn để xác định sai số."],["Prototype","Mẫu thử","Phiên bản sớm dùng để kiểm tra ý tưởng."],["Specification","Đặc tả kỹ thuật","Tài liệu mô tả yêu cầu và thông số bắt buộc."],["Redundancy","Dự phòng","Thành phần bổ sung để hệ thống vẫn hoạt động khi một phần hỏng."],["Commissioning","Chạy thử nghiệm thu","Kiểm tra hệ thống vận hành đúng trước khi bàn giao."]],"quiz":[{"q":"Kiểm chứng (verification) trả lời câu hỏi nào?","o":["Có làm đúng thứ người dùng cần không","Có làm đúng theo đặc tả không","Chi phí có nằm trong ngân sách không","Ai là người ký duyệt"],"a":1,"e":"Verification kiểm tra sản phẩm có đúng đặc tả hay không; validation mới kiểm tra sản phẩm có đáp ứng nhu cầu thực tế."},{"q":"Hệ số an toàn bằng 2 có nghĩa là gì?","o":["Kết cấu chịu được gấp đôi tải thiết kế","Kết cấu chỉ chịu được một nửa tải thiết kế","Xác suất hỏng là 2%","Tuổi thọ gấp đôi dự kiến"],"a":0,"e":"Hệ số an toàn là tỷ số giữa khả năng chịu tải và tải thiết kế, nên bằng 2 nghĩa là chịu được gấp đôi."},{"q":"Trong bộ điều khiển PID, thành phần tích phân (I) chủ yếu giúp gì?","o":["Loại bỏ sai lệch tĩnh kéo dài","Dự báo xu hướng thay đổi của sai lệch","Tăng tốc độ lấy mẫu","Lọc nhiễu cảm biến"],"a":0,"e":"Thành phần I tích lũy sai lệch theo thời gian nên triệt tiêu sai lệch xác lập; thành phần D mới phản ứng với tốc độ thay đổi."},{"q":"FMEA được thực hiện hiệu quả nhất khi nào?","o":["Sau khi sự cố đã xảy ra","Từ giai đoạn thiết kế và cập nhật trong suốt vòng đời","Chỉ khi có kiểm toán","Chỉ khi thay nhà cung cấp"],"a":1,"e":"FMEA là công cụ phòng ngừa, có giá trị nhất khi áp dụng sớm và duy trì cập nhật."},{"q":"Mô hình chữ V liên kết những gì với nhau?","o":["Chi phí và tiến độ","Mỗi mức yêu cầu hoặc thiết kế với mức kiểm chứng tương ứng","Nhà cung cấp và khách hàng","Phần cứng và phần mềm"],"a":1,"e":"Nhánh trái phân rã yêu cầu, nhánh phải kiểm chứng ở cùng mức trừu tượng."}],"links":[{"to":"se","why":"Mô hình chữ V và quản lý yêu cầu được dùng chung trong phát triển phần mềm."},{"to":"cs","why":"Điện tử số và kiến trúc máy tính là cầu nối giữa phần cứng và khoa học máy tính."},{"to":"sec","why":"Hệ thống điều khiển công nghiệp (OT/ICS) cần các biện pháp an ninh riêng."}]},{"id":"cs","code":"IV.2","title":"Computer Science","vi":"Khoa học máy tính","summary":"Khoa học máy tính (Computer Science) nghiên cứu nền tảng lý thuyết của tính toán và thông tin, cùng các kỹ thuật thiết kế thuật toán, ngôn ngữ và hệ thống để hiện thực chúng trên máy tính.","diff":["Khác Software Engineering: khoa học máy tính trả lời ‘bài toán có giải được không và giải hiệu quả đến đâu’; kỹ nghệ phần mềm trả lời ‘xây phần mềm đáng tin cậy, đúng hạn và bảo trì được như thế nào’.","Khác IT: IT vận hành và khai thác hệ thống cho tổ chức; khoa học máy tính tạo ra nền tảng lý thuyết và kỹ thuật cho chính các hệ thống đó.","AI và khoa học dữ liệu là các nhánh phát triển mạnh từ khoa học máy tính, kết hợp với toán thống kê."],"topics":[{"id":"discrete","title":"Toán rời rạc","summary":"Ngôn ngữ toán học của tin học: logic, tập hợp, tổ hợp và đồ thị.","points":["Logic mệnh đề và logic vị từ là cơ sở để chứng minh tính đúng của chương trình.","Lý thuyết đồ thị mô hình hóa mạng lưới, quan hệ phụ thuộc và lộ trình.","Quy nạp toán học tương ứng trực tiếp với tư duy đệ quy."],"children":["Logic","Tập hợp và quan hệ","Tổ hợp","Lý thuyết đồ thị","Quy nạp","Lý thuyết số"],"sub":[{"n":"Logic","d":"Hệ thống suy luận hình thức với mệnh đề, phép toán logic (và, hoặc, phủ định, kéo theo) và lượng từ (với mọi, tồn tại).","k":"Bảng chân trị và luật De Morgan là công cụ cơ bản; logic vị từ cho phép phát biểu chính xác đặc tả chương trình.","c":"Nhầm ‘kéo theo’ với ‘tương đương’: A kéo theo B không có nghĩa B kéo theo A.","e":"Viết lại điều kiện if phức tạp bằng luật De Morgan: not (a and b) tương đương (not a) or (not b)."},{"n":"Tập hợp và quan hệ","d":"Tập hợp là nhóm phần tử phân biệt; quan hệ là tập con của tích Descartes, có các tính chất phản xạ, đối xứng, bắc cầu.","k":"Quan hệ tương đương chia tập thành các lớp; quan hệ thứ tự là nền của sắp xếp; hàm là quan hệ đặc biệt.","c":"Cơ sở dữ liệu quan hệ được xây trên lý thuyết tập hợp; hiểu tập hợp giúp viết SQL đúng.","e":"Phân nhóm giao dịch theo cùng mã khách hàng là phân hoạch tập giao dịch theo một quan hệ tương đương."},{"n":"Tổ hợp","d":"Nghiên cứu cách đếm: hoán vị, chỉnh hợp, tổ hợp, nguyên lý cộng, nguyên lý nhân, nguyên lý chuồng bồ câu.","k":"Dùng để ước lượng không gian tìm kiếm, xác suất và độ phức tạp thuật toán.","c":"Nhầm lẫn giữa có thứ tự và không thứ tự, có lặp và không lặp là lỗi đếm thường gặp.","e":"Mã PIN 6 chữ số có 10^6 khả năng; từ đó đánh giá cần khóa tài khoản sau bao nhiêu lần nhập sai."},{"n":"Lý thuyết đồ thị","d":"Đồ thị gồm đỉnh và cạnh, mô hình hóa quan hệ như mạng lưới, phụ thuộc, lộ trình.","k":"Các khái niệm: bậc, đường đi, chu trình, cây, đồ thị có hướng, đồ thị có trọng số, thành phần liên thông.","c":"Chọn biểu diễn phù hợp: ma trận kề cho đồ thị dày, danh sách kề cho đồ thị thưa.","e":"Mô hình phụ thuộc giữa các job ETL là đồ thị có hướng không chu trình (DAG) để xác định thứ tự chạy."},{"n":"Quy nạp","d":"Phương pháp chứng minh mệnh đề đúng với mọi số tự nhiên: chứng minh trường hợp cơ sở và bước quy nạp.","k":"Tương ứng trực tiếp với đệ quy và với việc chứng minh bất biến vòng lặp.","c":"Quên chứng minh trường hợp cơ sở hoặc bước quy nạp dựa trên giả thiết quá mạnh làm chứng minh sai.","e":"Chứng minh thuật toán sắp xếp chèn đúng bằng bất biến: sau bước k, k phần tử đầu đã được sắp xếp."},{"n":"Lý thuyết số","d":"Nghiên cứu tính chất số nguyên: chia hết, số nguyên tố, ước chung lớn nhất, đồng dư.","k":"Là nền của mật mã học (RSA), hàm băm và mã kiểm tra lỗi.","c":"Phép toán số lớn cần thư viện chuyên dụng; tràn số nguyên là lỗi bảo mật phổ biến.","e":"Số kiểm tra (check digit) của số tài khoản hoặc mã vạch dùng phép đồng dư để phát hiện lỗi nhập."}]},{"id":"dsa","title":"Cấu trúc dữ liệu và giải thuật","summary":"Cách tổ chức dữ liệu và các phương pháp giải bài toán hiệu quả.","points":["Lựa chọn cấu trúc dữ liệu thường ảnh hưởng hiệu năng nhiều hơn việc tối ưu từng dòng mã.","Các chiến lược kinh điển: chia để trị, quy hoạch động, tham lam, quay lui.","Bảng băm, cây và heap là ba cấu trúc được dùng nhiều nhất trong thực tế."],"children":["Mảng và danh sách liên kết","Ngăn xếp và hàng đợi","Bảng băm","Cây và cây cân bằng","Heap","Sắp xếp và tìm kiếm","Quy hoạch động","Thuật toán đồ thị"],"sub":[{"n":"Mảng và danh sách liên kết","d":"Mảng lưu phần tử liên tiếp trong bộ nhớ, truy cập theo chỉ số O(1); danh sách liên kết nối các nút bằng con trỏ, chèn xóa O(1) khi biết vị trí.","k":"Mảng thân thiện với cache nên thực tế thường nhanh hơn danh sách liên kết cả khi lý thuyết tương đương.","c":"Chèn vào giữa mảng lớn tốn O(n) do phải dịch phần tử.","e":"Danh sách giao dịch trong ngày lưu bằng mảng động để duyệt nhanh khi xuất báo cáo."},{"n":"Ngăn xếp và hàng đợi","d":"Ngăn xếp: vào sau ra trước (LIFO). Hàng đợi: vào trước ra trước (FIFO).","k":"Ngăn xếp dùng cho lời gọi hàm, hoàn tác, duyệt sâu; hàng đợi dùng cho xử lý tuần tự, duyệt rộng, bộ đệm.","c":"Hàng đợi không giới hạn có thể làm cạn bộ nhớ khi bên nhận chậm hơn bên gửi.","e":"Hàng đợi tin nhắn xử lý yêu cầu gửi SMS OTP theo đúng thứ tự tiếp nhận."},{"n":"Bảng băm","d":"Cấu trúc ánh xạ khóa sang giá trị qua hàm băm, truy cập trung bình O(1).","k":"Xử lý xung đột bằng chuỗi (chaining) hoặc dò địa chỉ mở; hệ số tải cao làm hiệu năng giảm.","c":"Hàm băm kém hoặc đầu vào do kẻ tấn công chọn có thể đẩy hiệu năng về O(n).","e":"Bộ nhớ đệm tỷ giá theo mã tiền tệ dùng bảng băm để tra cứu tức thì."},{"n":"Cây và cây cân bằng","d":"Cây là đồ thị liên thông không chu trình; cây nhị phân tìm kiếm giữ khóa có thứ tự; cây cân bằng (AVL, đỏ đen, B-tree) giữ chiều cao O(log n).","k":"B-tree và B+ tree là cấu trúc chỉ mục của hầu hết hệ quản trị cơ sở dữ liệu.","c":"Cây nhị phân tìm kiếm không cân bằng suy biến thành danh sách khi chèn dữ liệu đã sắp xếp.","e":"Chỉ mục B+ tree trên cột ngày giao dịch cho phép truy vấn theo khoảng thời gian nhanh."},{"n":"Heap","d":"Cây nhị phân gần đầy đủ thỏa tính chất heap: nút cha luôn lớn hơn (hoặc nhỏ hơn) nút con.","k":"Lấy phần tử lớn nhất hoặc nhỏ nhất O(1), chèn và xóa O(log n); là cài đặt chuẩn của hàng đợi ưu tiên.","c":"Heap không hỗ trợ tìm kiếm phần tử bất kỳ nhanh.","e":"Hàng đợi ưu tiên xử lý sự cố: sự cố mức nghiêm trọng cao luôn được lấy ra trước."},{"n":"Sắp xếp và tìm kiếm","d":"Các thuật toán sắp xếp (quicksort, mergesort, heapsort) và tìm kiếm (tuyến tính, nhị phân).","k":"Sắp xếp so sánh tối ưu là O(n log n); tìm kiếm nhị phân O(log n) nhưng yêu cầu dữ liệu đã sắp xếp.","c":"Thuật toán ổn định giữ thứ tự các phần tử bằng nhau; điều này quan trọng khi sắp xếp nhiều cột.","e":"Sắp xếp danh sách nhân viên theo phòng ban rồi theo tên bằng thuật toán ổn định."},{"n":"Quy hoạch động","d":"Kỹ thuật giải bài toán bằng cách chia thành bài toán con chồng lấp và lưu kết quả để tái sử dụng.","k":"Hai cách: từ trên xuống có ghi nhớ (memoization) và từ dưới lên bằng bảng (tabulation).","c":"Khó nhất là xác định đúng trạng thái và công thức truy hồi; không gian trạng thái lớn có thể vượt bộ nhớ.","e":"Tính số cách tối thiểu dùng mệnh giá tiền để trả một khoản, bài toán đổi tiền kinh điển."},{"n":"Thuật toán đồ thị","d":"Thuật toán trên đồ thị: duyệt BFS, DFS, đường đi ngắn nhất (Dijkstra, Bellman-Ford), cây khung nhỏ nhất (Prim, Kruskal), sắp xếp tô-pô.","k":"Chọn thuật toán theo đặc điểm đồ thị: có trọng số âm, có hướng, thưa hay dày.","c":"Dijkstra không đúng khi có cạnh trọng số âm.","e":"Sắp xếp tô-pô đồ thị phụ thuộc giữa các bảng để xác định thứ tự nạp dữ liệu khi migration."}]},{"id":"complexity","title":"Độ phức tạp tính toán","summary":"Đo lường tài nguyên thời gian và bộ nhớ mà thuật toán cần theo kích thước đầu vào.","points":["Ký hiệu Big-O mô tả tốc độ tăng, không phải thời gian chạy tuyệt đối.","Lớp P và NP phân biệt bài toán giải nhanh với bài toán kiểm tra lời giải nhanh.","Nhiều bài toán thực tế là NP-khó nên cần heuristic hoặc thuật toán xấp xỉ."],"children":["Big-O, Big-Theta, Big-Omega","Trường hợp xấu nhất và trung bình","Lớp P và NP","NP-đầy đủ","Thuật toán xấp xỉ"],"sub":[{"n":"Big-O, Big-Theta, Big-Omega","d":"Big-O là cận trên, Big-Omega là cận dưới, Big-Theta là cận chặt của tốc độ tăng chi phí theo kích thước đầu vào.","k":"Bỏ qua hằng số và số hạng bậc thấp; các lớp phổ biến: O(1), O(log n), O(n), O(n log n), O(n²), O(2^n).","c":"Big-O mô tả xu hướng khi n lớn, không cho biết thời gian chạy thực với dữ liệu nhỏ.","e":"Truy vấn lồng hai vòng lặp trên 100.000 bản ghi là O(n²), khoảng 10 tỷ phép so sánh; nên dùng join với chỉ mục."},{"n":"Trường hợp xấu nhất và trung bình","d":"Phân tích chi phí thuật toán với đầu vào bất lợi nhất và với đầu vào trung bình theo một phân phối.","k":"Quicksort trung bình O(n log n) nhưng xấu nhất O(n²); hệ thống yêu cầu thời gian thực cần quan tâm trường hợp xấu nhất.","c":"Chi phí khấu hao (amortized) khác trung bình: mảng động thỉnh thoảng mở rộng tốn O(n) nhưng khấu hao mỗi lần thêm là O(1).","e":"Chọn thuật toán có trường hợp xấu nhất tốt cho hệ thống phê duyệt giao dịch có yêu cầu độ trễ nghiêm ngặt."},{"n":"Lớp P và NP","d":"P là lớp bài toán giải được trong thời gian đa thức; NP là lớp bài toán mà lời giải kiểm tra được trong thời gian đa thức.","k":"P có bằng NP không là câu hỏi mở lớn nhất của khoa học máy tính.","c":"NP không có nghĩa là ‘không đa thức’; mọi bài toán thuộc P cũng thuộc NP.","e":"Kiểm tra một lịch làm việc có thỏa mọi ràng buộc là nhanh, nhưng tìm lịch tối ưu có thể rất khó."},{"n":"NP-đầy đủ","d":"Bài toán thuộc NP mà mọi bài toán NP khác đều quy dẫn về được trong thời gian đa thức.","k":"Ví dụ kinh điển: SAT, tô màu đồ thị, người du lịch dạng quyết định, xếp ba lô dạng quyết định.","c":"Nhận ra bài toán là NP-đầy đủ giúp tránh tìm thuật toán tối ưu nhanh, và chuyển sang heuristic hoặc xấp xỉ.","e":"Bài toán xếp ca trực với nhiều ràng buộc là NP-khó nên dùng solver ràng buộc hoặc heuristic."},{"n":"Thuật toán xấp xỉ","d":"Thuật toán cho lời giải gần tối ưu với bảo đảm tỷ lệ so với tối ưu, chạy trong thời gian đa thức.","k":"Bên cạnh đó còn có heuristic và metaheuristic (tham lam, tìm kiếm cục bộ, giải thuật di truyền) không có bảo đảm lý thuyết nhưng hiệu quả thực tế.","c":"Cần đánh giá chất lượng lời giải trên dữ liệu thực, không chỉ trên bộ dữ liệu mẫu.","e":"Lập lộ trình xe tiếp quỹ ATM bằng heuristic, đạt kết quả trong vài giây với sai lệch nhỏ so với tối ưu."}]},{"id":"theory","title":"Lý thuyết tính toán","summary":"Nghiên cứu giới hạn của những gì máy tính có thể tính được.","points":["Otomat hữu hạn và biểu thức chính quy mô tả lớp ngôn ngữ chính quy.","Máy Turing là mô hình chuẩn của khái niệm tính toán.","Tồn tại những bài toán không máy tính nào giải được, điển hình là bài toán dừng."],"children":["Otomat hữu hạn","Văn phạm phi ngữ cảnh","Máy Turing","Tính quyết định được","Bài toán dừng"],"sub":[{"n":"Otomat hữu hạn","d":"Máy trừu tượng có hữu hạn trạng thái, chuyển trạng thái theo ký hiệu đầu vào; nhận biết ngôn ngữ chính quy.","k":"Tương đương với biểu thức chính quy; dùng trong phân tích từ vựng, kiểm tra định dạng, mô hình hóa quy trình.","c":"Otomat hữu hạn không đếm được số lượng không giới hạn, ví dụ không kiểm tra được ngoặc cân bằng.","e":"Mô hình trạng thái hồ sơ vay: Mới, Đang thẩm định, Đã duyệt, Từ chối, Giải ngân, với các chuyển trạng thái hợp lệ."},{"n":"Văn phạm phi ngữ cảnh","d":"Tập luật sinh mô tả ngôn ngữ phi ngữ cảnh, mạnh hơn ngôn ngữ chính quy; nhận biết bởi otomat đẩy xuống.","k":"Là nền mô tả cú pháp ngôn ngữ lập trình, JSON, XML; công cụ sinh parser dựa trên văn phạm.","c":"Văn phạm nhập nhằng cho nhiều cây phân tích cho cùng một chuỗi, cần viết lại hoặc quy định độ ưu tiên.","e":"Văn phạm biểu thức số học xác định nhân chia ưu tiên hơn cộng trừ."},{"n":"Máy Turing","d":"Mô hình tính toán gồm băng vô hạn, đầu đọc ghi và bảng chuyển trạng thái; định nghĩa khái niệm ‘tính được’.","k":"Luận đề Church–Turing: mọi thứ tính được bằng thuật toán đều tính được bằng máy Turing.","c":"Máy Turing là mô hình lý thuyết, không phản ánh hiệu năng máy tính thực.","e":"Chứng minh một ngôn ngữ lập trình là Turing-complete bằng cách mô phỏng được máy Turing."},{"n":"Tính quyết định được","d":"Bài toán quyết định được khi tồn tại thuật toán luôn dừng và trả lời đúng có hoặc không cho mọi đầu vào.","k":"Có bài toán nửa quyết định: thuật toán dừng khi câu trả lời là có nhưng có thể chạy mãi khi là không.","c":"Nhiều câu hỏi về hành vi chương trình là không quyết định được (định lý Rice).","e":"Không có công cụ tổng quát chứng minh mọi chương trình không có lỗi; phân tích tĩnh phải chấp nhận báo sai hoặc bỏ sót."},{"n":"Bài toán dừng","d":"Bài toán xác định một chương trình với đầu vào cho trước có dừng hay chạy mãi; Turing chứng minh là không quyết định được.","k":"Chứng minh bằng phản chứng kiểu đường chéo: giả sử có bộ quyết định thì xây được chương trình mâu thuẫn.","c":"Hệ quả thực tế: công cụ phát hiện vòng lặp vô hạn chỉ có thể xử lý một số trường hợp đặc biệt.","e":"Hệ thống dùng thời gian chờ (timeout) để dừng job treo vì không thể biết trước job có kết thúc hay không."}]},{"id":"arch","title":"Kiến trúc máy tính","summary":"Tổ chức phần cứng thực thi chương trình: CPU, bộ nhớ và vào ra.","points":["Phân cấp bộ nhớ (thanh ghi, cache, RAM, đĩa) giải thích nhiều hiện tượng hiệu năng.","Pipeline và song song hóa làm tăng thông lượng thực thi lệnh.","Tập lệnh (ISA) là hợp đồng giữa phần cứng và phần mềm."],"children":["Biểu diễn dữ liệu","Tập lệnh ISA","Pipeline","Phân cấp bộ nhớ và cache","Bộ xử lý đa lõi","GPU"],"sub":[{"n":"Biểu diễn dữ liệu","d":"Cách máy tính biểu diễn số nguyên, số thực, ký tự và dữ liệu khác bằng bit.","k":"Số nguyên dùng bù hai; số thực theo IEEE 754 có sai số làm tròn; ký tự theo Unicode, mã hóa UTF-8.","c":"Dùng số thực dấu phẩy động cho tiền tệ gây sai số; nên dùng kiểu decimal hoặc số nguyên theo đơn vị nhỏ nhất.","e":"0,1 + 0,2 không đúng bằng 0,3 trong số dấu phẩy động, nên số dư tài khoản lưu bằng decimal."},{"n":"Tập lệnh ISA","d":"Tập lệnh là giao diện giữa phần cứng và phần mềm, định nghĩa lệnh, thanh ghi và chế độ địa chỉ.","k":"CISC (x86) có lệnh phức tạp; RISC (ARM, RISC-V) có lệnh đơn giản, đều đặn, tiết kiệm năng lượng.","c":"Mã biên dịch cho một ISA không chạy trực tiếp trên ISA khác nếu không biên dịch lại hoặc giả lập.","e":"Ứng dụng máy chủ chuyển sang chạy trên chip ARM cần build lại image cho kiến trúc arm64."},{"n":"Pipeline","d":"Kỹ thuật chia thực thi lệnh thành nhiều giai đoạn chồng lấp để tăng thông lượng.","k":"Xung đột dữ liệu, điều khiển và tài nguyên làm pipeline dừng; dự đoán rẽ nhánh giảm thiệt hại.","c":"Mã có nhiều rẽ nhánh khó đoán chạy chậm hơn đáng kể dù số lệnh như nhau.","e":"Xử lý mảng đã sắp xếp nhanh hơn mảng ngẫu nhiên trong vòng lặp có điều kiện nhờ dự đoán rẽ nhánh chính xác."},{"n":"Phân cấp bộ nhớ và cache","d":"Tổ chức bộ nhớ nhiều tầng từ thanh ghi, cache L1, L2, L3, RAM đến ổ đĩa, nhanh và nhỏ ở trên, chậm và lớn ở dưới.","k":"Tính cục bộ không gian và thời gian quyết định hiệu quả cache.","c":"Truy cập bộ nhớ ngẫu nhiên trên cấu trúc lớn có thể chậm hơn hàng chục lần so với truy cập tuần tự.","e":"Lưu dữ liệu phân tích theo cột giúp quét một cột nhanh vì dữ liệu nằm liên tiếp trong bộ nhớ."},{"n":"Bộ xử lý đa lõi","d":"Chip chứa nhiều lõi xử lý độc lập chạy song song, chia sẻ một phần cache và bộ nhớ.","k":"Chỉ tăng tốc khi phần mềm được thiết kế đa luồng; định luật Amdahl giới hạn mức tăng tốc bởi phần tuần tự.","c":"Đồng bộ hóa kém giữa các luồng có thể làm chương trình chạy chậm hơn bản đơn luồng.","e":"Xử lý đối soát hàng triệu giao dịch được chia theo lô chạy song song trên 16 lõi."},{"n":"GPU","d":"Bộ xử lý đồ họa có hàng nghìn lõi đơn giản, tối ưu cho tính toán song song dữ liệu lớn.","k":"Là nền tảng tính toán của học sâu; lập trình qua CUDA hoặc các thư viện cấp cao.","c":"Chi phí chuyển dữ liệu giữa CPU và GPU có thể lớn hơn lợi ích nếu khối lượng tính toán nhỏ.","e":"Huấn luyện mô hình nhận dạng chữ viết tay trên GPU nhanh hơn CPU hàng chục lần."}]},{"id":"os","title":"Hệ điều hành","summary":"Phần mềm quản lý tài nguyên phần cứng và cung cấp dịch vụ cho chương trình ứng dụng.","points":["Tiến trình và luồng là các đơn vị thực thi.","Đồng bộ hóa sai dẫn đến race condition và deadlock.","Bộ nhớ ảo tạo cho mỗi tiến trình một không gian địa chỉ riêng."],"children":["Tiến trình và luồng","Lập lịch CPU","Đồng bộ hóa","Deadlock","Bộ nhớ ảo","Hệ thống tệp"],"sub":[{"n":"Tiến trình và luồng","d":"Tiến trình là chương trình đang chạy với không gian địa chỉ riêng; luồng là đơn vị thực thi trong tiến trình, chia sẻ bộ nhớ.","k":"Tạo luồng nhẹ hơn tạo tiến trình; tiến trình cô lập lỗi tốt hơn.","c":"Lỗi trong một luồng có thể làm sập toàn bộ tiến trình.","e":"Máy chủ web dùng nhóm luồng (thread pool) phục vụ yêu cầu, mỗi yêu cầu một luồng."},{"n":"Lập lịch CPU","d":"Cách hệ điều hành chọn tiến trình nào được chạy trên CPU và trong bao lâu.","k":"Các thuật toán: FCFS, SJF, Round Robin, hàng đợi đa mức; cân bằng giữa thông lượng, thời gian phản hồi và công bằng.","c":"Ưu tiên tĩnh có thể gây đói (starvation) cho tiến trình ưu tiên thấp.","e":"Đặt job báo cáo nặng ở mức ưu tiên thấp để không làm chậm dịch vụ giao dịch trực tuyến."},{"n":"Đồng bộ hóa","d":"Cơ chế phối hợp truy cập tài nguyên dùng chung giữa các luồng: mutex, semaphore, monitor, biến điều kiện.","k":"Vùng găng (critical section) phải được bảo vệ; thao tác nguyên tử tránh race condition.","c":"Khóa quá rộng làm giảm song song; khóa quá hẹp dễ sót vùng cần bảo vệ.","e":"Dùng mutex bảo vệ bộ đếm số yêu cầu đang xử lý dùng chung giữa các luồng."},{"n":"Deadlock","d":"Tình trạng nhóm tiến trình chờ nhau giữ tài nguyên vô hạn.","k":"Bốn điều kiện Coffman: loại trừ tương hỗ, giữ và chờ, không thu hồi, chờ vòng tròn; phá một điều kiện là tránh được.","c":"Cách phòng tránh thực tế phổ biến: luôn lấy khóa theo cùng một thứ tự và đặt thời gian chờ.","e":"Quy ước mọi giao dịch cập nhật bảng khách hàng trước rồi mới đến bảng tài khoản để tránh deadlock."},{"n":"Bộ nhớ ảo","d":"Kỹ thuật cho mỗi tiến trình không gian địa chỉ riêng, lớn hơn RAM thực, ánh xạ qua bảng trang.","k":"Phân trang (paging) và hoán đổi (swap) cho phép dùng đĩa mở rộng bộ nhớ; TLB tăng tốc dịch địa chỉ.","c":"Hệ thống swap liên tục (thrashing) làm hiệu năng sụp đổ.","e":"Máy chủ CSDL được cấp đủ RAM và giới hạn swap để tránh suy giảm hiệu năng đột ngột."},{"n":"Hệ thống tệp","d":"Cách hệ điều hành tổ chức, lưu trữ và truy cập tệp tin trên thiết bị lưu trữ.","k":"Journaling giúp phục hồi nhất quán sau sự cố; quyền truy cập tệp là lớp bảo mật cơ bản.","c":"Ghi dữ liệu chưa được đẩy xuống đĩa (flush) có thể mất khi mất điện.","e":"Ứng dụng ghi file đối soát dùng fsync trước khi báo thành công để bảo đảm dữ liệu đã lưu bền."}]},{"id":"networks","title":"Mạng máy tính","summary":"Nguyên lý truyền dữ liệu giữa các máy tính qua các tầng giao thức.","points":["Mô hình TCP/IP tổ chức giao thức theo tầng, mỗi tầng một trách nhiệm.","TCP bảo đảm truyền tin cậy; UDP ưu tiên độ trễ thấp.","DNS, HTTP và TLS là các giao thức nền của web."],"children":["Mô hình OSI và TCP/IP","IP và định tuyến","TCP và UDP","DNS","HTTP và HTTPS","Mạng không dây"],"sub":[{"n":"Mô hình OSI và TCP/IP","d":"Mô hình OSI 7 tầng là mô hình tham chiếu; TCP/IP 4 tầng (liên kết, Internet, giao vận, ứng dụng) là mô hình thực tế của Internet.","k":"Mỗi tầng cung cấp dịch vụ cho tầng trên; dữ liệu được đóng gói và thêm header qua từng tầng.","c":"Dùng mô hình tầng để khoanh vùng sự cố: mất kết nối vật lý, sai định tuyến hay lỗi ứng dụng.","e":"Khi ứng dụng không kết nối được, kiểm tra lần lượt: ping (tầng 3), telnet cổng (tầng 4), rồi log ứng dụng (tầng 7)."},{"n":"IP và định tuyến","d":"Giao thức IP đánh địa chỉ và chuyển gói tin; định tuyến chọn đường đi qua các mạng.","k":"IPv4 dùng địa chỉ 32 bit, IPv6 dùng 128 bit; subnet và CIDR chia mạng; giao thức định tuyến như OSPF, BGP.","c":"Cấu hình subnet mask sai làm máy cùng mạng không liên lạc được.","e":"Chia dải 10.10.0.0/16 thành các subnet /24 riêng cho máy chủ ứng dụng, CSDL và quản trị."},{"n":"TCP và UDP","d":"TCP là giao thức hướng kết nối, tin cậy, có thứ tự và kiểm soát tắc nghẽn; UDP không kết nối, nhẹ, không bảo đảm.","k":"TCP bắt tay ba bước để thiết lập kết nối; UDP phù hợp truyền thời gian thực chấp nhận mất gói.","c":"Tự xây cơ chế tin cậy trên UDP thường khó và dễ lỗi hơn dùng TCP hoặc QUIC.","e":"Giao dịch API dùng TCP qua HTTPS; hệ thống giám sát gửi metric bằng UDP để không ảnh hưởng ứng dụng."},{"n":"DNS","d":"Hệ thống phân giải tên miền thành địa chỉ IP, tổ chức phân cấp và có bộ nhớ đệm.","k":"Các bản ghi chính: A, AAAA, CNAME, MX, TXT; TTL quyết định thời gian lưu đệm.","c":"Đổi bản ghi DNS không có hiệu lực ngay do bộ nhớ đệm; cần giảm TTL trước khi chuyển đổi hệ thống.","e":"Giảm TTL xuống 5 phút một ngày trước khi chuyển tên miền ứng dụng sang trung tâm dữ liệu dự phòng."},{"n":"HTTP và HTTPS","d":"HTTP là giao thức trao đổi yêu cầu và phản hồi của web; HTTPS là HTTP chạy trên TLS để mã hóa và xác thực.","k":"Phương thức GET, POST, PUT, DELETE; mã trạng thái 2xx, 3xx, 4xx, 5xx; HTTP/2 và HTTP/3 tăng hiệu năng.","c":"Chứng thư TLS hết hạn làm dịch vụ ngừng hoạt động đột ngột; cần giám sát ngày hết hạn.","e":"API nội bộ trả 401 khi thiếu token, 403 khi không đủ quyền, 429 khi vượt giới hạn tần suất."},{"n":"Mạng không dây","d":"Mạng truyền dữ liệu qua sóng vô tuyến như Wi-Fi, di động 4G, 5G, Bluetooth.","k":"Chia sẻ môi trường truyền nên dễ bị nhiễu và nghe lén; chuẩn bảo mật Wi-Fi hiện hành là WPA3.","c":"Vùng phủ sóng vượt ra ngoài tòa nhà làm tăng bề mặt tấn công.","e":"Tách mạng Wi-Fi khách khỏi mạng nội bộ của chi nhánh bằng SSID và VLAN riêng."}]},{"id":"compilers","title":"Ngôn ngữ lập trình và trình biên dịch","summary":"Thiết kế ngôn ngữ và kỹ thuật dịch mã nguồn thành mã thực thi.","points":["Các mô hình lập trình chính: mệnh lệnh, hướng đối tượng, hàm và khai báo.","Trình biên dịch gồm các pha phân tích từ vựng, cú pháp, ngữ nghĩa, tối ưu và sinh mã.","Hệ thống kiểu (type system) giúp phát hiện lỗi trước khi chương trình chạy."],"children":["Mô hình lập trình","Hệ thống kiểu","Phân tích từ vựng và cú pháp","Tối ưu mã","Thông dịch và JIT","Quản lý bộ nhớ và GC"],"sub":[{"n":"Mô hình lập trình","d":"Các phong cách tổ chức chương trình: mệnh lệnh, hướng đối tượng, hàm, khai báo, logic.","k":"Ngôn ngữ hiện đại thường đa mô hình; lập trình hàm hạn chế trạng thái thay đổi giúp mã dễ kiểm thử.","c":"Chọn mô hình theo bài toán, không theo trào lưu.","e":"SQL là ngôn ngữ khai báo: mô tả kết quả cần có, hệ quản trị tự quyết định cách thực hiện."},{"n":"Hệ thống kiểu","d":"Tập quy tắc gán kiểu cho giá trị và biểu thức để ngăn các thao tác không hợp lệ.","k":"Kiểu tĩnh kiểm tra khi biên dịch, kiểu động kiểm tra khi chạy; kiểu mạnh hạn chế chuyển đổi ngầm.","c":"Chuyển kiểu ngầm định gây lỗi khó phát hiện, như so sánh chuỗi với số.","e":"Dùng TypeScript thay JavaScript để phát hiện lỗi truyền sai kiểu dữ liệu API ngay khi biên dịch."},{"n":"Phân tích từ vựng và cú pháp","d":"Phân tích từ vựng tách mã nguồn thành token; phân tích cú pháp dựng cây cú pháp từ token theo văn phạm.","k":"Công cụ như ANTLR sinh bộ phân tích từ văn phạm; cây cú pháp trừu tượng (AST) là đầu vào cho các bước sau.","c":"Thông báo lỗi cú pháp tốt quan trọng với người dùng không kém việc phân tích đúng.","e":"Công cụ kiểm tra quy tắc ngh
