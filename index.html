iệp vụ phân tích biểu thức điều kiện do người dùng nhập thành AST để đánh giá."},{"n":"Tối ưu mã","d":"Biến đổi mã để chạy nhanh hơn hoặc nhỏ hơn mà không đổi ngữ nghĩa: gập hằng, loại mã chết, nội tuyến hàm, tối ưu vòng lặp.","k":"Trình biên dịch hiện đại tối ưu rất tốt; lập trình viên nên tập trung vào thuật toán và cấu trúc dữ liệu.","c":"Tối ưu thủ công khi chưa đo đạc thường lãng phí và làm mã khó đọc.","e":"Đo bằng profiler trước, phát hiện 80% thời gian nằm ở một truy vấn, rồi mới tối ưu đúng chỗ."},{"n":"Thông dịch và JIT","d":"Thông dịch thực thi mã trực tiếp không biên dịch trước; JIT biên dịch sang mã máy trong lúc chạy dựa trên thông tin thực thi.","k":"Java, .NET, JavaScript V8 dùng JIT để đạt hiệu năng gần mã biên dịch sẵn.","c":"Ứng dụng JIT cần thời gian khởi động và làm nóng; đo hiệu năng ngay sau khởi động cho kết quả sai lệch.","e":"Dịch vụ .NET được làm nóng bằng vài yêu cầu mẫu trước khi nhận tải thật sau mỗi lần triển khai."},{"n":"Quản lý bộ nhớ và GC","d":"Cơ chế cấp phát và thu hồi bộ nhớ; bộ thu gom rác (GC) tự động giải phóng đối tượng không còn được tham chiếu.","k":"Thu hồi thủ công (C, C++) nhanh nhưng dễ rò rỉ và lỗi con trỏ; GC an toàn hơn nhưng có thể gây khoảng dừng.","c":"Có GC vẫn rò rỉ bộ nhớ nếu giữ tham chiếu không cần thiết, như cache không giới hạn.","e":"Phát hiện rò rỉ bộ nhớ do danh sách lắng nghe sự kiện không bao giờ được hủy đăng ký."}]},{"id":"dbtheory","title":"Lý thuyết cơ sở dữ liệu","summary":"Mô hình, ngôn ngữ và cơ chế lưu trữ, truy vấn dữ liệu có cấu trúc.","points":["Mô hình quan hệ dựa trên đại số quan hệ.","Chuẩn hóa giảm dư thừa và các bất thường khi cập nhật.","Giao dịch ACID bảo đảm nhất quán khi nhiều người dùng truy cập đồng thời."],"children":["Mô hình quan hệ","Đại số quan hệ và SQL","Chuẩn hóa","Chỉ mục","Giao dịch ACID","Kiểm soát đồng thời"],"sub":[{"n":"Mô hình quan hệ","d":"Mô hình tổ chức dữ liệu thành bảng (quan hệ) gồm hàng và cột, liên kết qua khóa.","k":"Khóa chính định danh duy nhất mỗi hàng; khóa ngoại bảo đảm toàn vẹn tham chiếu giữa các bảng.","c":"Dùng khóa tự nhiên dễ thay đổi (như số điện thoại) làm khóa chính gây khó khăn khi cập nhật.","e":"Bảng Tài khoản có khóa ngoại tham chiếu bảng Khách hàng, không cho phép tài khoản không có chủ."},{"n":"Đại số quan hệ và SQL","d":"Đại số quan hệ là tập phép toán hình thức trên bảng: chọn, chiếu, kết nối, hợp, hiệu; SQL là ngôn ngữ thực tế dựa trên nó.","k":"Hiểu thứ tự xử lý logic của SQL (FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY) giúp viết truy vấn đúng.","c":"NULL có logic ba giá trị: NULL = NULL không trả về đúng; cần dùng IS NULL.","e":"Dùng LEFT JOIN và kiểm tra IS NULL để tìm khách hàng chưa có giao dịch nào trong tháng."},{"n":"Chuẩn hóa","d":"Quá trình tổ chức bảng để giảm dư thừa và bất thường khi thêm, sửa, xóa, theo các dạng chuẩn 1NF, 2NF, 3NF, BCNF.","k":"Mỗi dữ kiện nên được lưu ở một nơi; phụ thuộc hàm là cơ sở để tách bảng.","c":"Chuẩn hóa quá mức làm truy vấn cần nhiều phép join; kho dữ liệu phân tích thường phi chuẩn hóa có chủ đích.","e":"Tách thông tin chi nhánh ra bảng riêng thay vì lặp tên và địa chỉ chi nhánh trên mọi bản ghi giao dịch."},{"n":"Chỉ mục","d":"Cấu trúc dữ liệu phụ trợ giúp tìm hàng nhanh mà không quét toàn bảng, thường là B+ tree.","k":"Chỉ mục phức hợp phụ thuộc thứ tự cột; chỉ mục bao phủ trả kết quả mà không cần đọc bảng.","c":"Mỗi chỉ mục làm chậm thao tác ghi và tốn dung lượng; không nên tạo chỉ mục tràn lan.","e":"Chỉ mục trên (mã khách hàng, ngày giao dịch) tăng tốc truy vấn sao kê từ vài giây xuống vài mili giây."},{"n":"Giao dịch ACID","d":"Bốn tính chất bảo đảm giao dịch tin cậy: nguyên tử, nhất quán, cô lập, bền vững.","k":"Nhật ký ghi trước (write-ahead log) bảo đảm tính bền vững và khả năng phục hồi sau sự cố.","c":"Giao dịch dài giữ khóa lâu làm tắc nghẽn hệ thống; nên giữ giao dịch ngắn.","e":"Chuyển khoản nội bộ: trừ tài khoản nguồn, cộng tài khoản đích và ghi nhật ký nằm trong cùng một giao dịch."},{"n":"Kiểm soát đồng thời","d":"Cơ chế cho phép nhiều giao dịch chạy đồng thời mà vẫn đúng: khóa hai pha, MVCC, các mức cô lập.","k":"Mức cô lập từ thấp đến cao: Read Uncommitted, Read Committed, Repeatable Read, Serializable; mức thấp nhanh hơn nhưng có hiện tượng bất thường.","c":"Hiện tượng lost update xảy ra khi hai giao dịch đọc rồi ghi đè lên nhau; cần khóa hoặc kiểm tra phiên bản.","e":"Dùng SELECT FOR UPDATE khi đọc số dư trước khi trừ tiền để tránh hai giao dịch cùng trừ vượt số dư."}]},{"id":"distributed","title":"Hệ phân tán","summary":"Hệ thống gồm nhiều máy phối hợp qua mạng và hoạt động như một thể thống nhất.","points":["Định lý CAP: khi mạng bị phân vùng, hệ thống phải chọn giữa nhất quán và sẵn sàng.","Không có đồng hồ chung, nên thứ tự sự kiện phải xác định bằng cơ chế logic.","Thuật toán đồng thuận như Raft và Paxos giữ trạng thái thống nhất giữa các nút."],"children":["Mô hình lỗi","Đồng hồ logic","Nhân bản dữ liệu","Định lý CAP","Đồng thuận Raft, Paxos","Phân mảnh (sharding)"],"sub":[{"n":"Mô hình lỗi","d":"Giả định về các loại lỗi hệ thống phải chịu được: dừng (crash), mất thông điệp, trễ tùy ý, lỗi Byzantine.","k":"Hệ phân tán phải thiết kế với giả định lỗi là bình thường, không phải ngoại lệ.","c":"Các ngộ nhận phổ biến: mạng luôn tin cậy, độ trễ bằng không, băng thông vô hạn.","e":"Dịch vụ gọi API bên ngoài luôn có timeout, retry với backoff và circuit breaker."},{"n":"Đồng hồ logic","d":"Cơ chế xác định thứ tự sự kiện khi không có đồng hồ chung: đồng hồ Lamport, vector clock.","k":"Quan hệ ‘xảy ra trước’ quan trọng hơn thời gian tuyệt đối; đồng hồ vật lý lệch nhau giữa các máy.","c":"Dùng thời gian hệ thống của nhiều máy để sắp xếp sự kiện có thể cho thứ tự sai.","e":"Đồng bộ NTP cho mọi máy chủ và dùng số thứ tự sự kiện thay vì dấu thời gian khi đối chiếu log."},{"n":"Nhân bản dữ liệu","d":"Lưu nhiều bản sao dữ liệu trên nhiều nút để tăng sẵn sàng và khả năng đọc.","k":"Nhân bản đồng bộ bảo đảm nhất quán nhưng chậm; bất đồng bộ nhanh nhưng có thể mất dữ liệu khi sự cố.","c":"Đọc từ bản sao chậm có thể trả dữ liệu cũ; cần xác định yêu cầu nhất quán cho từng chức năng.","e":"CSDL chính nhân bản đồng bộ sang máy dự phòng cùng trung tâm, bất đồng bộ sang trung tâm DR."},{"n":"Định lý CAP","d":"Khi xảy ra phân vùng mạng, hệ thống phân tán phải chọn giữa nhất quán và sẵn sàng.","k":"Mở rộng PACELC: khi không có phân vùng vẫn phải đánh đổi giữa độ trễ và nhất quán.","c":"CAP là mô hình đơn giản hóa; quyết định thực tế theo từng chức năng, không cho cả hệ thống.","e":"Số dư tài khoản ưu tiên nhất quán; danh sách ưu đãi hiển thị ưu tiên sẵn sàng, chấp nhận dữ liệu cũ vài phút."},{"n":"Đồng thuận Raft, Paxos","d":"Thuật toán giúp các nút thống nhất một giá trị hoặc một thứ tự thao tác dù một số nút lỗi.","k":"Raft dễ hiểu hơn Paxos, gồm bầu leader và nhân bản log; cần đa số nút hoạt động để tiến hành.","c":"Cụm hai nút không chịu được lỗi một nút mà vẫn giữ đồng thuận; nên dùng số nút lẻ.","e":"Cụm etcd ba nút lưu cấu hình Kubernetes dùng Raft, chịu được lỗi một nút."},{"n":"Phân mảnh (sharding)","d":"Chia dữ liệu theo khóa thành nhiều phần lưu trên nhiều nút để mở rộng theo chiều ngang.","k":"Chọn khóa phân mảnh quyết định phân bố tải; phân mảnh theo băm, theo khoảng hoặc theo danh mục.","c":"Truy vấn cần dữ liệu từ nhiều phân mảnh chậm và phức tạp; đổi khóa phân mảnh về sau rất tốn kém.","e":"Phân mảnh bảng lịch sử giao dịch theo mã khách hàng để truy vấn sao kê chỉ chạm một phân mảnh."}]}],"concepts":[{"term":"Thuật toán (Algorithm)","def":"Dãy hữu hạn các bước rõ ràng để giải một bài toán.","ex":"Tìm kiếm nhị phân trên danh sách đã sắp xếp.","mis":"Thuật toán đồng nghĩa với chương trình. Chương trình chỉ là một cách hiện thực thuật toán bằng ngôn ngữ cụ thể."},{"term":"Big-O","def":"Ký hiệu cận trên của tốc độ tăng chi phí theo kích thước đầu vào.","ex":"Tìm kiếm tuyến tính là O(n); tìm kiếm nhị phân là O(log n).","mis":"Thuật toán O(n) luôn nhanh hơn O(n²). Với n nhỏ, hằng số ẩn có thể đảo ngược kết quả."},{"term":"Đệ quy (Recursion)","def":"Hàm tự gọi chính nó với bài toán con nhỏ hơn cho đến khi gặp trường hợp cơ sở.","ex":"Duyệt toàn bộ cây thư mục.","mis":"Đệ quy luôn chậm. Nhiều bài toán đệ quy được tối ưu bằng ghi nhớ kết quả hoặc đệ quy đuôi."},{"term":"Bảng băm (Hash table)","def":"Cấu trúc ánh xạ khóa sang giá trị thông qua hàm băm, truy cập trung bình trong O(1).","ex":"Tra cứu thông tin theo mã định danh.","mis":"Luôn là O(1). Khi xung đột băm nhiều, trường hợp xấu nhất có thể là O(n)."},{"term":"Quy hoạch động (Dynamic programming)","def":"Giải bài toán bằng cách lưu và tái sử dụng kết quả của các bài toán con chồng lấp.","ex":"Tính khoảng cách chỉnh sửa giữa hai chuỗi ký tự.","mis":"Chỉ là đệ quy có bộ nhớ đệm. Cốt lõi là xác định đúng trạng thái và cấu trúc con tối ưu."},{"term":"NP-đầy đủ (NP-complete)","def":"Lớp bài toán khó nhất trong NP: nếu một bài toán thuộc lớp này giải được trong thời gian đa thức thì mọi bài toán NP đều giải được.","ex":"Bài toán người du lịch ở dạng quyết định, bài toán tô màu đồ thị.","mis":"NP nghĩa là ‘không đa thức’. NP là lớp bài toán mà lời giải có thể được kiểm tra trong thời gian đa thức."},{"term":"Race condition","def":"Lỗi xảy ra khi kết quả phụ thuộc vào thứ tự thực thi không được kiểm soát của nhiều luồng.","ex":"Hai luồng cùng cộng vào một biến số dư mà không khóa.","mis":"Chỉ xảy ra trên máy đa lõi. Lỗi vẫn xảy ra trên một lõi do chuyển ngữ cảnh."},{"term":"Deadlock","def":"Tình trạng các tiến trình chờ tài nguyên của nhau vô thời hạn.","ex":"Giao dịch A khóa bảng 1 và chờ bảng 2, trong khi giao dịch B khóa bảng 2 và chờ bảng 1.","mis":"Chỉ là lỗi của hệ quản trị cơ sở dữ liệu. Đây là vấn đề chung của mọi hệ có tài nguyên dùng chung."},{"term":"Giao dịch ACID","def":"Bốn tính chất của giao dịch cơ sở dữ liệu: nguyên tử, nhất quán, cô lập và bền vững.","ex":"Chuyển khoản trừ tài khoản A và cộng tài khoản B cùng thành công hoặc cùng hủy.","mis":"Mức cô lập cao nhất luôn được bật mặc định. Nhiều hệ mặc định mức thấp hơn để tăng hiệu năng."},{"term":"Định lý CAP","def":"Hệ phân tán không thể đồng thời bảo đảm nhất quán (Consistency), sẵn sàng (Availability) và chịu phân vùng mạng (Partition tolerance).","ex":"Khi mất kết nối giữa hai trung tâm dữ liệu, hệ phải chọn từ chối ghi hoặc chấp nhận dữ liệu tạm thời lệch nhau.","mis":"Lúc nào cũng phải chọn 2 trong 3. Sự lựa chọn chỉ thực sự xảy ra khi có phân vùng mạng."}],"path":{"foundation":{"goal":"Có tư duy thuật toán và lập trình cơ bản.","topics":["Một ngôn ngữ lập trình (Python hoặc Java)","Toán rời rạc","Cấu trúc dữ liệu cơ bản","Big-O"],"signal":"Tự cài đặt và phân tích độ phức tạp các thuật toán sắp xếp, tìm kiếm."},"intermediate":{"goal":"Hiểu máy tính vận hành từ phần cứng đến ứng dụng.","topics":["Kiến trúc máy tính","Hệ điều hành","Mạng máy tính","Cơ sở dữ liệu"],"signal":"Giải thích được điều gì xảy ra từ lúc gõ một URL đến khi trang hiển thị."},"advanced":{"goal":"Thiết kế giải pháp cho bài toán quy mô lớn.","topics":["Giải thuật nâng cao và đồ thị","Hệ phân tán","Trình biên dịch","Lập trình song song"],"signal":"Thiết kế được hệ thống chịu lỗi và lập luận được về tính đúng, hiệu năng."},"expert":{"goal":"Mở rộng biên giới tri thức hoặc công nghệ.","topics":["Lý thuyết tính toán và độ phức tạp","Kiểm chứng hình thức","Nghiên cứu chuyên sâu (AI, mật mã, hệ thống)","Công bố và phản biện học thuật"],"signal":"Có đóng góp mới được công nhận: công bố khoa học, dự án mã nguồn mở lớn hoặc sáng chế."}},"standards":[{"name":"ACM/IEEE-CS/AAAI Computer Science Curricula 2023 (CS2023)","note":"Khung chương trình đào tạo khoa học máy tính.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"IEEE 754-2019","note":"Chuẩn số dấu phẩy động.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 9899:2024 (C23)","note":"Chuẩn ngôn ngữ C.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 14882:2024 (C++23)","note":"Chuẩn ngôn ngữ C++.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 9075","note":"Chuẩn ngôn ngữ SQL.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"The Unicode Standard","note":"Chuẩn mã hóa ký tự, quan trọng khi xử lý tiếng Việt có dấu.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"tools":[{"group":"Ngôn ngữ","items":["Python","Java","C và C++","Go","Rust"]},{"group":"Môi trường phát triển","items":["VS Code","JetBrains IDE","Git"]},{"group":"Luyện giải thuật","items":["LeetCode","Codeforces","VNOJ"]},{"group":"Hệ thống","items":["Linux","Docker"]},{"group":"Nghiên cứu","items":["Jupyter","LaTeX"]}],"certs":[{"name":"Oracle Certified Professional: Java SE Developer","note":"Năng lực lập trình Java.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Python Institute PCAP / PCPP","note":"Năng lực lập trình Python.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Linux Foundation LFCS","note":"Quản trị hệ thống Linux.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Lưu ý","note":"Khoa học máy tính không có chứng chỉ trung tâm; năng lực thường được chứng minh bằng bằng cấp, dự án và thành tích như kỳ thi ICPC.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Kỹ sư phần mềm nền tảng","skills":"Giải thuật, hệ điều hành, tối ưu hiệu năng"},{"role":"Kỹ sư hệ thống phân tán","skills":"Đồng thuận, nhân bản dữ liệu, chịu lỗi"},{"role":"Kỹ sư trình biên dịch","skills":"Lý thuyết ngôn ngữ, tối ưu mã"},{"role":"Kỹ sư hệ nhúng","skills":"C và C++, kiến trúc máy tính, hệ thời gian thực"},{"role":"Nhà nghiên cứu khoa học máy tính","skills":"Toán, phương pháp nghiên cứu, viết học thuật"}],"glossary":[["Algorithm","Thuật toán","Dãy bước giải một bài toán."],["Data structure","Cấu trúc dữ liệu","Cách tổ chức dữ liệu để truy cập hiệu quả."],["Recursion","Đệ quy","Hàm tự gọi chính nó."],["Complexity","Độ phức tạp","Mức tài nguyên thuật toán cần theo kích thước đầu vào."],["Process","Tiến trình","Chương trình đang thực thi với không gian bộ nhớ riêng."],["Thread","Luồng","Đơn vị thực thi bên trong tiến trình, chia sẻ bộ nhớ."],["Compiler","Trình biên dịch","Chương trình dịch mã nguồn sang mã thực thi."],["Cache","Bộ nhớ đệm","Vùng lưu tạm dữ liệu hay dùng để truy cập nhanh."],["Concurrency","Đồng thời","Nhiều tác vụ tiến triển xen kẽ trong cùng khoảng thời gian."],["Parallelism","Song song","Nhiều tác vụ thực sự chạy cùng lúc trên nhiều bộ xử lý."]],"quiz":[{"q":"Tìm kiếm nhị phân trên mảng đã sắp xếp có độ phức tạp thời gian là bao nhiêu?","o":["O(1)","O(log n)","O(n)","O(n log n)"],"a":1,"e":"Mỗi bước loại bỏ một nửa không gian tìm kiếm nên số bước tăng theo log n."},{"q":"Điều nào KHÔNG thuộc bốn điều kiện cần của deadlock (điều kiện Coffman)?","o":["Loại trừ tương hỗ","Giữ và chờ","Chờ vòng tròn","Lập lịch theo độ ưu tiên"],"a":3,"e":"Bốn điều kiện là loại trừ tương hỗ, giữ và chờ, không thu hồi được tài nguyên, và chờ vòng tròn."},{"q":"Tính cô lập (Isolation) trong ACID bảo đảm điều gì?","o":["Dữ liệu không mất khi mất điện","Các giao dịch đồng thời không thấy trạng thái dở dang của nhau","Giao dịch thực hiện toàn bộ hoặc không thực hiện gì","Dữ liệu luôn thỏa ràng buộc"],"a":1,"e":"Các phương án còn lại lần lượt mô tả tính bền vững, nguyên tử và nhất quán."},{"q":"Theo định lý CAP, khi xảy ra phân vùng mạng hệ thống phải chọn giữa hai tính chất nào?","o":["Nhất quán và sẵn sàng","Hiệu năng và chi phí","Bảo mật và tốc độ","Nhân bản và phân mảnh"],"a":0,"e":"Khi có phân vùng, hệ phải hoặc từ chối yêu cầu để giữ nhất quán, hoặc phục vụ với dữ liệu có thể lệch."},{"q":"Bài toán dừng (Halting problem) chứng minh điều gì?","o":["Mọi chương trình đều dừng","Không tồn tại thuật toán tổng quát xác định mọi chương trình có dừng hay không","Chương trình đệ quy không bao giờ dừng","Máy Turing chậm hơn máy tính thật"],"a":1,"e":"Turing chứng minh bài toán dừng là không quyết định được, cho thấy giới hạn cơ bản của tính toán."}],"links":[{"to":"ai","why":"Toán, giải thuật và tối ưu hóa là nền tảng của học máy."},{"to":"se","why":"Cấu trúc dữ liệu, hệ điều hành và cơ sở dữ liệu là nền kỹ thuật để xây phần mềm."},{"to":"sec","why":"Mật mã học và bảo mật hệ điều hành bắt nguồn từ khoa học máy tính."},{"to":"data","why":"Lý thuyết cơ sở dữ liệu và hệ phân tán là nền cho kỹ thuật dữ liệu."}]},{"id":"se","code":"IV.3","title":"Software Engineering","vi":"Kỹ nghệ phần mềm","summary":"Kỹ nghệ phần mềm (Software Engineering) là việc áp dụng cách tiếp cận có hệ thống, có kỷ luật và đo lường được vào phát triển, vận hành và bảo trì phần mềm.","diff":["Khác lập trình: lập trình là viết mã; kỹ nghệ phần mềm bao trùm yêu cầu, thiết kế, kiểm thử, quy trình, chất lượng và làm việc nhóm trong suốt vòng đời.","Khác Computer Science: khoa học máy tính tập trung vào lý thuyết và thuật toán; kỹ nghệ phần mềm tập trung tạo ra sản phẩm đáng tin cậy trong ràng buộc thời gian, chi phí và con người.","Khác IT: kỹ nghệ phần mềm xây dựng phần mềm; IT vận hành và cung cấp dịch vụ công nghệ cho người dùng."],"topics":[{"id":"sdlc","title":"Vòng đời phát triển phần mềm (SDLC)","summary":"Các mô hình tổ chức công việc từ ý tưởng đến vận hành.","points":["Waterfall phù hợp khi yêu cầu ổn định và cần kiểm soát chặt.","Agile phù hợp khi yêu cầu thay đổi và cần phản hồi nhanh.","Mô hình lai (hybrid) phổ biến ở tổ chức có yêu cầu tuân thủ cao như ngân hàng."],"children":["Waterfall","Mô hình chữ V","Iterative và Incremental","Agile và Scrum","Kanban","Hybrid","SAFe"],"sub":[{"n":"Waterfall","d":"Mô hình tuần tự: các pha yêu cầu, thiết kế, lập trình, kiểm thử, triển khai đi lần lượt; pha sau bắt đầu khi pha trước được nghiệm thu.","k":"Mỗi pha kết thúc bằng tài liệu được phê duyệt (BRD, thiết kế, kết quả kiểm thử), tạo mốc kiểm soát rõ ràng cho quản lý và kiểm toán.","c":"Phản hồi của người dùng đến rất muộn; yêu cầu sai chỉ lộ ra ở UAT, khi chi phí sửa đã cao. Không phù hợp khi yêu cầu còn mơ hồ.","e":"Nâng cấp báo cáo gửi cơ quan quản lý theo mẫu biểu cố định: yêu cầu đã rõ và ổn định, cần hồ sơ đầy đủ để đối chiếu."},{"n":"Mô hình chữ V","d":"Biến thể của Waterfall, trong đó mỗi pha phân rã ở nhánh trái có một mức kiểm thử tương ứng ở nhánh phải.","k":"Cặp tương ứng: yêu cầu nghiệp vụ với UAT, đặc tả hệ thống với SIT, thiết kế kiến trúc với kiểm thử tích hợp, thiết kế chi tiết với unit test. Ca kiểm thử được viết ngay khi tài liệu tương ứng hoàn thành.","c":"Nếu chỉ vẽ chữ V mà không thiết kế ca kiểm thử sớm thì mô hình không khác gì Waterfall.","e":"BA viết kịch bản UAT song song với BRD; QA viết ca SIT ngay sau khi FSD được duyệt, trước khi dev bắt đầu lập trình."},{"n":"Iterative và Incremental","d":"Iterative lặp lại chu trình phân tích, xây dựng, đánh giá để cải thiện dần; Incremental giao sản phẩm theo từng phần tăng dần chức năng. Hai cách thường kết hợp với nhau.","k":"Mỗi vòng lặp tạo ra một phiên bản chạy được để lấy phản hồi; rủi ro kỹ thuật lớn được xử lý ở những vòng đầu.","c":"Cần kiến trúc đủ vững từ đầu, nếu không mỗi phần tăng thêm sẽ phải đập đi làm lại. Phạm vi mỗi vòng phải được chốt rõ.","e":"Hệ thống quản lý hồ sơ nhân sự: vòng 1 giao tra cứu hồ sơ, vòng 2 thêm luồng phê duyệt, vòng 3 thêm báo cáo và tích hợp chấm công."},{"n":"Agile và Scrum","d":"Agile là tập giá trị và nguyên tắc (Tuyên ngôn Agile 2001) ưu tiên phản hồi nhanh và thích ứng với thay đổi. Scrum là khung làm việc Agile phổ biến nhất, tổ chức theo sprint có độ dài cố định.","k":"Scrum có ba vai trò (Product Owner, Scrum Master, Developers), ba artifact (Product Backlog, Sprint Backlog, Increment) và năm sự kiện (Sprint, Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective).","c":"Làm các nghi thức Scrum nhưng không có Product Owner được trao quyền, hoặc không giao Increment dùng được mỗi sprint, thì chỉ là Waterfall chia nhỏ.","e":"Nhóm phát triển app nội bộ chạy sprint 2 tuần; cuối mỗi sprint demo cho đơn vị nghiệp vụ và điều chỉnh ưu tiên backlog theo phản hồi."},{"n":"Kanban","d":"Phương pháp quản lý luồng công việc bằng bảng trực quan, giới hạn số việc dở dang (WIP limit) và kéo việc mới khi có năng lực.","k":"Không có sprint cố định; đo hiệu quả bằng lead time, cycle time và thông lượng. Giới hạn WIP làm lộ điểm nghẽn để cải tiến.","c":"Bảng Kanban không có giới hạn WIP chỉ là danh sách việc, không phải Kanban. Cần định nghĩa rõ điều kiện chuyển cột.","e":"Nhóm vận hành xử lý yêu cầu thay đổi nhỏ và sự cố mức 2: cột Tiếp nhận, Phân tích, Đang làm (WIP 4), Kiểm thử, Hoàn thành."},{"n":"Hybrid","d":"Mô hình kết hợp: kiểm soát theo pha của Waterfall ở cấp dự án, thực thi lặp theo Agile ở cấp nhóm phát triển.","k":"Phổ biến ở tổ chức có yêu cầu tuân thủ cao: BRD và phê duyệt ngân sách theo cổng (gate), phát triển theo sprint, UAT và go-live theo kế hoạch tập trung.","c":"Rủi ro lớn nhất là lấy phần nặng nề của cả hai: tài liệu dày như Waterfall mà vẫn thay đổi liên tục. Cần định nghĩa rõ đầu vào, đầu ra, DoR, DoD tại mỗi điểm bàn giao.","e":"Dự án ứng dụng nghiệp vụ: phê duyệt BRD và TCP theo cổng, phát triển 4 sprint, SIT theo sprint, sau đó UAT tập trung và go-live theo lịch phát hành."},{"n":"SAFe","d":"Scaled Agile Framework: khung mở rộng Agile cho nhiều nhóm cùng giao một sản phẩm hoặc giải pháp lớn.","k":"Đơn vị cốt lõi là Agile Release Train (ART) gồm khoảng 5 đến 12 nhóm, lập kế hoạch chung theo Program Increment (PI) kéo dài 8 đến 12 tuần qua sự kiện PI Planning.","c":"Tốn chi phí tổ chức và đào tạo; áp dụng khi thực sự có nhiều nhóm phụ thuộc lẫn nhau. Với một hai nhóm, Scrum hoặc Kanban là đủ.","e":"Chương trình chuyển đổi ngân hàng số với các nhóm mobile, core, thẻ, dữ liệu cùng lập kế hoạch PI để đồng bộ phụ thuộc và lịch phát hành."}]},{"id":"req","title":"Kỹ nghệ yêu cầu","summary":"Khai thác, phân tích, đặc tả, thẩm định và quản lý yêu cầu.","points":["Phần lớn lỗi tốn kém bắt nguồn từ yêu cầu sai hoặc thiếu.","Yêu cầu tốt phải rõ ràng, kiểm thử được và truy vết được.","Yêu cầu phi chức năng như hiệu năng, bảo mật thường bị bỏ sót nhất."],"children":["Khai thác yêu cầu","Yêu cầu chức năng","Yêu cầu phi chức năng","User story và tiêu chí chấp nhận","Ma trận truy vết","Quản lý thay đổi yêu cầu"],"sub":[{"n":"Khai thác yêu cầu","d":"Hoạt động thu thập nhu cầu từ các bên liên quan bằng phỏng vấn, workshop, quan sát, phân tích tài liệu và prototype.","k":"Chọn kỹ thuật theo bối cảnh: phỏng vấn để hiểu sâu, workshop để thống nhất nhiều bên, quan sát để thấy quy trình thực tế khác quy trình trên giấy.","c":"Người dùng thường mô tả giải pháp thay vì vấn đề. BA cần hỏi ‘vì sao’ để tìm nhu cầu thật.","e":"Quan sát giao dịch viên thao tác 3 màn hình khác nhau để hoàn tất một giao dịch, từ đó phát hiện nhu cầu tích hợp mà phỏng vấn không nêu ra."},{"n":"Yêu cầu chức năng","d":"Mô tả những gì hệ thống phải làm: chức năng, dữ liệu, quy tắc nghiệp vụ và phản hồi với từng đầu vào.","k":"Mỗi yêu cầu nên có mã định danh, độ ưu tiên, nguồn gốc và tiêu chí kiểm chứng; một câu một yêu cầu.","c":"Tránh từ mơ hồ như ‘nhanh’, ‘thân thiện’, ‘v.v.’. Tách quy tắc nghiệp vụ khỏi yêu cầu chức năng để dễ thay đổi.","e":"FR-012: Hệ thống cho phép quản lý trực tiếp phê duyệt hoặc từ chối đơn nghỉ phép, bắt buộc nhập lý do khi từ chối."},{"n":"Yêu cầu phi chức năng","d":"Mô tả hệ thống phải vận hành tốt đến mức nào: hiệu năng, bảo mật, khả dụng, khả năng mở rộng, khả năng bảo trì, tuân thủ.","k":"Phải định lượng được. ISO/IEC 25010 là danh mục kiểm tra tốt để không bỏ sót đặc tính chất lượng.","c":"Thường bị bỏ sót vì nghiệp vụ không nêu ra; hậu quả chỉ lộ ra khi kiểm thử hiệu năng hoặc khi đã vận hành.","e":"NFR-03: 95% yêu cầu tra cứu phản hồi dưới 2 giây với 300 người dùng đồng thời trong giờ cao điểm."},{"n":"User story và tiêu chí chấp nhận","d":"User story mô tả nhu cầu theo mẫu ‘Là [vai trò], tôi muốn [mục tiêu] để [lợi ích]’. Tiêu chí chấp nhận xác định khi nào story được coi là đạt.","k":"Story tốt theo tiêu chí INVEST: độc lập, thương lượng được, có giá trị, ước lượng được, nhỏ, kiểm thử được. Tiêu chí chấp nhận thường viết dạng Given, When, Then.","c":"Story không có tiêu chí chấp nhận là nguồn tranh cãi phổ biến nhất giữa BA, Dev và QA.","e":"Là nhân viên, tôi muốn xem số ngày phép còn lại để lên kế hoạch nghỉ. Given tôi đã đăng nhập, When mở trang phép, Then thấy số ngày còn lại tính đến hôm nay."},{"n":"Ma trận truy vết","d":"Bảng liên kết yêu cầu nghiệp vụ với yêu cầu hệ thống, thiết kế, mã nguồn và ca kiểm thử (RTM).","k":"Truy vết hai chiều: xuôi để chắc mọi yêu cầu đều được hiện thực và kiểm thử; ngược để chắc không có chức năng thừa không rõ nguồn.","c":"RTM chỉ có giá trị khi được cập nhật mỗi lần thay đổi; làm một lần lúc cuối dự án để nộp là lãng phí.","e":"BR-05 liên kết tới FR-12, FR-13, ca SIT-044 đến SIT-047 và kịch bản UAT-09; khi BR-05 thay đổi, biết ngay cần sửa gì."},{"n":"Quản lý thay đổi yêu cầu","d":"Quy trình tiếp nhận, phân tích ảnh hưởng, phê duyệt và cập nhật khi yêu cầu thay đổi sau baseline.","k":"Mỗi Change Request cần phân tích ảnh hưởng tới phạm vi, chi phí, tiến độ, rủi ro trước khi phê duyệt.","c":"Thay đổi qua trao đổi miệng hoặc chat mà không ghi nhận là nguyên nhân chính của trượt phạm vi (scope creep).","e":"CR-07 đổi quy tắc tính ngày phép: phân tích ảnh hưởng tới 3 màn hình, 1 báo cáo, 12 ca kiểm thử; hội đồng quyết định đưa vào đợt phát hành sau."}]},{"id":"design","title":"Thiết kế và kiến trúc phần mềm","summary":"Quyết định cấu trúc hệ thống, các thành phần và cách chúng tương tác.","points":["Kiến trúc là tập các quyết định khó thay đổi về sau.","Nguyên tắc SOLID cùng gắn kết cao, liên kết lỏng giúp mã dễ bảo trì.","Mỗi kiểu kiến trúc (phân tầng, microservices, hướng sự kiện) có đánh đổi riêng."],"children":["Nguyên tắc SOLID","Kiến trúc phân tầng","Microservices","Kiến trúc hướng sự kiện","Thiết kế API","Architecture Decision Record (ADR)","Mô hình C4"],"sub":[{"n":"Nguyên tắc SOLID","d":"Năm nguyên tắc thiết kế hướng đối tượng: Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion.","k":"Mục tiêu chung là giảm phụ thuộc và cô lập thay đổi, để sửa một chỗ không kéo theo nhiều chỗ khác.","c":"Áp dụng máy móc sinh ra quá nhiều lớp trừu tượng. Dùng nguyên tắc để giải quyết vấn đề thực, không phải để trang trí.","e":"Tách lớp tính thuế thu nhập khỏi lớp xuất bảng lương, để khi quy định thuế đổi chỉ cần sửa một lớp."},{"n":"Kiến trúc phân tầng","d":"Tổ chức hệ thống thành các tầng như trình bày, nghiệp vụ, truy cập dữ liệu; mỗi tầng chỉ gọi tầng ngay dưới.","k":"Dễ hiểu, dễ phân công nhóm, phù hợp phần lớn ứng dụng doanh nghiệp.","c":"Dễ biến tầng nghiệp vụ thành lớp chuyển tiếp rỗng, còn logic nằm hết ở giao diện hoặc stored procedure.","e":"Ứng dụng web nội bộ: giao diện React, tầng dịch vụ .NET chứa quy tắc nghiệp vụ, tầng repository truy cập SQL Server."},{"n":"Microservices","d":"Kiến trúc chia hệ thống thành các dịch vụ nhỏ, triển khai độc lập, mỗi dịch vụ sở hữu dữ liệu riêng và giao tiếp qua API hoặc sự kiện.","k":"Cho phép mở rộng và phát hành độc lập từng phần; ranh giới dịch vụ nên theo miền nghiệp vụ (bounded context).","c":"Chi phí vận hành cao: giám sát phân tán, nhất quán dữ liệu, nhiều pipeline. Không nên bắt đầu bằng microservices khi nhóm nhỏ và miền nghiệp vụ chưa rõ.","e":"Tách dịch vụ thông báo, dịch vụ tài khoản, dịch vụ ưu đãi của ứng dụng di động để mỗi nhóm phát hành theo nhịp riêng."},{"n":"Kiến trúc hướng sự kiện","d":"Các thành phần giao tiếp bằng cách phát và lắng nghe sự kiện thay vì gọi trực tiếp nhau.","k":"Giảm liên kết giữa bên phát và bên nhận; dễ thêm bên xử lý mới mà không sửa bên phát.","c":"Khó theo dõi luồng xử lý và gỡ lỗi; phải xử lý sự kiện trùng, sai thứ tự và nhất quán cuối (eventual consistency).","e":"Sự kiện ‘Khoản vay đã giải ngân’ được dịch vụ thông báo, dịch vụ kế toán và kho dữ liệu cùng lắng nghe và xử lý độc lập."},{"n":"Thiết kế API","d":"Thiết kế hợp đồng giao tiếp giữa các hệ thống: tài nguyên, phương thức, định dạng dữ liệu, mã lỗi, phiên bản và bảo mật.","k":"Thiết kế theo hướng hợp đồng trước (contract-first) bằng OpenAPI; nhất quán tên gọi, phân trang, xử lý lỗi; có chiến lược phiên bản.","c":"Thay đổi phá vỡ tương thích mà không đổi phiên bản làm hỏng hệ thống bên gọi; lộ dữ liệu thừa là rủi ro bảo mật.","e":"API GET /v1/employees/{id}/leave-balance trả JSON có mã lỗi chuẩn, yêu cầu token OAuth 2.0 và giới hạn tần suất gọi."},{"n":"Architecture Decision Record (ADR)","d":"Tài liệu ngắn ghi lại một quyết định kiến trúc quan trọng: bối cảnh, phương án cân nhắc, quyết định và hệ quả.","k":"Giúp người đến sau hiểu vì sao hệ thống như hiện tại; lưu cùng mã nguồn, đánh số và không sửa khi đã chấp nhận, chỉ thay bằng ADR mới.","c":"Viết ADR cho mọi việc nhỏ gây nhiễu; chỉ ghi các quyết định khó đảo ngược hoặc ảnh hưởng rộng.","e":"ADR-004: Chọn CDC thay vì ETL batch để đồng bộ dữ liệu khách hàng, vì yêu cầu độ trễ dưới 5 phút; hệ quả là cần giám sát log CSDL nguồn."},{"n":"Mô hình C4","d":"Cách vẽ kiến trúc phần mềm theo bốn mức phóng to: Context, Container, Component và Code.","k":"Mỗi mức phục vụ một đối tượng đọc: Context cho lãnh đạo và nghiệp vụ, Container cho kiến trúc sư và vận hành, Component cho nhóm phát triển.","c":"Sơ đồ không có chú thích và không ghi công nghệ, giao thức trên đường nối thì mất phần lớn giá trị.","e":"Sơ đồ Container của cổng nhân sự: web app, API gateway, dịch vụ nhân sự, CSDL Oracle, tích hợp hệ thống chấm công qua API."}]},{"id":"patterns","title":"Mẫu thiết kế (Design patterns)","summary":"Lời giải đã được kiểm chứng cho các vấn đề thiết kế lặp lại.","points":["Nhóm tác giả GoF chia mẫu thành ba nhóm: khởi tạo, cấu trúc và hành vi.","Mẫu là ngôn ngữ chung giữa kỹ sư, không phải khuôn bắt buộc.","Lạm dụng mẫu làm hệ thống phức tạp không cần thiết."],"children":["Singleton","Factory","Adapter","Facade","Observer","Strategy","Repository"],"sub":[{"n":"Singleton","d":"Mẫu bảo đảm một lớp chỉ có duy nhất một thể hiện và cung cấp điểm truy cập toàn cục tới nó.","k":"Dùng cho tài nguyên thực sự duy nhất như bộ cấu hình hoặc bộ ghi log.","c":"Bị coi là phản mẫu khi lạm dụng: tạo trạng thái toàn cục ẩn, khó kiểm thử. Ngày nay thường thay bằng dependency injection với vòng đời singleton.","e":"Đối tượng cấu hình ứng dụng được nạp một lần khi khởi động và dùng chung cho toàn bộ dịch vụ."},{"n":"Factory","d":"Mẫu tách việc khởi tạo đối tượng ra khỏi nơi sử dụng, để bên gọi không cần biết lớp cụ thể.","k":"Hữu ích khi loại đối tượng phụ thuộc cấu hình hoặc dữ liệu đầu vào.","c":"Không cần Factory khi chỉ có một loại đối tượng và không có kế hoạch mở rộng.","e":"NotificationFactory trả về bộ gửi SMS, email hoặc push tùy kênh khách hàng đã đăng ký."},{"n":"Adapter","d":"Mẫu chuyển đổi giao diện của một lớp sang giao diện khác mà bên gọi mong đợi.","k":"Rất phổ biến khi tích hợp hệ thống cũ hoặc thư viện bên thứ ba mà không sửa được mã nguồn của chúng.","c":"Adapter che giấu khác biệt nhưng không xóa được khác biệt về hiệu năng hay ngữ nghĩa dữ liệu.","e":"Adapter bọc giao diện SOAP của hệ thống lõi cũ thành REST API cho ứng dụng mới."},{"n":"Facade","d":"Mẫu cung cấp một giao diện đơn giản cho một nhóm hệ thống con phức tạp.","k":"Giảm số điểm phụ thuộc của bên gọi; thường dùng làm lớp dịch vụ hoặc backend-for-frontend.","c":"Facade phình to thành lớp ‘biết tuốt’ nếu dồn mọi logic vào đó.","e":"Hàm mở tài khoản gọi lần lượt kiểm tra định danh, tạo hồ sơ khách hàng, mở tài khoản và gửi thông báo phía sau một API duy nhất."},{"n":"Observer","d":"Mẫu cho phép nhiều đối tượng đăng ký nhận thông báo khi trạng thái của một đối tượng thay đổi.","k":"Là nền tảng của lập trình hướng sự kiện và cơ chế publish/subscribe.","c":"Dễ rò rỉ bộ nhớ nếu không hủy đăng ký; thứ tự thông báo không nên được giả định.","e":"Khi trạng thái đơn nghỉ phép đổi sang ‘Đã duyệt’, các bộ lắng nghe cập nhật lịch nhóm và gửi email cho nhân viên."},{"n":"Strategy","d":"Mẫu đóng gói một họ thuật toán có thể thay thế cho nhau và chọn thuật toán lúc chạy.","k":"Thay chuỗi if-else dài bằng các lớp chiến lược riêng, dễ thêm chiến lược mới.","c":"Nếu chỉ có hai nhánh ổn định thì một câu lệnh điều kiện đơn giản dễ đọc hơn.","e":"Các chiến lược tính phí chuyển tiền: nội bộ, liên ngân hàng, quốc tế, được chọn theo loại giao dịch."},{"n":"Repository","d":"Mẫu cung cấp giao diện giống tập hợp để truy cập dữ liệu, tách logic nghiệp vụ khỏi chi tiết lưu trữ.","k":"Giúp kiểm thử nghiệp vụ bằng repository giả và đổi công nghệ lưu trữ ít ảnh hưởng hơn.","c":"Repository chung chung cho mọi bảng thường thành lớp bọc thừa quanh ORM; nên thiết kế theo nhu cầu truy vấn của miền nghiệp vụ.","e":"EmployeeRepository cung cấp findByDepartment và findActiveManagers, ẩn câu SQL phía sau."}]},{"id":"testing","title":"Kiểm thử phần mềm","summary":"Đánh giá phần mềm để phát hiện lỗi và cung cấp thông tin về chất lượng.","points":["Kiểm thử chỉ ra sự có mặt của lỗi, không chứng minh được phần mềm không có lỗi.","Tháp kiểm thử: nhiều unit test nhanh, ít kiểm thử end-to-end chậm.","Kỹ thuật thiết kế ca kiểm thử: phân vùng tương đương, giá trị biên, bảng quyết định."],"children":["Unit test","Integration test","System test (SIT)","User acceptance test (UAT)","Kiểm thử hồi quy","Kiểm thử hiệu năng","Tự động hóa kiểm thử"],"sub":[{"n":"Unit test","d":"Kiểm thử đơn vị mã nhỏ nhất như hàm hoặc lớp, cô lập khỏi CSDL, mạng và hệ thống ngoài.","k":"Chạy nhanh (mili giây), chạy mỗi lần build; là lớp đáy của tháp kiểm thử.","c":"Độ phủ mã cao không đồng nghĩa với kiểm thử tốt; cần kiểm tra cả giá trị biên và trường hợp lỗi.","e":"Unit test cho hàm tính ngày phép còn lại với các trường hợp nhân viên mới vào, nghỉ không lương và năm nhuận."},{"n":"Integration test","d":"Kiểm thử sự phối hợp giữa các thành phần hoặc với hệ thống ngoài như CSDL, API, hàng đợi.","k":"Phát hiện lỗi giao diện: sai định dạng, sai hợp đồng API, sai cấu hình kết nối.","c":"Môi trường tích hợp không ổn định làm kết quả chập chờn; cần dữ liệu kiểm thử và stub rõ ràng.","e":"Kiểm thử dịch vụ nhân sự gọi API chấm công thật trên môi trường SIT và ghi đúng dữ liệu vào CSDL."},{"n":"System test (SIT)","d":"Kiểm thử tích hợp hệ thống (SIT): kiểm tra toàn bộ hệ thống theo đặc tả chức năng và phi chức năng, thường do QA thực hiện.","k":"Dựa trên FSD và RTM; bao gồm luồng end-to-end, tích hợp với hệ thống liên quan, bảo mật và hiệu năng cơ bản.","c":"Bắt đầu SIT khi chưa đạt tiêu chí đầu vào (build ổn định, dữ liệu sẵn sàng) gây lãng phí và báo lỗi giả.","e":"Chạy 180 ca SIT cho module lương, bao gồm luồng tính lương, hạch toán sang hệ thống kế toán và xuất file ngân hàng."},{"n":"User acceptance test (UAT)","d":"Kiểm thử chấp nhận người dùng: người dùng nghiệp vụ xác nhận hệ thống đáp ứng nhu cầu thực tế trước khi go-live.","k":"Kịch bản theo quy trình nghiệp vụ thật chứ không theo màn hình; kết quả là biên bản nghiệm thu có chữ ký.","c":"UAT không phải lần kiểm thử đầu tiên; lỗi kỹ thuật cơ bản phải được loại bỏ ở SIT.","e":"Phòng Nhân sự chạy kịch bản kỳ lương tháng mẫu từ nhập công đến duyệt bảng lương và ký biên bản UAT."},{"n":"Kiểm thử hồi quy","d":"Chạy lại các ca kiểm thử đã đạt để bảo đảm thay đổi mới không làm hỏng chức năng cũ.","k":"Nên tự động hóa và chạy thường xuyên; ưu tiên các luồng nghiệp vụ trọng yếu.","c":"Bộ hồi quy phình to mà không được dọn dẹp sẽ chạy chậm và nhiều ca lỗi thời.","e":"Sau khi sửa quy tắc thuế, chạy bộ hồi quy 60 ca tự động cho toàn bộ luồng tính lương."},{"n":"Kiểm thử hiệu năng","d":"Đánh giá tốc độ, khả năng chịu tải và độ ổn định của hệ thống dưới các mức tải khác nhau.","k":"Các loại chính: load test (tải dự kiến), stress test (vượt tải), soak test (tải kéo dài), spike test (tăng đột ngột).","c":"Kiểm thử trên môi trường cấu hình khác xa production cho kết quả khó tin cậy; cần tiêu chí đạt định lượng từ NFR.","e":"Mô phỏng 1.000 người dùng đồng thời tra cứu phiếu lương ngày trả lương, mục tiêu 95% phản hồi dưới 3 giây."},{"n":"Tự động hóa kiểm thử","d":"Dùng công cụ và script để thực thi kiểm thử, so sánh kết quả và báo cáo tự động.","k":"Hiệu quả nhất với ca lặp lại nhiều lần: hồi quy, API, dữ liệu; tích hợp vào CI pipeline.","c":"Tự động hóa giao diện dễ vỡ khi UI thay đổi; ưu tiên tự động ở tầng API và unit trước.","e":"Bộ Playwright chạy 40 luồng chính mỗi đêm, kèm Postman collection kiểm thử 120 API trong pipeline."}]},{"id":"devops","title":"DevOps và CI/CD","summary":"Văn hóa và thực hành rút ngắn khoảng cách giữa phát triển và vận hành.","points":["Tích hợp liên tục phát hiện lỗi tích hợp ngay khi mã được đẩy lên.","Triển khai liên tục đòi hỏi kiểm thử tự động và khả năng hoàn tác nhanh.","Các chỉ số DORA đo hiệu quả giao phần mềm."],"children":["Git và quản lý mã nguồn","CI pipeline","CD và chiến lược phát hành","Infrastructure as Code","Container","Chỉ số DORA"],"sub":[{"n":"Git và quản lý mã nguồn","d":"Git là hệ thống quản lý phiên bản phân tán; mọi thay đổi mã được ghi nhận qua commit có tác giả, thời gian và nội dung.","k":"Làm việc qua nhánh và pull request để review trước khi hợp nhất; commit nhỏ, thông điệp rõ.","c":"Không lưu mật khẩu, khóa hoặc dữ liệu khách hàng trong repository; đã commit thì vẫn còn trong lịch sử.","e":"Mỗi tính năng làm trên nhánh feature, tạo pull request liên kết work item trên Azure DevOps, cần hai người review."},{"n":"CI pipeline","d":"Chuỗi bước tự động chạy mỗi khi mã được đẩy: build, kiểm thử đơn vị, phân tích tĩnh, quét bảo mật, đóng gói.","k":"Phản hồi phải nhanh (vài phút); build hỏng được ưu tiên sửa ngay.","c":"Pipeline chậm hoặc chập chờn khiến nhóm bỏ qua kết quả; cần theo dõi và tối ưu thời gian chạy.","e":"Azure Pipelines chạy build .NET, 800 unit test, quét SonarQube và chặn hợp nhất nếu có lỗi bảo mật mức cao."},{"n":"CD và chiến lược phát hành","d":"CD tự động đưa bản build đã kiểm định qua các môi trường tới production. Chiến lược phát hành giảm rủi ro khi đưa thay đổi đến người dùng.","k":"Các chiến lược phổ biến: blue-green, canary, rolling, feature flag. Luôn có phương án hoàn tác (rollback).","c":"Continuous Delivery (sẵn sàng phát hành, còn bước duyệt thủ công) khác Continuous Deployment (tự động lên production).","e":"Phát hành canary cho 5% người dùng ứng dụng di động, theo dõi tỷ lệ lỗi 2 giờ rồi mở rộng dần."},{"n":"Infrastructure as Code","d":"Quản lý hạ tầng bằng mã khai báo, được phiên bản hóa và review như mã ứng dụng.","k":"Môi trường tái tạo được, nhất quán giữa dev, SIT, UAT, production; thay đổi hạ tầng có lịch sử.","c":"Sửa tay trên môi trường làm lệch cấu hình so với mã (drift); cần quy tắc mọi thay đổi đi qua mã.","e":"Terraform định nghĩa mạng, máy chủ ứng dụng và CSDL cho môi trường UAT; Ansible cấu hình hệ điều hành."},{"n":"Container","d":"Đóng gói ứng dụng cùng thư viện phụ thuộc thành image chạy nhất quán trên mọi môi trường; Kubernetes điều phối container ở quy mô lớn.","k":"Khởi động nhanh, tận dụng tài nguyên tốt hơn máy ảo; image bất biến, cấu hình truyền qua biến môi trường.","c":"Image cần được quét lỗ hổng và lấy từ nguồn tin cậy; container dùng chung nhân hệ điều hành nên cô lập kém hơn máy ảo.","e":"Dịch vụ API được đóng gói Docker, triển khai trên cụm Kubernetes với 3 bản sao và tự mở rộng theo CPU."},{"n":"Chỉ số DORA","d":"Nhóm chỉ số đo hiệu quả giao phần mềm do chương trình nghiên cứu DORA phát triển.","k":"Bốn chỉ số cốt lõi: tần suất triển khai, thời gian từ commit đến production, tỷ lệ thay đổi gây lỗi, thời gian khôi phục dịch vụ.","c":"Dùng chỉ số để cải tiến nhóm, không dùng để xếp hạng hay phạt; khi chỉ số thành chỉ tiêu, người ta sẽ tối ưu con số thay vì kết quả.","e":"Nhóm đo được thời gian từ commit đến production giảm từ 3 tuần xuống 4 ngày sau khi tự động hóa kiểm thử hồi quy."}]},{"id":"scm","title":"Quản lý cấu hình và phát hành","summary":"Kiểm soát phiên bản, baseline và thay đổi của mọi sản phẩm công việc.","points":["Mọi thứ cần phiên bản hóa: mã, cấu hình, tài liệu, script cơ sở dữ liệu.","Chiến lược nhánh như trunk-based hay GitFlow ảnh hưởng tốc độ tích hợp.","Baseline là mốc đã phê duyệt dùng để kiểm soát thay đổi."],"children":["Kiểm soát phiên bản","Chiến lược nhánh","Baseline","Kiểm soát thay đổi","Semantic Versioning"],"sub":[{"n":"Kiểm soát phiên bản","d":"Ghi nhận và quản lý mọi phiên bản của sản phẩm công việc để biết ai đổi gì, khi nào, vì sao, và khôi phục được.","k":"Áp dụng cho cả mã, script CSDL, cấu hình, tài liệu yêu cầu và thiết kế.","c":"Tài liệu lưu dạng file đặt tên ‘ban_cuoi_v3_final’ trên ổ chung là dấu hiệu thiếu kiểm soát phiên bản.","e":"BRD lưu trên SharePoint có lịch sử phiên bản; script CSDL lưu trong Git cùng mã ứng dụng."},{"n":"Chiến lược nhánh","d":"Quy ước tạo, đặt tên và hợp nhất nhánh trong kho mã.","k":"Trunk-based: nhánh ngắn, hợp nhất về nhánh chính hằng ngày, phù hợp CI/CD. GitFlow: nhánh develop, release, hotfix, phù hợp phát hành theo lịch.","c":"Nhánh sống lâu nhiều tuần gây xung đột lớn khi hợp nhất; nên dùng feature flag thay vì giữ nhánh dài.","e":"Nhóm dùng nhánh main, nhánh feature ngắn dưới 3 ngày, nhánh release chỉ tạo khi chuẩn bị đợt phát hành."},{"n":"Baseline","d":"Phiên bản đã được xem xét và phê duyệt của một sản phẩm công việc, làm mốc để kiểm soát thay đổi về sau.","k":"Sau baseline, mọi thay đổi phải qua quy trình kiểm soát thay đổi.","c":"Baseline quá sớm khi yêu cầu còn biến động sinh ra quá nhiều CR; baseline quá muộn thì mất kiểm soát.","e":"BRD v1.0 được baseline sau khi đơn vị nghiệp vụ ký duyệt; từ đó mọi điều chỉnh đi qua CR."},{"n":"Kiểm soát thay đổi","d":"Quy trình đánh giá và phê duyệt thay đổi đối với các hạng mục cấu hình đã baseline.","k":"Mỗi thay đổi có yêu cầu, phân tích ảnh hưởng, người phê duyệt và bằng chứng triển khai.","c":"Quy trình quá nặng cho thay đổi nhỏ khiến mọi người tìm cách lách; nên phân loại mức độ.","e":"Thay đổi cấu hình tham số lãi suất trên hệ thống lõi phải qua phê duyệt của đơn vị nghiệp vụ và CAB."},{"n":"Semantic Versioning","d":"Quy ước đánh số phiên bản MAJOR.MINOR.PATCH, trong đó MAJOR tăng khi phá vỡ tương thích, MINOR khi thêm tính năng tương thích, PATCH khi sửa lỗi.","k":"Giúp bên sử dụng API hoặc thư viện đoán được mức rủi ro khi nâng cấp.","c":"Chỉ có ý nghĩa khi nhóm tuân thủ nghiêm; tăng MINOR mà vẫn phá vỡ tương thích làm mất niềm tin.","e":"Thư viện chung nâng từ 2.3.1 lên 2.4.0 khi thêm hàm mới, lên 3.0.0 khi đổi chữ ký hàm cũ."}]},{"id":"quality","title":"Chất lượng và cải tiến quy trình","summary":"Mô hình và chuẩn đánh giá chất lượng sản phẩm cùng năng lực quy trình.","points":["ISO/IEC 25010 định nghĩa các đặc tính chất lượng sản phẩm phần mềm.","CMMI đánh giá mức trưởng thành quy trình của tổ chức.","Review mã và phân tích tĩnh là biện pháp chất lượng có chi phí thấp."],"children":["ISO/IEC 25010","CMMI","Review mã","Phân tích tĩnh","Đo lường phần mềm","Nợ kỹ thuật"],"sub":[{"n":"ISO/IEC 25010","d":"Mô hình chất lượng sản phẩm phần mềm, định nghĩa các đặc tính như phù hợp chức năng, hiệu năng, tương thích, khả dụng, tin cậy, bảo mật, bảo trì, khả chuyển.","k":"Bản 2023 bổ sung đặc tính an toàn (safety) và điều chỉnh một số tên gọi so với bản 2011.","c":"Mô hình là danh mục tham chiếu; mỗi dự án cần chọn đặc tính quan trọng và đặt chỉ số đo cụ thể.","e":"Khi viết NFR, BA đi qua từng đặc tính của ISO/IEC 25010 để hỏi nghiệp vụ, tránh bỏ sót bảo mật hay khả năng phục hồi."},{"n":"CMMI","d":"Mô hình trưởng thành năng lực đánh giá và cải tiến quy trình của tổ chức; CMMI V3.0 do ISACA quản lý.","k":"Mức trưởng thành từ 1 đến 5; mức 2 tập trung quản lý ở cấp dự án (kế hoạch, theo dõi, quản lý cấu hình, đảm bảo chất lượng), mức 3 chuẩn hóa quy trình toàn tổ chức.","c":"Chạy theo chứng nhận mà không thay đổi cách làm thực tế tạo ra quy trình trên giấy.","e":"Tổ chức ở mức 2 hướng tới mức 3 bằng cách chuẩn hóa bộ quy trình và template BA, QA dùng chung cho mọi dự án."},{"n":"Review mã","d":"Hoạt động đồng nghiệp đọc và góp ý mã trước khi hợp nhất.","k":"Phát hiện lỗi logic, vấn đề bảo mật và lan tỏa kiến thức trong nhóm; hiệu quả nhất với thay đổi nhỏ dưới vài trăm dòng.","c":"Review hình thức, chỉ bấm duyệt, hoặc tập trung tranh luận về định dạng mã thay vì thiết kế. Định dạng nên giao cho công cụ tự động.","e":"Mỗi pull request cần một người review, có checklist về xử lý lỗi, log dữ liệu nhạy cảm và kiểm thử kèm theo."},{"n":"Phân tích tĩnh","d":"Phân tích mã nguồn mà không chạy chương trình để phát hiện lỗi, mùi mã, lỗ hổng bảo mật và vi phạm quy chuẩn.","k":"Chạy tự động trong CI với quality gate; chi phí thấp, phát hiện sớm.","c":"Bật mọi quy tắc với dự án cũ sinh hàng nghìn cảnh báo và nhóm bỏ qua; nên áp dụng cho mã mới trước.","e":"SonarQube chặn hợp nhất nếu mã mới có lỗ hổng mức cao hoặc độ phủ kiểm thử dưới 70%."},{"n":"Đo lường phần mềm","d":"Thu thập và phân tích số liệu về sản phẩm và quy trình phần mềm để ra quyết định.","k":"Chỉ số phổ biến: mật độ lỗi, tỷ lệ lỗi lọt qua SIT, độ phủ kiểm thử, độ phức tạp, lead time. Nên theo mô hình mục tiêu, câu hỏi, chỉ số (GQM).","c":"Đo nhiều chỉ số mà không ai dùng để ra quyết định là lãng phí; chỉ số bị gắn với thưởng phạt sẽ bị làm đẹp.","e":"Theo dõi tỷ lệ lỗi phát hiện ở UAT so với SIT qua các dự án để đánh giá hiệu quả SIT."},{"n":"Nợ kỹ thuật","d":"Chi phí phát sinh trong tương lai do chọn giải pháp nhanh thay vì giải pháp tốt; ‘lãi’ là công sức bảo trì tăng thêm theo thời gian.","k":"Cần hiển thị nợ trong backlog, ước lượng chi phí và trả dần theo kế hoạch, ví dụ dành một tỷ lệ năng lực mỗi sprint.","c":"Không phải mọi mã xấu đều là nợ cần trả ngay; ưu tiên phần hay thay đổi và rủi ro cao.","e":"Ghi nhận nợ ‘logic tính phép lặp ở 3 nơi’ vào backlog, trả trong sprint trước khi triển khai quy định phép mới."}]},{"id":"maintenance","title":"Bảo trì và tiến hóa phần mềm","summary":"Sửa lỗi, thích ứng và cải tiến phần mềm sau khi đưa vào vận hành.","points":["Chi phí bảo trì thường chiếm phần lớn tổng chi phí vòng đời.","Tái cấu trúc (refactoring) cải thiện mã mà không đổi hành vi.","Hiện đại hóa hệ thống cũ cần chiến lược từng bước như mẫu strangler fig."],"children":["Bảo trì sửa lỗi","Bảo trì thích ứng","Refactoring","Hệ thống kế thừa (legacy)","Mẫu strangler fig"],"sub":[{"n":"Bảo trì sửa lỗi","d":"Sửa lỗi được phát hiện sau khi phần mềm đã vận hành.","k":"Cần phân loại mức độ nghiêm trọng, tìm nguyên nhân gốc và bổ sung ca kiểm thử hồi quy tương ứng.","c":"Sửa nóng trên production mà không qua quy trình làm phát sinh lỗi mới và lệch cấu hình.","e":"Lỗi làm tròn sai tiền phụ cấp được sửa trong bản vá, kèm unit test cho các trường hợp làm tròn."},{"n":"Bảo trì thích ứng","d":"Điều chỉnh phần mềm để thích ứng với thay đổi môi trường: hệ điều hành, nền tảng, quy định pháp luật, hệ thống tích hợp.","k":"Thường có hạn chót bên ngoài không thương lượng được, như ngày hiệu lực của văn bản pháp luật.","c":"Dễ bị đánh giá thấp khối lượng; cần phân tích ảnh hưởng sớm khi có thông tin thay đổi.","e":"Cập nhật phần mềm nhân sự khi mức lương cơ sở hoặc quy định thuế thu nhập cá nhân thay đổi."},{"n":"Refactoring","d":"Cải thiện cấu trúc bên trong của mã mà không thay đổi hành vi bên ngoài.","k":"Thực hiện từng bước nhỏ, có kiểm thử bảo vệ; các kỹ thuật phổ biến: tách hàm, đổi tên, loại bỏ trùng lặp.","c":"Refactoring không có kiểm thử là đánh cược; trộn refactoring với thêm tính năng trong cùng một thay đổi làm khó review.","e":"Tách hàm tính lương 400 dòng thành các hàm nhỏ, chạy bộ unit test sau mỗi bước."},{"n":"Hệ thống kế thừa (legacy)","d":"Hệ thống cũ vẫn đang phục vụ nghiệp vụ trọng yếu nhưng công nghệ lạc hậu, tài liệu thiếu và khó thay đổi.","k":"Chiến lược hiện đại hóa: giữ nguyên, bọc API, tái cấu trúc, thay thế từng phần hoặc thay toàn bộ; chọn theo giá trị và rủi ro.","c":"Thay thế toàn bộ một lần (big bang) có rủi ro rất cao; tri thức nghiệp vụ ẩn trong mã cũ thường bị bỏ sót.","e":"Hệ thống báo cáo cũ viết bằng công nghệ không còn hỗ trợ được bọc bằng lớp API trước khi thay thế dần."},{"n":"Mẫu strangler fig","d":"Mẫu hiện đại hóa: xây dần hệ thống mới bao quanh hệ thống cũ, chuyển từng chức năng sang, đến khi hệ thống cũ có thể tắt.","k":"Cần một lớp định tuyến (như API gateway) để quyết định yêu cầu đi vào hệ thống cũ hay mới.","c":"Phải xử lý đồng bộ dữ liệu giữa hai hệ thống trong giai đoạn chuyển tiếp; cần kế hoạch tắt hệ thống cũ rõ ràng.","e":"Chuyển chức năng tra cứu trước, rồi phê duyệt, cuối cùng là tính toán; mỗi bước định tuyến lại qua gateway."}]},{"id":"pm","title":"Quản lý dự án phần mềm","summary":"Lập kế hoạch, ước lượng, theo dõi và điều phối để giao sản phẩm đúng mục tiêu.","points":["Ước lượng là dự báo có độ bất định, cần cập nhật liên tục.","Rủi ro phải được nhận diện và quản lý chủ động.","Vai trò và điểm bàn giao rõ ràng (RACI, DoR, DoD) giảm xung đột giữa các nhóm."],"children":["Ước lượng","Kế hoạch và backlog","Quản lý rủi ro","Ma trận RACI","Definition of Ready","Definition of Done"],"sub":[{"n":"Ước lượng","d":"Dự báo công sức, thời gian và chi phí cần thiết, kèm mức độ bất định.","k":"Kỹ thuật: story point và planning poker, ước lượng ba điểm (PERT), theo tương tự, phân rã WBS. Nên ước lượng theo khoảng.","c":"Ước lượng bị biến thành cam kết cứng ngay từ đầu, khi hiểu biết còn ít nhất, là nguồn gốc của nhiều dự án trễ.","e":"Ước lượng module theo ba điểm: lạc quan 20, khả dĩ 30, bi quan 50 ngày công; kỳ vọng khoảng 31,7 ngày."},{"n":"Kế hoạch và backlog","d":"Kế hoạch xác định phạm vi, mốc và nguồn lực; backlog là danh sách hạng mục được sắp xếp theo ưu tiên.","k":"Backlog được làm mịn liên tục: hạng mục gần thì chi tiết, hạng mục xa thì thô. Ưu tiên theo giá trị, rủi ro, phụ thuộc (ví dụ WSJF, MoSCoW).","c":"Backlog hàng trăm hạng mục không ai xem là kho rác; cần dọn định kỳ.","e":"Product Owner sắp xếp backlog theo WSJF trước mỗi PI; 2 sprint tới được làm mịn đến mức đạt DoR."},{"n":"Quản lý rủi ro","d":"Nhận diện, phân tích, ứng phó và theo dõi các sự kiện không chắc chắn có thể ảnh hưởng mục tiêu dự án.","k":"Mỗi rủi ro có xác suất, tác động, người chịu trách nhiệm và phương án ứng phó: tránh, giảm, chuyển giao, chấp nhận.","c":"Sổ rủi ro chỉ lập lúc khởi động rồi bỏ đó; rủi ro cần được rà soát định kỳ trong họp dự án.","e":"Rủi ro ‘hệ thống chấm công bên ngoài chậm cung cấp API’, giảm thiểu bằng mock API và mốc cam kết với nhà cung cấp."},{"n":"Ma trận RACI","d":"Ma trận phân vai trò cho từng hoạt động: Responsible (thực hiện), Accountable (chịu trách nhiệm cuối cùng), Consulted (được hỏi ý kiến), Informed (được thông báo).","k":"Mỗi hoạt động chỉ nên có đúng một A; làm rõ điểm bàn giao giữa các vai trò.","c":"Quá nhiều C làm chậm quyết định; RACI không được thống nhất với các bên thì không có hiệu lực.","e":"Với hoạt động phê duyệt BRD: BA là R, Giám đốc khối nghiệp vụ là A, Kiến trúc sư và Bảo mật là C, PMO là I."},{"n":"Definition of Ready","d":"Tiêu chí một hạng mục phải đạt trước khi được đưa vào sprint hoặc giao cho phát triển.","k":"Thường gồm: mô tả rõ, có tiêu chí chấp nhận, đã ước lượng, đã xác định phụ thuộc, có thiết kế giao diện nếu cần.","c":"DoR quá nặng biến thành cổng Waterfall; giữ DoR ngắn gọn và thống nhất giữa BA, Dev, QA.","e":"Story chỉ vào sprint khi có tiêu chí chấp nhận Given When Then, mockup đã duyệt và API phụ thuộc đã có đặc tả."},{"n":"Definition of Done","d":"Tiêu chí chung một hạng mục phải đạt để được coi là hoàn thành.","k":"Thường gồm: mã đã review, kiểm thử đạt, không còn lỗi nghiêm trọng, tài liệu cập nhật, đã triển khai lên môi trường kiểm thử.","c":"DoD khác tiêu chí chấp nhận: DoD áp dụng cho mọi hạng mục, tiêu chí chấp nhận riêng cho từng story.","e":"DoD của nhóm: pull request được duyệt, pipeline xanh, SIT đạt, không có lỗi mức cao mở, release note đã cập nhật."}]}],"concepts":[{"term":"Yêu cầu phi chức năng (Non-functional requirement)","def":"Tiêu chí về cách hệ thống vận hành như hiệu năng, bảo mật, khả dụng, khả năng mở rộng.","ex":"Màn hình tra cứu phản hồi dưới 2 giây với 500 người dùng đồng thời.","mis":"Là chi tiết kỹ thuật để xử lý sau. Yêu cầu phi chức năng thường quyết định kiến trúc nên phải xác định sớm."},{"term":"Truy vết yêu cầu (Traceability)","def":"Khả năng liên kết yêu cầu với thiết kế, mã nguồn và ca kiểm thử.","ex":"Mỗi yêu cầu nghiệp vụ trong BRD gắn với ca kiểm thử UAT tương ứng.","mis":"Chỉ phục vụ kiểm toán. Truy vết giúp phân tích ảnh hưởng mỗi khi yêu cầu thay đổi."},{"term":"Liên kết lỏng, gắn kết cao (Loose coupling, High cohesion)","def":"Các thành phần phụ thuộc ít vào nhau và mỗi thành phần tập trung vào một trách nhiệm.","ex":"Mô-đun tính phí tách biệt khỏi mô-đun gửi thông báo.","mis":"Microservices tự động mang lại liên kết lỏng. Chia dịch vụ sai ranh giới tạo ra một hệ phân tán liên kết chặt."},{"term":"Nợ kỹ thuật (Technical debt)","def":"Chi phí phát sinh trong tương lai do chọn giải pháp nhanh thay vì giải pháp tốt.","ex":"Sao chép mã thay vì tách hàm dùng chung để kịp hạn.","mis":"Mọi nợ kỹ thuật đều xấu. Nợ có chủ đích và có kế hoạch trả là một công cụ kinh doanh hợp lý."},{"term":"Tháp kiểm thử (Test pyramid)","def":"Mô hình phân bổ nhiều kiểm thử đơn vị nhanh và ít kiểm thử end-to-end chậm.","ex":"Phần lớn là unit test, một phần integration test và số ít kiểm thử giao diện end-to-end.","mis":"Tỷ lệ là quy tắc cứng. Đây là định hướng; tỷ lệ thực tế tùy kiến trúc."},{"term":"Phân tích giá trị biên (Boundary value analysis)","def":"Kỹ thuật thiết kế ca kiểm thử tại và quanh ranh giới của miền giá trị.","ex":"Hạn mức hợp lệ từ 1 đến 500 triệu thì kiểm thử 0, 1, 500 và 501 triệu.","mis":"Chỉ cần kiểm thử giá trị ở giữa khoảng. Lỗi thường tập trung ở biên."},{"term":"Tích hợp liên tục (Continuous Integration)","def":"Thực hành tích hợp mã vào nhánh chung thường xuyên, mỗi lần đều tự động build và kiểm thử.","ex":"Mỗi pull request chạy pipeline build, unit test và phân tích tĩnh.","mis":"Có công cụ CI là đã làm CI. Cần tích hợp thường xuyên và sửa build hỏng ngay lập tức."},{"term":"Definition of Done (DoD)","def":"Tiêu chí chung mà một hạng mục phải đạt trước khi được coi là hoàn thành.","ex":"Mã đã review, kiểm thử đạt, tài liệu đã cập nhật, đã triển khai lên môi trường kiểm thử.","mis":"Done là lập trình xong. DoD bao gồm cả chất lượng và khả năng phát hành."},{"term":"Refactoring","def":"Thay đổi cấu trúc mã để dễ hiểu, dễ sửa hơn mà không thay đổi hành vi bên ngoài.","ex":"Tách hàm 300 dòng thành các hàm nhỏ có tên rõ nghĩa.","mis":"Refactoring là viết lại. Refactoring đi từng bước nhỏ và luôn có kiểm thử bảo vệ."},{"term":"Chỉ số DORA","def":"Nhóm chỉ số đo hiệu quả giao phần mềm, cốt lõi gồm tần suất triển khai, thời gian từ commit đến vận hành, tỷ lệ thay đổi gây lỗi và thời gian khôi phục.","ex":"Nhóm triển khai hằng tuần và khôi phục sự cố trong vòng một giờ.","mis":"Tốc độ và ổn định luôn đối nghịch. Nghiên cứu DORA cho thấy các nhóm tốt đạt được cả hai."}],"path":{"foundation":{"goal":"Viết mã sạch và làm việc được với công cụ nhóm.","topics":["Lập trình hướng đối tượng","Git","Unit test","SDLC và Agile căn bản"],"signal":"Đóng góp tính năng nhỏ qua pull request có kiểm thử và vượt qua review."},"intermediate":{"goal":"Tham gia đầy đủ vòng đời một sản phẩm.","topics":["Kỹ nghệ yêu cầu","Mẫu thiết kế","Kiểm thử tích hợp và hệ thống","CI/CD"],"signal":"Tự nhận một tính năng từ yêu cầu đến triển khai với chất lượng ổn định."},"advanced":{"goal":"Thiết kế hệ thống và nâng chất lượng của nhóm.","topics":["Kiến trúc phần mềm","Hiệu năng và khả năng mở rộng","DevOps và observability","Đo lường chất lượng"],"signal":"Viết ADR, dẫn dắt thiết kế và giảm được tỷ lệ lỗi sau phát hành."},"expert":{"goal":"Định hướng kỹ thuật và quy trình cho tổ chức.","topics":["Kiến trúc doanh nghiệp","Cải tiến quy trình theo CMMI","Hiện đại hóa hệ thống kế thừa","Phát triển đội ngũ"],"signal":"Chuẩn hóa cách làm cho nhiều nhóm và cải thiện đo được các chỉ số giao phần mềm."}},"standards":[{"name":"SWEBOK Guide V4.0 (2024)","note":"Khối kiến thức kỹ nghệ phần mềm của IEEE Computer Society.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC/IEEE 12207:2017","note":"Quy trình vòng đời phần mềm.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC/IEEE 29148:2018","note":"Kỹ nghệ yêu cầu.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC/IEEE 29119","note":"Bộ chuẩn kiểm thử phần mềm.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"ISO/IEC 25010:2023","note":"Mô hình chất lượng sản phẩm.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"CMMI V3.0 (2023)","note":"Mô hình trưởng thành năng lực của ISACA.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"The Scrum Guide (2020)","note":"Định nghĩa chính thức khung Scrum.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"BABOK Guide v3","note":"Khối kiến thức phân tích nghiệp vụ của IIBA.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"tools":[{"group":"Quản lý công việc","items":["Azure DevOps Boards","Jira"]},{"group":"Mã nguồn","items":["Git","GitHub","GitLab","Azure Repos"]},{"group":"CI/CD","items":["Azure Pipelines","GitHub Actions","Jenkins"]},{"group":"Chất lượng mã","items":["SonarQube","ESLint"]},{"group":"Kiểm thử","items":["JUnit","pytest","Selenium","Playwright","JMeter","Postman"]},{"group":"Mô hình hóa","items":["UML","Mô hình C4","draw.io","Mermaid"]}],"certs":[{"name":"ISTQB Certified Tester Foundation Level (CTFL)","note":"Nền tảng kiểm thử phần mềm.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Professional Scrum Master (PSM)","note":"Do Scrum.org cấp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"Certified ScrumMaster (CSM)","note":"Do Scrum Alliance cấp.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"PMI-ACP","note":"Thực hành Agile của PMI.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"IIBA ECBA / CCBA / CBAP","note":"Các cấp độ chứng chỉ phân tích nghiệp vụ.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"},{"name":"AWS Certified Developer – Associate","note":"Phát triển ứng dụng trên AWS.","checked":"Chưa đối chiếu lại trong đợt rà soát 25/09/2026; theo hiểu biết đến 06/2026"}],"roles":[{"role":"Kỹ sư phần mềm","skills":"Lập trình, thiết kế, kiểm thử đơn vị"},{"role":"Kiến trúc sư phần mềm","skills":"Kiến trúc, đánh đổi, yêu cầu phi chức năng"},{"role":"Chuyên viên phân tích nghiệp vụ (BA)","skills":"Khai thác yêu cầu, mô hình hóa quy trình, truy vết"},{"role":"Kỹ sư kiểm thử (QA)","skills":"Thiết kế ca kiểm thử, tự động hóa kiểm thử"},{"role":"Kỹ sư DevOps","skills":"CI/CD, Infrastructure as Code, container"},{"role":"Scrum Master / Delivery Manager","skills":"Điều phối, tháo gỡ cản trở, cải tiến quy trình"}],"glossary":[["Requirement","Yêu cầu","Điều hệ thống phải làm hoặc phải đạt."],["Acceptance criteria","Tiêu chí chấp nhận","Điều kiện để xác nhận một hạng mục đạt yêu cầu."],["Backlog","Danh sách hạng mục tồn đọng","Danh sách công việc đã được sắp xếp ưu tiên."],["Sprint","Vòng lặp phát triển","Khung thời gian cố định trong Scrum, thường 1 đến 4 tuần."],["Pull request","Yêu cầu hợp nhất mã","Đề nghị đưa thay đổi vào nhánh chung, kèm review."],["Regression","Hồi quy","Lỗi mới xuất hiện ở chức năng từng hoạt động đúng."],["Release","Phát hành","Đưa một phiên bản phần mềm tới người dùng."],["Baseline","Đường cơ sở","Phiên bản đã phê duyệt làm mốc kiểm soát thay đổi."],["Refactoring","Tái cấu trúc mã","Cải thiện cấu trúc mã mà không đổi hành vi."],["Technical debt","Nợ kỹ thuật","Chi phí tương lai của giải pháp tạm thời."]],"quiz":[{"q":"Với khoảng giá trị hợp lệ từ 1 đến 100, kỹ thuật giá trị biên đề xuất kiểm thử những giá trị nào?","o":["Chỉ 50","0, 1, 100 và 101","Chỉ 1 và 100","Mọi giá trị từ 1 đến 100"],"a":1,"e":"Kiểm thử ngay tại biên và ngay ngoài biên ở cả hai phía."},{"q":"Yêu cầu ‘hệ thống phục vụ 1.000 người dùng đồng thời’ thuộc loại nào?","o":["Yêu cầu chức năng","Yêu cầu phi chức năng","Quy tắc nghiệp vụ","User story"],"a":1,"e":"Đây là yêu cầu về hiệu năng, tức mô tả cách hệ thống vận hành chứ không phải chức năng."},{"q":"Mục đích chính của tích hợp liên tục (CI) là gì?","o":["Tự động triển khai lên production","Phát hiện sớm lỗi tích hợp bằng build và kiểm thử tự động mỗi lần tích hợp","Thay thế hoàn toàn kiểm thử thủ công","Quản lý backlog"],"a":1,"e":"Tự động triển khai thuộc về CD; CI tập trung vào tích hợp thường xuyên có kiểm tra tự động."},{"q":"Refactoring đúng nghĩa là gì?","o":["Thêm tính năng mới","Thay đổi cấu trúc mã mà giữ nguyên hành vi","Viết lại toàn bộ hệ thống","Sửa lỗi trên production"],"a":1,"e":"Refactoring không thay đổi hành vi bên ngoài, chỉ cải thiện cấu trúc bên trong."},{"q":"Chỉ số nào KHÔNG thuộc nhóm chỉ số DORA cốt lõi?","o":["Tần suất triển khai","Thời gian khôi phục sau sự cố","Số dòng mã viết mỗi ngày","Tỷ lệ thay đổi gây lỗi"],"a":2,"e":"Số dòng mã không phản ánh giá trị hay chất lượng giao phần mềm."}],"links":[{"to":"it","why":"Vận hành, ITSM và hạ tầng tiếp nhận phần mềm sau khi triển khai."},{"to":"sec","why":"Bảo mật cần được tích hợp vào SDLC theo hướng DevSecOps."},{"to":"cs","why":"Giải thuật và hệ thống máy tính là nền kỹ thuật của phần mềm."},{"to":"eng","why":"Kỹ thuật hệ thống và mô hình chữ V có chung nguồn gốc."}]},{"id":"it","code":"IV.4","title":"IT","vi":"Công nghệ thông tin","summary":"Công nghệ thông tin (Information Technology) là việc sử dụng máy tính, mạng, phần mềm và dịch vụ để lưu trữ, xử lý, truyền tải thông tin và vận hành dịch vụ số cho tổ chức.","diff":["Khác Software Engineering: kỹ nghệ phần mềm xây dựng phần mềm; IT lựa chọn, tích hợp, vận hành và hỗ trợ phần mềm cùng hạ tầng để phục vụ người dùng.","Khác Computer Science: khoa học máy tính nghiên cứu nền tảng; IT tập trung vào độ sẵn sàng, chi phí và chất lượng dịch vụ.","Quản trị CNTT gắn công nghệ với mục tiêu kinh doanh, khẩu vị rủi ro và yêu cầu tuân thủ của tổ chức."],"topics":[{"id":"infra","title":"Hạ tầng CNTT","summary":"Máy chủ, lưu trữ, mạng và trung tâm dữ liệu làm nền cho mọi dịch vụ.","points":["Ảo hóa tách phần mềm khỏi phần cứng vật lý.","Thiết kế dự phòng (N+1, cụm máy chủ) giảm điểm lỗi đơn.","Năng lực hạ tầng phải được lập kế hoạch trước mức tăng trưởng."],"children":["Máy chủ","Lưu trữ SAN và NAS","Ảo hóa","Trung tâm dữ liệu","Quản lý năng lực"],"sub":[{"n":"Máy chủ","d":"Máy tính chuyên dụng cung cấp tài nguyên tính toán cho ứng dụng và dịch vụ, dạng rack, blade hoặc tower.","k":"Chọn cấu hình theo khối lượng công việc: CPU, RAM, lưu trữ, mạng; cần nguồn dự phòng và quản lý từ xa.","c":"Máy chủ hết hạn hỗ trợ của hãng không còn bản vá bảo mật và linh kiện thay thế.","e":"Lập kế hoạch thay máy chủ CSDL trước ngày hết hỗ trợ phần cứng 12 tháng."},{"n":"Lưu trữ SAN và NAS","d":"SAN là mạng lưu trữ khối tốc độ cao dành cho máy chủ; NAS cung cấp lưu trữ tệp qua mạng thông thường.","k":"SAN phù hợp CSDL và ảo hóa cần hiệu năng cao; NAS phù hợp chia sẻ tệp; RAID bảo vệ dữ liệu khi hỏng đĩa.","c":"RAID không thay thế sao lưu: xóa nhầm hay mã độc mã hóa vẫn lan sang mọi đĩa.","e":"CSDL giao dịch đặt trên SAN tốc độ cao; thư mục dùng chung của phòng ban đặt trên NAS."},{"n":"Ảo hóa","d":"Tạo nhiều máy ảo độc lập trên cùng phần cứng vật lý thông qua hypervisor.","k":"Tăng hiệu suất sử dụng phần cứng, cấp phát nhanh, di chuyển máy ảo khi bảo trì (live migration).","c":"Cấp phát tài nguyên ảo vượt quá phần cứng thật (overcommit) quá mức làm mọi máy ảo cùng chậm.","e":"Cụm 8 máy chủ vật lý chạy 150 máy ảo cho các ứng dụng nội bộ, có HA tự khởi động lại khi một host hỏng."},{"n":"Trung tâm dữ liệu","d":"Cơ sở vật chất chứa hạ tầng CNTT, gồm nguồn điện, làm mát, phòng cháy, an ninh vật lý và kết nối mạng.","k":"Mức Tier (theo Uptime Institute) phân loại khả năng dự phòng; PUE đo hiệu quả năng lượng.","c":"Dự phòng thiết bị nhưng dùng chung một đường cấp điện hay một tuyến cáp vẫn tạo điểm lỗi đơn.","e":"Trung tâm dữ liệu có hai nguồn điện độc lập, UPS, máy phát và hệ thống chữa cháy bằng khí."},{"n":"Quản lý năng lực","d":"Bảo đảm hạ tầng đủ năng lực đáp ứng nhu cầu hiện tại và tương lai với chi phí hợp lý.","k":"Theo dõi xu hướng sử dụng, dự báo tăng trưởng và cảnh báo trước ngưỡng; tính đến đỉnh tải theo mùa.","c":"Chỉ nhìn mức trung bình mà bỏ qua đỉnh tải, như ngày trả lương hay cuối năm tài chính.","e":"Dự báo dung lượng lưu trữ log tăng 30% mỗi năm, lên kế hoạch mở rộng trước khi đạt 80%."}]},{"id":"cloud","title":"Điện toán đám mây","summary":"Mô hình cung cấp tài nguyên CNTT theo nhu cầu qua mạng, trả phí theo mức sử dụng.","points":["Ba mô hình dịch vụ IaaS, PaaS, SaaS phân chia trách nhiệm khác nhau.","Mô hình trách nhiệm chia sẻ quyết định bên nào bảo vệ thành phần nào.","Với ngành tài chính, cần xem xét yêu cầu về vị trí lưu trữ dữ liệu và quản lý thuê ngoài."],"children":["IaaS, PaaS, SaaS","Public, private và hybrid cloud","Trách nhiệm chia sẻ","FinOps","Chuyển đổi lên cloud"],"sub":[{"n":"IaaS, PaaS, SaaS","d":"Ba mô hình dịch vụ cloud: IaaS cung cấp hạ tầng, PaaS cung cấp nền tảng chạy ứng dụng, SaaS cung cấp phần mềm hoàn chỉnh.","k":"Càng lên cao, nhà cung cấp quản lý càng nhiều và khách hàng kiểm soát càng ít.","c":"Chọn PaaS hoặc SaaS có thể phụ thuộc vào nhà cung cấp (vendor lock-in); cần đánh giá khả năng rút lui.","e":"Máy ảo trên Azure là IaaS, Azure SQL Database là PaaS, Microsoft 365 là SaaS."},{"n":"Public, private và hybrid cloud","d":"Public cloud dùng chung hạ tầng nhà cung cấp; private cloud dành riêng cho một tổ chức; hybrid kết hợp cả hai.","k":"Hybrid phổ biến ở ngân hàng: hệ thống lõi tại chỗ, kênh số và phân tích dữ liệu trên cloud.","c":"Kết nối, định danh và giám sát thống nhất giữa các môi trường là thách thức chính của hybrid.","e":"Hệ thống lõi đặt tại trung tâm dữ liệu riêng, ứng dụng học máy chạy trên public cloud qua kết nối riêng."},{"n":"Trách nhiệm chia sẻ","d":"Phân định trách nhiệm bảo mật và vận hành giữa nhà cung cấp cloud và khách hàng.","k":"Nhà cung cấp bảo vệ hạ tầng của cloud; khách hàng bảo vệ những gì mình đặt trên cloud: dữ liệu, danh tính, cấu hình.","c":"Hiểu nhầm ranh giới trách nhiệm là nguyên nhân của nhiều sự cố lộ dữ liệu trên cloud.","e":"Kho lưu trữ đối tượng bị để chế độ công khai là lỗi cấu hình thuộc trách nhiệm của khách hàng."},{"n":"FinOps","d":"Thực hành quản lý tài chính cloud, giúp kỹ thuật, tài chính và nghiệp vụ cùng chịu trách nhiệm về chi phí.","k":"Gắn thẻ tài nguyên theo đơn vị, theo dõi chi phí, tối ưu kích thước, dùng cam kết dài hạn cho tải ổn định.","c":"Tài nguyên thử nghiệm quên tắt là nguồn lãng phí phổ biến nhất.","e":"Tự động tắt môi trường dev và test ngoài giờ làm việc, giảm khoảng 60% chi phí các môi trường này."},{"n":"Chuyển đổi lên cloud","d":"Quá trình đưa ứng dụng và dữ liệu từ hạ tầng tại chỗ lên cloud.","k":"Các chiến lược thường gọi là 6R: rehost, replatform, refactor, repurchase, retire, retain.","c":"Chuyển nguyên trạng (lift and shift) mà không tối ưu thường làm chi phí cao hơn tại chỗ.","e":"Đánh giá danh mục 80 ứng dụng: 20 ứng dụng rehost, 10 refactor, 15 ngừng sử dụng, số còn lại giữ tại chỗ."}]},{"id":"network","title":"Vận hành mạng","summary":"Thiết kế, cấu hình và giám sát mạng doanh nghiệp.","points":["Phân vùng mạng hạn chế phạm vi ảnh hưởng khi có sự cố.","SD-WAN giúp kết nối chi nhánh linh hoạt hơn.","Giám sát băng thông và độ trễ giúp phát hiện sớm suy giảm dịch vụ."],"children":["LAN và WAN","VLAN và phân vùng","Định tuyến và chuyển mạch","SD-WAN","VPN","Giám sát mạng"],"sub":[{"n":"LAN và WAN","d":"LAN là mạng cục bộ trong tòa nhà hoặc khuôn viên; WAN kết nối các địa điểm xa nhau.","k":"LAN tốc độ cao, chi phí thấp; WAN dùng kênh thuê riêng, MPLS hoặc Internet với chi phí và độ trễ cao hơn.","c":"Băng thông WAN là tài nguyên đắt, cần ưu tiên lưu lượng nghiệp vụ trọng yếu.","e":"Mạng LAN chi nhánh nối về trung tâm dữ liệu qua hai đường WAN của hai nhà mạng khác nhau."},{"n":"VLAN và phân vùng","d":"VLAN chia một mạng vật lý thành nhiều mạng logic; phân vùng mạng tách các nhóm hệ thống theo mức tin cậy.","k":"Giảm phạm vi ảnh hưởng khi có sự cố hoặc xâm nhập; kiểm soát lưu lượng giữa vùng bằng tường lửa.","c":"VLAN không phải biện pháp bảo mật đầy đủ nếu định tuyến giữa các VLAN không được kiểm soát.","e":"Tách vùng máy chủ thẻ thanh toán khỏi mạng văn phòng theo yêu cầu phạm vi PCI DSS."},{"n":"Định tuyến và chuyển mạch","d":"Chuyển mạch chuyển khung tin trong cùng mạng theo địa chỉ MAC; định tuyến chuyển gói tin giữa các mạng theo địa chỉ IP.","k":"Giao thức định tuyến động (OSPF, BGP) tự điều chỉnh khi đường đi thay đổi.","c":"Vòng lặp tầng 2 có thể làm sập cả mạng; giao thức Spanning Tree ngăn điều này.","e":"Bộ định tuyến lõi dùng OSPF để tự chuyển sang đường dự phòng khi đường chính mất kết nối."},{"n":"SD-WAN","d":"Mạng WAN định nghĩa bằng phần mềm, quản lý tập trung và tự chọn đường truyền tối ưu cho từng ứng dụng.","k":"Tận dụng nhiều loại kết nối (MPLS, Internet, 4G); chính sách theo ứng dụng; triển khai chi nhánh nhanh.","c":"Đưa lưu lượng qua Internet cần mã hóa và kiểm soát bảo mật tương đương kênh riêng.","e":"Chi nhánh mới được kích hoạt SD-WAN tự động cấu hình chỉ sau khi cắm thiết bị và nhận chính sách từ trung tâm."},{"n":"VPN","d":"Mạng riêng ảo tạo đường hầm mã hóa qua mạng công cộng.","k":"VPN site-to-site nối các địa điểm; VPN truy cập từ xa cho người dùng; giao thức IPsec, TLS.","c":"VPN cấp quyền rộng vào cả mạng nội bộ; xu hướng chuyển sang truy cập theo ứng dụng (ZTNA).","e":"Nhân viên làm việc từ xa kết nối VPN có MFA, chỉ truy cập được các ứng dụng được phân quyền."},{"n":"Giám sát mạng","d":"Theo dõi liên tục trạng thái, hiệu năng và lưu lượng của thiết bị mạng.","k":"Công cụ dùng SNMP, NetFlow, ping và traceroute; cảnh báo khi vượt ngưỡng băng thông, độ trễ, tỷ lệ mất gói.","c":"Chỉ giám sát thiết bị còn sống hay chết mà không đo trải nghiệm ứng dụng.","e":"Cảnh báo khi độ trễ đường WAN tới chi nhánh vượt 100 ms trong 5 phút liên tiếp."}]},{"id":"itsm","title":"Quản lý dịch vụ CNTT (ITSM)","summary":"Cách tổ chức thiết kế, cung cấp và cải tiến dịch vụ CNTT cho người dùng.","points":["ITIL 4 tiếp cận theo hệ thống giá trị dịch vụ và các thực hành quản lý.","Sự cố (incident) cần khôi phục nhanh; vấn đề (problem) cần tìm nguyên nhân gốc.","SLA thống nhất kỳ vọng giữa bên cung cấp và người sử dụng dịch vụ."],"children":["Service desk","Quản lý sự cố","Quản lý vấn đề","Quản lý thay đổi","Danh mục dịch vụ","SLA và OLA"],"sub":[{"n":"Service desk","d":"Điểm tiếp nhận duy nhất giữa bộ phận CNTT và người dùng, xử lý yêu cầu và sự cố.","k":"Phân loại, ưu tiên, giải quyết ngay ở cấp 1 nếu được, chuyển cấp khi cần; đo tỷ lệ giải quyết ngay lần đầu.","c":"Thiếu cơ sở tri thức làm cấp 1 chuyển hầu hết yêu cầu lên cấp 2, gây quá tải.","e":"Service desk có cổng tự phục vụ cho yêu cầu cấp lại mật khẩu, giảm 30% cuộc gọi."},{"n":"Quản lý sự cố","d":"Thực hành khôi phục dịch vụ về trạng thái bình thường nhanh nhất có thể khi có gián đoạn.","k":"Ưu tiên dựa trên mức ảnh hưởng và mức khẩn cấp; sự cố nghiêm trọng có quy trình riêng và trưởng ca xử lý.","c":"Mục tiêu là khôi phục, không phải tìm nguyên nhân gốc; tìm nguyên nhân thuộc quản lý vấn đề.","e":"Sự cố ứng dụng di động không đăng nhập được: chuyển sang máy chủ dự phòng trong 15 phút rồi mới phân tích lỗi."},{"n":"Quản lý vấn đề","d":"Thực hành tìm và loại bỏ nguyên nhân gốc của sự cố để ngăn tái diễn.","k":"Phân tích nguyên nhân gốc bằng 5 Whys, biểu đồ xương cá; quản lý lỗi đã biết (known error) kèm giải pháp tạm.","c":"Đóng vấn đề khi mới có giải pháp tạm mà chưa có kế hoạch sửa triệt để.","e":"Phân tích 12 sự cố treo dịch vụ trong tháng, phát hiện chung một lỗi rò rỉ kết nối CSDL."},{"n":"Quản lý thay đổi","d":"Thực hành đánh giá, phê duyệt và triển khai thay đổi nhằm tăng tỷ lệ thành công và giảm rủi ro.","k":"Phân loại thay đổi chuẩn, thông thường và khẩn cấp với mức phê duyệt khác nhau; có kế hoạch hoàn tác.","c":"Thay đổi khẩn cấp bị lạm dụng để lách quy trình là dấu hiệu quy trình thông thường quá nặng.","e":"Thay đổi chuẩn như vá hệ điều hành hằng tháng được phê duyệt trước; thay đổi cấu hình hệ thống lõi cần CAB."},{"n":"Danh mục dịch vụ","d":"Danh sách các dịch vụ CNTT cung cấp cho người dùng, kèm mô tả, cách yêu cầu, thời gian đáp ứng và chi phí.","k":"Mô tả dịch vụ bằng ngôn ngữ của người dùng, không bằng tên hệ thống kỹ thuật.","c":"Danh mục không được cập nhật khiến người dùng không biết yêu cầu gì, ở đâu.","e":"Dịch vụ ‘Cấp tài khoản cho nhân viên mới’ gồm email, máy tính, quyền ứng dụng, hoàn thành trong 2 ngày làm việc."},{"n":"SLA và OLA","d":"SLA là cam kết với khách hàng; OLA là thỏa thuận giữa các nhóm nội bộ để cùng đạt SLA.","k":"Chỉ số SLA phải đo được từ dữ liệu thực; OLA và hợp đồng với nhà cung cấp phải khớp với SLA.","c":"Cam kết SLA mà không có OLA hỗ trợ thì không nhóm nào thực sự chịu trách nhiệm.","e":"SLA giải quyết sự cố mức 1 trong 4 giờ được hỗ trợ bởi OLA nhóm mạng phản hồi trong 30 phút."}]},{"id":"ea","title":"Kiến trúc doanh nghiệp","summary":"Mô tả và định hướng mối liên kết giữa chiến lược, nghiệp vụ, dữ liệu, ứng dụng và công nghệ.","points":["TOGAF ADM là phương pháp lặp để phát triển kiến trúc.","Bốn miền kiến trúc: nghiệp vụ, dữ liệu, ứng dụng và công nghệ.","Phân tích khoảng cách giữa hiện trạng và mục tiêu tạo ra lộ trình chuyển đổi."],"children":["TOGAF ADM","Kiến trúc nghiệp vụ","Kiến trúc ứng dụng","Kiến trúc công nghệ","ArchiMate","Quản trị kiến trúc"],"sub":[{"n":"TOGAF ADM","d":"Phương pháp phát triển kiến trúc của TOGAF, gồm các pha lặp: Preliminary, A đến H và quản lý yêu cầu ở trung tâm.","k":"Pha A (Tầm nhìn), B (Nghiệp vụ), C (Dữ liệu và ứng dụng), D (Công nghệ), E và F (Cơ hội, lộ trình), G (Quản trị triển khai), H (Quản lý thay đổi kiến trúc).","c":"ADM cần được điều chỉnh cho phù hợp tổ chức; áp dụng đầy đủ mọi pha cho dự án nhỏ là lãng phí.","e":"Chương trình hiện đại hóa hệ thống nhân sự đi qua pha A đến F để ra lộ trình chuyển đổi 3 năm."},{"n":"Kiến trúc nghiệp vụ","d":"Mô tả năng lực nghiệp vụ, quy trình, tổ chức và thông tin mà doanh nghiệp cần để thực hiện chiến lược.","k":"Bản đồ năng lực (capability map) ổn định hơn sơ đồ tổ chức và là khung liên kết chiến lược với ứng dụng.","c":"Vẽ lại sơ đồ tổ chức rồi gọi là kiến trúc nghiệp vụ.","e":"Bản đồ năng lực ngân hàng bán lẻ gồm Quản lý khách hàng, Cho vay, Thanh toán, Quản lý rủi ro, mỗi năng lực có chủ sở hữu."},{"n":"Kiến trúc ứng dụng","d":"Mô tả các ứng dụng, chức năng của chúng và mối quan hệ, tích hợp giữa các ứng dụng.","k":"Danh mục ứng dụng giúp phát hiện trùng lặp, ứng dụng lỗi thời và điểm tích hợp rủi ro.","c":"Danh mục ứng dụng không có chủ sở hữu nghiệp vụ và kỹ thuật nhanh chóng lỗi thời.","e":"Phát hiện 3 ứng dụng quản lý hồ sơ khác nhau cùng phục vụ một năng lực, đề xuất hợp nhất."},{"n":"Kiến trúc công nghệ","d":"Mô tả nền tảng hạ tầng, phần mềm nền và tiêu chuẩn công nghệ hỗ trợ ứng dụng.","k":"Danh sách tiêu chuẩn công nghệ phân loại: được khuyến nghị, được chấp nhận, đang loại bỏ, không được dùng.","c":"Không có tiêu chuẩn thì mỗi dự án chọn công nghệ riêng, làm tăng chi phí vận hành.","e":"Chuẩn hóa hai hệ quản trị CSDL cho ứng dụng mới; công nghệ cũ chỉ được duy trì, không mở rộng."},{"n":"ArchiMate","d":"Ngôn ngữ mô hình hóa kiến trúc doanh nghiệp của The Open Group, bổ trợ cho TOGAF.","k":"Các lớp chiến lược, nghiệp vụ, ứng dụng, công nghệ và triển khai; ký hiệu chuẩn giúp mọi người đọc cùng một cách.","c":"Mô hình quá chi tiết khó duy trì; mỗi góc nhìn nên phục vụ một câu hỏi của bên liên quan.","e":"Góc nhìn ArchiMate cho thấy quy trình phê duyệt khoản vay được hỗ trợ bởi ứng dụng nào và chạy trên hạ tầng nào."},{"n":"Quản trị kiến trúc","d":"Cơ chế bảo đảm các dự án tuân thủ nguyên tắc và tiêu chuẩn kiến trúc.","k":"Hội đồng kiến trúc xem xét giải pháp, cấp ngoại lệ có thời hạn, theo dõi mức tuân thủ.","c":"Quản trị biến thành cổng chặn chậm chạp nếu không có hướng dẫn rõ và vòng phản hồi nhanh.","e":"Mọi đề xuất thay đổi công nghệ (TCP) được hội đồng kiến trúc đánh giá theo bộ tiêu chí trước khi phê duyệt."}]},{"id":"governance","title":"Quản trị CNTT","summary":"Cơ chế bảo đảm CNTT tạo giá trị, kiểm soát rủi ro và tuân thủ quy định.","points":["COBIT phân biệt rõ quản trị (governance) và quản lý (management).","Danh mục đầu tư CNTT cần gắn với mục tiêu kinh doanh.","Ngân hàng chịu yêu cầu về an toàn hệ thống thông tin từ Ngân hàng Nhà nước."],"children":["COBIT 2019","Quản lý danh mục đầu tư","Quản lý rủi ro CNTT","Quản lý nhà cung cấp","Tuân thủ quy định"],"sub":[{"n":"COBIT 2019","d":"Khung quản trị và quản lý CNTT doanh nghiệp của ISACA, gồm 40 mục tiêu quản trị và quản lý.","k":"Tách quản trị (EDM: Đánh giá, Định hướng, Giám sát) và quản lý (APO, BAI, DSS, MEA); điều chỉnh theo yếu tố thiết kế của tổ chức.","c":"Áp dụng toàn bộ khung cùng lúc là quá tải; chọn mục tiêu ưu tiên theo rủi ro và chiến lược.","e":"Dùng mục tiêu APO12 (Quản lý rủi ro) và BAI06 (Quản lý thay đổi) làm trọng tâm năm đầu."},{"n":"Quản lý danh mục đầu tư","d":"Lựa chọn, ưu tiên và theo dõi các dự án, chương trình CNTT như một danh mục đầu tư.","k":"Đánh giá theo giá trị, rủi ro, mức độ phù hợp chiến lược và năng lực thực hiện; định kỳ dừng dự án không còn giá trị.","c":"Phê duyệt mọi dự án rồi dàn mỏng nguồn lực làm tất cả cùng chậm.","e":"Hội đồng đầu tư CNTT xếp hạng 25 đề xuất, phê duyệt 10 trong giới hạn ngân sách và nhân lực."},{"n":"Quản lý rủi ro CNTT","d":"Nhận diện, đánh giá và xử lý rủi ro liên quan đến công nghệ thông tin.","k":"Sổ rủi ro gắn với khẩu vị rủi ro của tổ chức; tích hợp với quản lý rủi ro hoạt động chung.","c":"Rủi ro CNTT được báo cáo bằng thuật ngữ kỹ thuật khiến lãnh đạo khó ra quyết định.","e":"Rủi ro ‘hệ thống lõi hết hỗ trợ của hãng’ được định lượng theo tác động gián đoạn dịch vụ và chi phí."},{"n":"Quản lý nhà cung cấp","d":"Quản lý quan hệ, hợp đồng, hiệu quả và rủi ro của nhà cung cấp dịch vụ công nghệ.","k":"Đánh giá trước khi ký, theo dõi SLA, đánh giá định kỳ và kế hoạch rút lui khi chấm dứt hợp đồng.","c":"Phụ thuộc vào một nhà cung cấp duy nhất cho dịch vụ trọng yếu mà không có phương án thay thế.","e":"Đánh giá bảo mật hằng năm với nhà cung cấp dịch vụ cloud và kiểm tra quyền truy cập hệ thống của họ."},{"n":"Tuân thủ quy định","d":"Bảo đảm hoạt động CNTT đáp ứng pháp luật, quy định ngành và chính sách nội bộ.","k":"Ánh xạ yêu cầu quy định vào biện pháp kiểm soát, thu thập bằng chứng và theo dõi thay đổi quy định.","c":"Tuân thủ theo đợt trước kiểm toán thay vì liên tục làm phát sinh lỗ hổng giữa các đợt.","e":"Ma trận ánh xạ các điều khoản quy định an toàn hệ thống thông tin vào kiểm soát và bằng chứng tương ứng."}]},{"id":"observability","title":"Giám sát và khả năng quan sát","summary":"Thu thập và phân tích tín hiệu để hiểu trạng thái hệ thống đang chạy.","points":["Ba loại tín hiệu chính: metrics, logs và traces.","Cảnh báo nên dựa trên triệu chứng ảnh hưởng đến người dùng.","SLO và error budget cân bằng giữa tốc độ thay đổi và độ tin cậy."],"children":["Metrics","Logs","Distributed tracing","Cảnh báo","SLI và SLO","Site Reliability Engineering (SRE)"],"sub":[{"n":"Metrics","d":"Số liệu đo lường dạng chuỗi thời gian như CPU, bộ nhớ, số yêu cầu, độ trễ, tỷ lệ lỗi.","k":"Phương pháp RED (Rate, Errors, Duration) cho dịch vụ và USE (Utilization, Saturation, Errors) cho tài nguyên.","c":"Đo trung bình che giấu vấn đề; nên theo dõi phân vị như p95, p99.","e":"Dashboard theo dõi số giao dịch mỗi giây, tỷ lệ lỗi và độ trễ p95 của API thanh toán."},{"n":"Logs","d":"Bản ghi sự kiện có dấu thời gian do ứng dụng và hệ thống sinh ra.","k":"Log có cấu trúc (JSON) dễ tìm kiếm và phân tích; tập trung log về một hệ thống; có mã định danh yêu cầu (correlation ID).","c":"Ghi dữ liệu nhạy cảm như mật khẩu, số thẻ vào log là vi phạ
